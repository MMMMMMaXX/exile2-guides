ly it as an aura or on hit while others require a dedicated skill. Plan your rotation so the debuff is actually on the enemy when your damage lands."],"bullets":["Curse Limit: caps how many Curses can be active on a single enemy at once (default low; raise via specific items or supports — pending PC verification for the 0.5.4 value).","Curse Effect: increases or decreases how strong a Curse is; bosses commonly have reduced Curse Effect.","Exposure duration: must be refreshed; coverage depends on how you apply it (on hit, as an aura, or via a dedicated skill).","Penetration has no uptime concern — it is a property of each hit and applies automatically."]},{"id":"choose-your-scaling","order":80,"title":"Which debuff should your build prioritise?","type":"diagnostic","visible":true,"toc":true,"intro":"Answer the questions below to find where to invest your debuff budget.","controls":[{"id":"damage-shape","label":"What is your main damage?","options":[{"label":"Direct hits","value":"hits"},{"label":"Damage over Time","value":"dot"},{"label":"Mixed / secondary skills matter","value":"mixed"}]},{"id":"uses-inversion","label":"Does your main skill use resistance inversion (e.g. Rakiata's Flow)?","options":[{"label":"Yes","value":"yes"},{"label":"No","value":"no"}]}],"rules":[{"title":"Stack reduction then penetration","when":{"damage-shape":"hits","uses-inversion":"no"},"steps":["Apply Exposure and/or a resistance Curse to lower the enemy's actual resistance.","Add Penetration on your main skill to reduce the value used at the final step.","Keep the debuff active and refresh it during the fight."]},{"title":"Avoid reduction on the inverted skill","when":{"damage-shape":"hits","uses-inversion":"yes"},"steps":["Do not apply Exposure or resistance Curses that consistently hit your inverted main skill — reduction is applied before inversion and shrinks the payoff.","Invest Penetration into secondary damage sources (Heralds, triggers) that do not have inversion.","Keep inversion on the main skill and reduction off its targets."]},{"title":"Prioritise Exposure and Curses","when":{"damage-shape":"dot"},"steps":["Focus on Exposure and resistance Curses, since they lower the enemy's actual resistance and DoT benefits from that.","Do not invest in Penetration for the DoT portion — it generally does not apply to standalone DoT.","Maintain uptime, since the debuff must be active when the DoT deals damage."]},{"title":"Split the budget","when":{"damage-shape":"mixed"},"steps":["Give Exposure/Curses to the hit that also seeds DoT, so both portions benefit.","Add Penetration for the direct-hit portion and for secondary non-inverted sources.","Treat exact split as pending PC verification and measure in-game."]}],"defaultResult":{"title":"General guidance","steps":["Lower the enemy's actual resistance with Exposure or a Curse when you are not using inversion.","Use Penetration for direct hits and for secondary non-inverted damage.","Keep debuff uptime high and respect the Curse Limit and boss curse-effect reduction."]}},{"id":"troubleshooting","order":90,"title":"Common mistakes","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["Most resistance problems come from mixing up which mechanic changes the enemy and which changes only your hit. The following pitfalls are the ones players report most often."],"bullets":["Adding lots of Penetration but seeing no damage change: the enemy's resistance may already be near 0% after Exposure/Curses, or your main skill uses inversion where Penetration becomes irrelevant.","Conflating Penetration with resistance reduction: Penetration does not change the enemy's persistent resistance, so it will not help other damage sources or Damage over Time.","Forgetting the Curse Limit: only a limited number of Curses can be active at once, so extra Curses do nothing if the limit is reached.","Ignoring boss curse-effect reduction: a Curse that looks huge on a normal monster may be heavily weakened on a boss.","Assuming Exposure lasts forever: it has a duration and must be refreshed, or your damage falls back to the enemy's full resistance.","Applying Exposure or Curses to an inverted main skill: reduction is applied before inversion and shrinks the inversion payoff, sometimes badly."]},{"id":"community-cases","order":100,"title":"Community debates","type":"card-grid","visible":true,"toc":true,"intro":"Frequently discussed confusions about resistance interaction in Path of Exile 2.","cards":[{"title":"Negative vs zero resistance","tag":"resistance","body":["Players debate whether Exposure or Curses can push an enemy below 0% resistance. They can lower the actual value below zero, but Penetration is typically capped at reducing the used value to 0%, so negative resistance usually comes from reduction, not Penetration."]},{"title":"Why bosses shrug off curses","tag":"curse","body":["A Curse that feels strong on packs can look weak on a boss because bosses commonly have reduced Curse Effect. The debuff is still applied, just weaker."]},{"title":"Penetration glove implicits","tag":"penetration","body":["Some players avoid Penetration implicits, fearing they harm inversion-based main skills. Penetration is local and checked last, so it does not reduce the inverted value; it is best spent on secondary damage."]},{"title":"Does Penetration work on DoT?","tag":"dot","body":["A common question with a subtle answer: Penetration is per hit, so standalone Damage over Time generally does not receive it, while Exposure and Curses do help DoT. Exact behavior is pending PC verification."]}]},{"id":"video-guide","order":110,"title":"Video guide","type":"video","visible":true,"toc":true,"entries":[{"label":"How to Scale Elemental Damage in Path of Exile 2 | Curses vs Exposure vs Penetration","creator":"MisoxShiru","description":"A focused walkthrough comparing Curses, Exposure, and Penetration in Path of Exile 2, how they stack in the damage pipeline, and when to use each.","takeaway":"Curses and Exposure lower the enemy's actual resistance; Penetration is a per-hit property applied last. Choose the debuff that matches your damage type and watch inversion anti-synergy.","url":"https://www.youtube.com/watch?v=isve7nLuW48","timestamps":[{"label":"Introduction","time":"0:00"},{"label":"Curses and resistance reduction","time":"1:30"},{"label":"Exposure explained","time":"4:00"},{"label":"Penetration explained","time":"7:20"},{"label":"How they stack in the damage pipeline","time":"10:10"},{"label":"Summary and build advice","time":"13:00"}]}]},{"id":"faq","order":120,"title":"Frequently asked questions","type":"faq","visible":true,"toc":true,"items":[{"question":"Does Penetration stack with Exposure and Curses?","answer":["Yes. They operate in different stages of the pipeline. Exposure and Curses lower the enemy's actual resistance, then Penetration is applied last to the value your hit uses. All three can be active together."]},{"question":"Why did adding more Penetration not increase my damage?","answer":["Common reasons: the enemy's resistance was already near 0% after Exposure and Curses, or your main skill uses resistance inversion (such as Rakiata's Flow) where Penetration becomes irrelevant, or you are hitting an enemy whose resistance is already negative from inversion."]},{"question":"Does Penetration work against Damage over Time?","answer":["Generally no for standalone Damage over Time, because Penetration is applied per hit and DoT is not a hit. Exposure and Curses do help DoT because they lower the enemy's actual resistance. The exact rule is version-sensitive and is pending PC verification."]},{"question":"Can Exposure apply to multiple elements at once?","answer":["Elemental Exposure typically reduces the relevant element(s), and some sources reduce all elemental resistances. The exact coverage depends on the skill or support granting it; confirm specifics as pending PC verification."]},{"question":"What is the Curse Limit and why does my boss take less curse effect?","answer":["The Curse Limit caps how many Curses can be active on a single enemy at once (the default is low; specific items or supports can raise it — pending PC verification for the 0.5.4 value). Bosses commonly have reduced Curse Effect, which weakens the resistance reduction a Curse provides against them."]},{"question":"Should I use Exposure or Curses with Rakiata's Flow?","answer":["Usually no for the inverted main skill. Resistance reduction is applied before inversion and shrinks the inversion payoff, and can even flip a low-resistance enemy into higher resistance after inversion. Keep reduction off the targets your inverted main skill hits, and invest Penetration into secondary damage instead."]}]},{"id":"sources","order":130,"title":"Sources and verification","type":"sources","visible":true,"toc":true,"categories":[{"label":"Official wiki - Resistance","description":"PoE2 wiki reference for resistance, resistance reduction, exposure, curses, and penetration behavior","url":"https://poe2wiki.net/wiki/Resistance"},{"label":"Mobalytics - Resistances Explained","description":"Community guide covering resistance caps, negative resistance, and how resistances mitigate damage in Path of Exile 2","url":"https://mobalytics.gg/poe-2/guides/resistances"},{"label":"Elyxir - PoE 2 Elemental Resistance Mechanics","description":"Community guide detailing the order of operations for reduction, inversion, and penetration, and that penetration is local and checked last","url":"https://www.elyxir.gg/guide/path-of-exile-2/poe-2-elemental-resistance-mechanics-using-rakiatas-flow-penetration-and-curses-the-right-way"},{"label":"Video guide (MisoxShiru)","description":"Video comparing Curses, Exposure, and Penetration in Path of Exile 2","url":"https://www.youtube.com/watch?v=isve7nLuW48"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":140,"title":"Changelog","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["Initial publication of the resistance, curse, exposure, and penetration guide for Path of Exile 2 Early Access 0.5.4.","Added direct answers, definitions, an interaction matrix, the damage-pipeline order of operations, worked examples for normal monsters vs bosses, a hit vs DoT comparison, debuff uptime and coverage, a scaling diagnostic, common mistakes, community debates, a video guide, FAQ, and sources.","Penetration is documented as a per-hit, locally applied, last-step mechanic that does not change the enemy's persistent resistance; exact Exposure values, Curse Limit, and the Penetration-versus-DoT rule are flagged for PC verification."]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 wiki - Resistance","url":"https://poe2wiki.net/wiki/Resistance","sourceType":"official"},{"label":"Mobalytics - Resistances Explained","url":"https://mobalytics.gg/poe-2/guides/resistances","sourceType":"community"},{"label":"Elyxir - PoE 2 Elemental Resistance Mechanics","url":"https://www.elyxir.gg/guide/path-of-exile-2/poe-2-elemental-resistance-mechanics-using-rakiatas-flow-penetration-and-curses-the-right-way","sourceType":"community"},{"label":"MisoxShiru - Curses vs Exposure vs Penetration (YouTube)","url":"https://www.youtube.com/watch?v=isve7nLuW48","sourceType":"community"}],"seo":{"title":"PoE 2 Resistance, Curses, Exposure & Penetration Guide","description":"How enemy resistances, Curses, Exposure, and Penetration interact in the Path of Exile 2 damage pipeline, and how to choose the right debuff for your build.","noindex":false}},{"id":"resistance-curse-exposure-penetration","slug":"resistance-curse-exposure-penetration","locale":"zh-cn","type":"guide","status":"published","featured":false,"title":"流放之路2 中的抗性、诅咒、Exposure 与穿透","shortTitle":"抗性、诅咒与穿透","summary":"抗性、抗性削减类诅咒、Exposure 与穿透在流放之路2 伤害流程中如何相互作用，以及你的流派该如何选择正确的减益。","description":"一份关于流放之路2 抗性交互的机制指南：诅咒、Exposure、穿透与 Ignore Resistance 的区别，它们在伤害流程中生效的顺序，它们对持续伤害的影响，覆盖与持续时间条件，以及优先级决策建议。","guideCategory":"mechanics","heroImage":"/images/skills/freezing-mark.webp","cardImage":"/images/skills/freezing-mark.webp","imageAlt":"流放之路2 印记技能图标，代表诅咒、Exposure 与穿透减益","estimatedReadingMinutes":16,"prerequisites":["基本了解敌人抗性如何按比例减免对应类型的伤害","熟悉在战斗中给敌人施加诅咒、印记或 Exposure"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","resistance","curse","exposure","penetration","damage","debuff"],"sections":[{"id":"quick-answer","order":10,"title":"直接回答","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"诅咒、Exposure 与穿透有什么区别？","body":["三者都能帮助你的伤害突破敌人抗性，但作用位置不同。诅咒和 Exposure 是施加在敌人身上的减益，会在持续期间降低敌人的实际抗性。穿透则是你每次命中自带的性质，只降低该次命中计算时所使用的抗性值——它永远不会改变敌人持久化的抗性。"]},{"title":"穿透会降低敌人真实的抗性吗？","body":["不会。在流放之路2 中，穿透是归属于你本次命中的属性，并且在抗性流程的最后一步才生效。它只会降低该次命中计算所用的抗性值，并不会改变敌人储存的、持久化的抗性，通常也无法把该值降到 0% 以下。"]},{"title":"Exposure 和诅咒会降低敌人真实的抗性吗？","body":["会，在它们的持续期间内。Exposure 与抗性类诅咒（例如元素虚弱）都是敌人身上减益，因此在生效期间敌人的实际抗性确实更低。但同时它们也有覆盖与持续时间条件需要注意，例如诅咒上限以及 Boss 的诅咒效果削减。"]},{"title":"这些机制会影响持续伤害吗？","body":["由于 Exposure 和诅咒降低的是敌人的实际抗性，因此持续伤害可以从中受益。穿透是按命中计算的，所以一个本身并非命中的独立持续伤害通常无法获得穿透加成。持续伤害与穿透的确切交互随版本变化——请参见实例计算部分，具体数值以 pending PC verification 为准。"]}]},{"id":"definitions","order":20,"title":"定义","type":"overview","visible":true,"toc":true,"paragraphs":["这四个术语描述了流放之路2 中伤害与敌人抗性交互的四种不同方式。厘清它们的区别是破解抗性困惑最常用的一步，因为其中两种（诅咒、Exposure）改变的是敌人，而另一种（穿透）只改变你的命中。","抗性是敌人的防御属性。诅咒和 Exposure 是施加在敌人身上、在持续期间降低其抗性的减益。穿透与 Ignore Resistance 则是附着在你伤害上的性质，改变该次命中抗性判定的结算方式。"],"bullets":["抗性：敌人对某类伤害（火焰、冰霜、闪电、混沌）的百分比减免。玩家默认抗性上限为 75%。","抗性削减：任何降低敌人抗性值的手段——最常见由 Exposure 与诅咒提供。","Exposure：施加在敌人身上的减益，在持续期间按百分比降低其对相关元素的抗性。它是敌人身上的减益，而不是你命中的属性。","穿透：你命中的属性，降低该次命中计算所用的抗性值。它归属于你、在最后生效，通常无法把该值降到 0% 以下。它不会改变敌人持久化的抗性。","Ignore Resistance：较为罕见的效果，令该次伤害实例把相关抗性视为 0%，并跳过之后对该实例的进一步抗性修正。它不会降低敌人储存的抗性。"]},{"id":"interaction-matrix","order":30,"title":"各机制如何交互","type":"data-table","visible":true,"toc":true,"caption":"核心对比。关键分水岭在于该机制是否改变敌人持久化的实际抗性（诅咒、Exposure），还是只改变你命中所用的数值（穿透、Ignore Resistance）。","columns":[{"key":"mechanic","label":"机制"},{"key":"changes-actual","label":"改变实际抗性？"},{"key":"affects-hit","label":"影响命中？"},{"key":"affects-dot","label":"影响持续伤害？"},{"key":"stacks","label":"与其他叠加？"},{"key":"upkeep","label":"需要持续维持？"}],"filters":[],"rows":[{"tags":["curse"],"cells":{"mechanic":"诅咒（例如元素虚弱）","changes-actual":"会，在持续期间（敌人身上的减益）","affects-hit":"会","affects-dot":"会（敌人抗性更低）","stacks":"会，与 Exposure 和穿透叠加","upkeep":"会（有持续时间，受诅咒上限限制）"}},{"tags":["exposure"],"cells":{"mechanic":"Exposure","changes-actual":"会，在持续期间（敌人身上的减益）","affects-hit":"会","affects-dot":"会（敌人抗性更低）","stacks":"会，与诅咒和穿透叠加","upkeep":"会（有持续时间，需要刷新）"}},{"tags":["penetration"],"cells":{"mechanic":"穿透","changes-actual":"不会（仅作用于该次命中）","affects-hit":"会","affects-dot":"通常不影响（按命中计算）","stacks":"会，与诅咒和 Exposure 叠加","upkeep":"不会（你命中的固有属性）"}},{"tags":["ignore-resistance"],"cells":{"mechanic":"Ignore Resistance","changes-actual":"不会（对该实例绕过抗性）","affects-hit":"会（把抗性视为 0%）","affects-dot":"取决于具体实现；以 pending PC verification 为准","stacks":"罕见；通常对该实例独立于其他削减","upkeep":"不会"}}],"note":"Exposure 的具体百分比与诅咒上限随版本变化——具体数值请以 pending PC verification 为准。上述结构性行为反映了当前 PoE2 的流程。"},{"id":"order","order":40,"title":"伤害流程中的生效顺序","type":"data-table","visible":true,"toc":true,"caption":"敌人抗性的修正遵循严格顺序。穿透永远在最后生效且归属于攻击者，因此它不会改变敌人持久化的抗性。","columns":[{"key":"step","label":"步骤"},{"key":"what-applies","label":"生效内容"},{"key":"note","label":"说明"}],"filters":[],"rows":[{"tags":[],"cells":{"step":"1. 基础值","what-applies":"敌人总抗性（包含地图与界石修正）","note":"后续所有步骤修改的起始值"}},{"tags":[],"cells":{"step":"2. 抗性削减","what-applies":"Exposure 与诅咒","note":"敌人身上的减益；可以把抗性降到 0% 以下"}},{"tags":[],"cells":{"step":"3. 反转（可选）","what-applies":"如 Rakiata's Flow 等效果","note":"翻转当前抗性值（正或负）；血统限定"}},{"tags":[],"cells":{"step":"4. 穿透","what-applies":"你命中的穿透","note":"最后生效，归属于你，通常无法降到 0% 以下"}}],"note":"由于穿透是最后一步且归属于攻击者，它既不会改变敌人持久化的抗性，也不会像 Exposure 和诅咒那样干扰反转。"},{"id":"boss-scenario","order":50,"title":"实例计算：普通怪物 vs Boss","type":"data-table","visible":true,"toc":true,"caption":"以拥有 75% 闪电抗性的敌人、一次 1000 点闪电伤害为例的教学计算。数值为教学用途；Exposure 的具体数值与 Boss 诅咒削减百分比以 pending PC verification 为准。","columns":[{"key":"case","label":"情形"},{"key":"setup","label":"配置"},{"key":"calculation","label":"计算"},{"key":"result","label":"结果"}],"filters":[],"rows":[{"tags":["no-debuff"],"cells":{"case":"普通怪物，无减益","setup":"敌人 75% 闪电抗性，1000 伤害，无穿透或 Exposure","calculation":"1000 x (1 - 0.75)","result":"250 点伤害"}},{"tags":["exposure","penetration"],"cells":{"case":"普通怪物，有 Exposure 与穿透","setup":"敌人 75% 抗性，Exposure -25%，20% 穿透，1000 伤害","calculation":"Exposure 把敌人降到 50%；穿透把所用值降到 30%；1000 x (1 - 0.30)","result":"700 点伤害"}},{"tags":["boss","curse"],"cells":{"case":"Boss，诅咒效果被削减","setup":"敌人 75% 抗性，Exposure -25% 但 Boss 仅承受 50% 诅咒效果，20% 穿透，1000 伤害","calculation":"实际 Exposure 仅 -12.5%，敌人降至 62.5%；穿透至 42.5%；1000 x (1 - 0.425)","result":"575 点伤害（覆盖情况不同于普通怪物）"}}],"note":"Boss 的例子说明持续时间与覆盖为何重要：同样的 Exposure 被 Boss 的诅咒效果削减后，实际伤害收益比普通怪物更小。"},{"id":"hit-vs-dot","order":60,"title":"命中流派 vs 持续伤害流派","type":"data-table","visible":true,"toc":true,"caption":"你的流派应该投资穿透还是 Exposure 与诅咒，取决于你的伤害是命中还是持续伤害。","columns":[{"key":"build-type","label":"流派类型"},{"key":"benefits-penetration","label":"能否从穿透受益？"},{"key":"benefits-exposure","label":"能否从 Exposure 受益？"},{"key":"notes","label":"说明"}],"filters":[],"rows":[{"tags":["hit"],"cells":{"build-type":"命中流派（直接命中）","benefits-penetration":"可以，直接受益","benefits-exposure":"可以（敌人抗性更低）","notes":"两层都生效；穿透在 Exposure 与诅咒之后最后结算。"}},{"tags":["dot"],"cells":{"build-type":"持续伤害流派","benefits-penetration":"通常不影响（持续伤害不是命中）","benefits-exposure":"可以（敌人抗性更低）","notes":"优先 Exposure 与诅咒；穿透通常对独立持续伤害无效。"}},{"tags":["hybrid"],"cells":{"build-type":"混合（命中并附带持续伤害）","benefits-penetration":"仅命中部分受益","benefits-exposure":"可以，两部分都受益","notes":"初始命中获得穿透；随后的持续伤害从敌人更低的抗性中受益。"}}],"note":"穿透与持续伤害的确切规则随版本变化；具体行为以 pending PC verification 为准。"},{"id":"debuff-uptime","order":70,"title":"减益的持续时间与覆盖","type":"overview","visible":true,"toc":true,"paragraphs":["Exposure 与诅咒的强度取决于它们的持续时间。诅咒必须施加到目标上，且只在减益持续期间存在，同时一个敌人能同时承受的诅咒数量受诅咒上限限制。在流放之路2 中，默认诅咒上限较低（通常为一），特定装备或辅助宝石可以提升它——0.5.4 的具体数值请以 pending PC verification 为准。","Boss 及其他强力敌人常常具有被削减的诅咒效果，这会削弱诅咒对其提供的抗性削减。Exposure 也需要刷新；它不会永久存在，有些技能在命中时施加，有些以光环形式或需要专门技能施加。请规划好你的循环，确保伤害落地时减益确实在敌人身上的。"],"bullets":["诅咒上限：限制单个敌人可同时承受的诅咒数量（默认较低；可通过特定装备或辅助提升——0.5.4 数值以 pending PC verification 为准）。","诅咒效果：增强或削弱诅咒强度；Boss 通常具有被削减的诅咒效果。","Exposure 持续时间：需要刷新；覆盖取决于施加方式（命中时、光环或专门技能）。","穿透没有持续时间问题——它是每次命中的属性，会自动生效。"]},{"id":"choose-your-scaling","order":80,"title":"你的流派该优先哪个减益？","type":"diagnostic","visible":true,"toc":true,"intro":"回答以下问题，找到该把减益预算投在哪里。","controls":[{"id":"damage-shape","label":"你的主要伤害是什么？","options":[{"label":"直接命中","value":"hits"},{"label":"持续伤害","value":"dot"},{"label":"混合 / 次要技能也很重要","value":"mixed"}]},{"id":"uses-inversion","label":"你的主技能是否使用抗性反转（例如 Rakiata's Flow）？","options":[{"label":"是","value":"yes"},{"label":"否","value":"no"}]}],"rules":[{"title":"先叠削减再叠穿透","when":{"damage-shape":"hits","uses-inversion":"no"},"steps":["施加 Exposure 和/或抗性诅咒来降低敌人的实际抗性。","在主技能上加穿透，在最后一步进一步降低所用数值。","保持减益生效，并在战斗中刷新它。"]},{"title":"不要在反转技能上施加削减","when":{"damage-shape":"hits","uses-inversion":"yes"},"steps":["不要在持续命中你反转主技能的敌人身上施加 Exposure 或抗性诅咒——削减在反转之前生效，会缩小反转收益。","把穿透投资到没有反转的次要伤害来源（如 Herald、触发技能）上。","主技能保留反转，目标身上避免削减。"]},{"title":"优先 Exposure 与诅咒","when":{"damage-shape":"dot"},"steps":["聚焦 Exposure 与抗性诅咒，因为它们降低敌人的实际抗性，持续伤害可从中受益。","不要为持续伤害部分投资穿透——它通常对独立持续伤害无效。","保持持续时间，因为持续伤害结算时减益必须处于生效状态。"]},{"title":"分配预算","when":{"damage-shape":"mixed"},"steps":["给同时产生持续伤害的命中施加 Exposure/诅咒，让两部分都受益。","为直接命中部分及无反转的次要来源添加穿透。","具体分配以 pending PC verification 为准，并在游戏内实测。"]}],"defaultResult":{"title":"通用建议","steps":["若未使用反转，先用 Exposure 或诅咒降低敌人实际抗性。","为直接命中及无反转的次要伤害使用穿透。","保持减益高覆盖率，并尊重诅咒上限与 Boss 的诅咒效果削减。"]}},{"id":"troubleshooting","order":90,"title":"常见错误","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["大多数抗性问题在于混淆了哪个机制改变敌人、哪个机制只改变你的命中。以下是玩家最常报告的一些误区。"],"bullets":["堆了很多穿透却没看到伤害变化：敌人抗性在 Exposure/诅咒后可能已接近 0%，或者你的主技能使用反转，此时穿透变得无关紧要。","把穿透与抗性削减混为一谈：穿透不会改变敌人持久化的抗性，因此无法帮助其他伤害来源或持续伤害。","忘记诅咒上限：同一时间能生效的诅咒数量有限，达到上限后额外诅咒无效。","忽视 Boss 的诅咒效果削减：在普通怪物身上很强的诅咒，在 Boss 身上可能被大幅削弱。","以为 Exposure 永久存在：它有持续时间需要刷新，否则你的伤害会回到敌人满抗性。","在反转主技能上施加 Exposure 或诅咒：削减在反转前生效，会缩小反转收益，有时影响很大。"]},{"id":"community-cases","order":100,"title":"社区讨论","type":"card-grid","visible":true,"toc":true,"intro":"流放之路2 抗性交互中常被讨论的一些困惑。","cards":[{"title":"负抗性与零抗性","tag":"resistance","body":["玩家争论 Exposure 或诅咒能否把敌人抗性压到 0% 以下。它们确实可以把实际值降到负数，但穿透通常只能把所用值降到 0%，因此负抗性一般来自削减而非穿透。"]},{"title":"为什么 Boss 无视诅咒","tag":"curse","body":["在杂兵身上很强的诅咒，在 Boss 身上可能显得很弱，因为 Boss 通常具有被削减的诅咒效果。减益仍然被施加，只是更弱。"]},{"title":"穿透手套词缀","tag":"penetration","body":["部分玩家回避穿透词缀，担心会破坏基于反转的主技能。穿透归属于你且在最后结算，因此不会降低被反转的数值；最好把它用在次要伤害上。"]},{"title":"穿透对持续伤害有效吗？","tag":"dot","body":["一个答案微妙的常见问题：穿透是按命中计算的，因此独立持续伤害通常无法获得它，而 Exposure 与诅咒确实能帮助持续伤害。确切行为以 pending PC verification 为准。"]}]},{"id":"video-guide","order":110,"title":"视频指南","type":"video","visible":true,"toc":true,"entries":[{"label":"How to Scale Elemental Damage in Path of Exile 2 | Curses vs Exposure vs Penetration","creator":"MisoxShiru","description":"一段聚焦对比流放之路2 中诅咒、Exposure 与穿透的讲解，介绍它们在伤害流程中如何叠加，以及何时使用哪一种。","takeaway":"诅咒和 Exposure 降低敌人实际抗性；穿透是最后生效的每命中属性。请选择匹配你伤害类型的减益，并留意反转的负面协同。","url":"https://www.youtube.com/watch?v=isve7nLuW48","timestamps":[{"label":"简介","time":"0:00"},{"label":"诅咒与抗性削减","time":"1:30"},{"label":"Exposure 讲解","time":"4:00"},{"label":"穿透讲解","time":"7:20"},{"label":"它们在伤害流程中如何叠加","time":"10:10"},{"label":"总结与流派建议","time":"13:00"}]}]},{"id":"faq","order":120,"title":"常见问题","type":"faq","visible":true,"toc":true,"items":[{"question":"穿透会与 Exposure 和诅咒叠加吗？","answer":["会。它们作用于流程的不同阶段。Exposure 与诅咒先降低敌人实际抗性，随后穿透在最后对你命中所用的数值生效。三者可以共存。"]},{"question":"为什么加了很多穿透却没提升伤害？","answer":["常见原因：在 Exposure 和诅咒之后敌人抗性已接近 0%，或者你的主技能使用抗性反转（如 Rakiata's Flow）使穿透变得无关紧要，或者你命中的敌人抗性已被反转压到负数。"]},{"question":"穿透对持续伤害有效吗？","answer":["对独立持续伤害通常无效，因为穿透按命中计算而持续伤害不是命中。Exposure 和诅咒能帮助持续伤害，因为它们降低敌人实际抗性。确切规则随版本变化，以 pending PC verification 为准。"]},{"question":"Exposure 能同时作用于多种元素吗？","answer":["元素 Exposure 通常降低相关元素的抗性，部分来源会降低全部元素抗性。具体覆盖取决于提供它的技能或辅助；具体细节以 pending PC verification 为准。"]},{"question":"什么是诅咒上限，为什么我的 Boss 诅咒效果更弱？","answer":["诅咒上限限制单个敌人可同时承受的诅咒数量（默认较低；特定装备或辅助可提升——0.5.4 数值以 pending PC verification 为准）。Boss 通常具有被削减的诅咒效果，从而削弱诅咒对其提供的抗性削减。"]},{"question":"我应该和 Rakiata's Flow 一起使用 Exposure 或诅咒吗？","answer":["对反转主技能通常不应该。抗性削减在反转之前生效，会缩小反转收益，甚至可能在反转后把低抗性敌人翻转为更高抗性。请避免在你反转主技能命中的目标上施加削减，转而把穿透投资到次要伤害上。"]}]},{"id":"sources","order":130,"title":"来源与验证","type":"sources","visible":true,"toc":true,"categories":[{"label":"官方 wiki - Resistance","description":"PoE2 wiki 关于抗性、抗性削减、Exposure、诅咒与穿透行为的参考","url":"https://poe2wiki.net/wiki/Resistance"},{"label":"Mobalytics - Resistances Explained","description":"社区指南，涵盖流放之路2 中抗性上限、负抗性及抗性如何减免伤害","url":"https://mobalytics.gg/poe-2/guides/resistances"},{"label":"Elyxir - PoE 2 Elemental Resistance Mechanics","description":"社区指南，详述削减、反转与穿透的生效顺序，以及穿透归属于你且在最后结算","url":"https://www.elyxir.gg/guide/path-of-exile-2/poe-2-elemental-resistance-mechanics-using-rakiatas-flow-penetration-and-curses-the-right-way"},{"label":"视频指南（MisoxShiru）","description":"对比流放之路2 中诅咒、Exposure 与穿透的视频","url":"https://www.youtube.com/watch?v=isve7nLuW48"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":140,"title":"更新日志","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["针对流放之路2 Early Access 0.5.4 首次发布抗性、诅咒、Exposure 与穿透指南。","新增直接回答、定义、交互矩阵、伤害流程生效顺序、普通怪物 vs Boss 实例计算、命中 vs 持续伤害对比、减益持续时间与覆盖、缩放决策、常见错误、社区讨论、视频指南、常见问题与来源。","将穿透记录为按命中、归属自身、最后结算、不改变敌人持久化抗性的机制；Exposure 具体数值、诅咒上限及穿透与持续伤害的规则已标注待 PC 验证。"]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 wiki - Resistance","url":"https://poe2wiki.net/wiki/Resistance","sourceType":"official"},{"label":"Mobalytics - Resistances Explained","url":"https://mobalytics.gg/poe-2/guides/resistances","sourceType":"community"},{"label":"Elyxir - PoE 2 Elemental Resistance Mechanics","url":"https://www.elyxir.gg/guide/path-of-exile-2/poe-2-elemental-resistance-mechanics-using-rakiatas-flow-penetration-and-curses-the-right-way","sourceType":"community"},{"label":"MisoxShiru - Curses vs Exposure vs Penetration (YouTube)","url":"https://www.youtube.com/watch?v=isve7nLuW48","sourceType":"community"}],"seo":{"title":"流放之路2 抗性、诅咒、Exposure 与穿透指南","description":"抗性、诅咒、Exposure 与穿透在流放之路2 伤害流程中如何相互作用，以及你的流派该如何选择正确的减益。","noindex":false}},{"id":"accuracy-distance-penalty-hit-chance","slug":"accuracy-distance-penalty-hit-chance","locale":"en","type":"guide","status":"published","featured":false,"title":"Accuracy Rating, Distance Penalty, and Hit Chance in Path of Exile 2","shortTitle":"Accuracy & Hit Chance","summary":"How Accuracy, Evasion, and the ranged distance penalty determine whether your attacks hit in Path of Exile 2, and how to fix low hit chance without guessing.","description":"A mechanics guide to Path of Exile 2 hit chance: how Accuracy compares to Evasion, how ranged attacks lose effective accuracy at long range, and practical ways to raise your chance to hit while avoiding common misreads.","guideCategory":"mechanics","heroImage":"/images/skills/snipe.webp","cardImage":"/images/skills/snipe.webp","imageAlt":"A Path of Exile 2 sniper skill icon representing accuracy rating and hit chance at range","estimatedReadingMinutes":14,"prerequisites":["Basic understanding of the character panel and item tooltip","Familiarity with the Accuracy and Evasion stats shown on gear"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","accuracy","evasion","hit-chance","distance","attack","troubleshooting"],"sections":[{"id":"quick-answer","order":10,"title":"Direct answers","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"Do attacks need Accuracy to hit?","body":["Yes. Attacks roll your Accuracy Rating against the target's Evasion Rating to decide the chance to hit. A melee or ranged attack that cannot beat the evasion check will miss."]},{"title":"Do spells check Accuracy?","body":["Generally no. Most spells in Path of Exile 2 bypass the Accuracy versus Evasion check entirely. Some skills are explicitly tagged 'Always Hit' or 'Cannot Be Evaded', but the default for spells is that they do not depend on your Accuracy Rating."]},{"title":"Why does a 100% shown chance still miss at range?","body":["The panel chance is computed at a reference distance. Ranged attacks lose effective accuracy as the target gets farther away, so the real chance at long range can be well below the displayed number — and even a near-100% readout can miss at extreme range."]},{"title":"What removes evasion as a factor?","body":["Effects such as 'Hits Cannot Be Evaded' or the Resolute Technique keystone stop the target's Evasion from reducing your hit chance, but they carry trade-offs (for example giving up critical-strike scaling) that you must weigh per build."]}]},{"id":"definitions","order":20,"title":"Key terms","type":"overview","visible":true,"toc":true,"paragraphs":["Four ideas sit at the heart of whether your damage connects. Accuracy Rating is your offensive roll for attacks; Evasion Rating is the defensive roll enemies use to avoid being hit by attacks. Chance to Hit is the resulting percentage that decides if an individual attack lands. Distance is how far your character stands from the target, and it matters specifically for ranged attacks.","Spells are a separate category: in Path of Exile 2 most spells do not perform an Accuracy check at all, so their connection is governed by other rules rather than the Accuracy versus Evasion contest."],"bullets":["Accuracy Rating: the stat your attacks use to try to beat a target's Evasion.","Evasion Rating: the defensive stat that lets a target avoid incoming attacks.","Chance to Hit: the displayed percentage that an attack will connect.","Distance: how far you are from the target; it applies a penalty to ranged accuracy."]},{"id":"chance-to-hit-structure","order":30,"title":"How Chance to Hit is built","type":"overview","visible":true,"toc":true,"paragraphs":["Your displayed Chance to Hit for an attack is produced by comparing your Accuracy Rating to the target's Evasion Rating. The relationship has a diminishing-return shape: raising Accuracy when you are already far above the target's Evasion yields smaller gains, while raising Accuracy when you are far below it yields large gains.","The exact numerical curve uses coefficients that are version-sensitive in Path of Exile 2 Early Access and should be confirmed inside the current client rather than trusted from a fixed formula. Treat the structure as 'Accuracy versus Evasion decides a percentage that climbs toward a high cap as your Accuracy outgrows their Evasion' and confirm precise numbers in-game.","Separately from that curve, ranged attacks apply a distance factor that reduces effective accuracy as the target moves farther away. That distance factor is what makes the panel readout optimistic at long range."],"bullets":["Higher Accuracy relative to Evasion means a higher hit chance.","The gain per point of Accuracy shrinks as you already out-scale the target's Evasion.","A distance factor reduces effective accuracy for ranged attacks specifically.","Exact coefficients are version-sensitive; confirm them in the current client."]},{"id":"formula-variables","order":40,"title":"Variables in the hit-chance calculation","type":"data-table","visible":true,"toc":true,"caption":"The inputs that feed the hit-chance result. Exact coefficients are version-sensitive and must be confirmed in the current client.","columns":[{"key":"variable","label":"Variable"},{"key":"meaning","label":"What it is"},{"key":"effect","label":"How it changes hit chance"},{"key":"confidence","label":"Confidence"}],"filters":[],"rows":[{"tags":["accuracy"],"cells":{"variable":"Accuracy Rating","meaning":"Your offensive stat for attacks","effect":"Higher Accuracy raises the hit chance against a given Evasion","confidence":"Stable structure; exact curve coefficients version-sensitive"}},{"tags":["evasion"],"cells":{"variable":"Evasion Rating (target)","meaning":"The target's defensive stat against attacks","effect":"Higher Evasion lowers your hit chance against that target","confidence":"Stable structure; exact curve coefficients version-sensitive"}},{"tags":["distance"],"cells":{"variable":"Distance factor","meaning":"Penalty applied to ranged attacks as range grows","effect":"Reduces effective accuracy at long range; melee is unaffected","confidence":"Real mechanic; exact start distance and falloff version-sensitive"}},{"tags":["result"],"cells":{"variable":"Final hit chance","meaning":"Displayed percentage for the attack","effect":"Climbs with Accuracy and falls with Evasion and range","confidence":"Shown on the tooltip; real value at range may be lower"}}],"note":"Do not trust a fixed numeric formula copied from older references; confirm the coefficients in the current client."},{"id":"distance-penalty","order":50,"title":"The distance penalty for ranged attacks","type":"overview","visible":true,"toc":true,"paragraphs":["Ranged attacks in Path of Exile 2 suffer a distance penalty: the farther your target, the lower your effective accuracy becomes. This is why a sniper or bow character can show a high panel hit chance up close yet start missing once enemies are far across the screen.","The penalty is a ranged-attack mechanic. Melee attacks, which connect at point-blank range, are not subject to the same range-based accuracy loss. The exact point at which the penalty begins and how steeply it falls off are version-sensitive, so confirm them in-game rather than memorising a fixed number.","A practical consequence: even a panel readout near 100% is not a guarantee at extreme range. The distance factor can pull the real chance below the displayed value, so positioning matters for ranged builds."],"bullets":["Ranged attacks lose effective accuracy as distance grows.","Melee attacks are not subject to the same range penalty.","A near-100% panel chance can still miss at long range.","Exact start distance and falloff rate are version-sensitive."]},{"id":"skill-matrix","order":60,"title":"Which skill types check Accuracy?","type":"data-table","visible":true,"toc":true,"caption":"How the Accuracy check applies across skill categories in Path of Exile 2. Spells generally bypass it; attacks generally use it.","columns":[{"key":"skill-type","label":"Skill type"},{"key":"checks-accuracy","label":"Checks Accuracy?"},{"key":"notes","label":"Notes"}],"filters":[],"rows":[{"tags":["attack"],"cells":{"skill-type":"Attack","checks-accuracy":"Yes","notes":"Most attacks roll Accuracy against Evasion. Ranged attacks also suffer the distance penalty."}},{"tags":["spell"],"cells":{"skill-type":"Spell","checks-accuracy":"Generally no","notes":"Most spells bypass the Accuracy versus Evasion check. Some skills are explicitly Always Hit or Cannot Be Evaded."}},{"tags":["minion"],"cells":{"skill-type":"Minion","checks-accuracy":"Depends on minion","notes":"Minions use their own accuracy rules, which are not the same as the player's. Do not assume player accuracy applies to minions."}},{"tags":["totem"],"cells":{"skill-type":"Totem","checks-accuracy":"Yes (inherits skill)","notes":"A totem using an attack skill performs that skill's accuracy check as if the owner cast it."}},{"tags":["triggered"],"cells":{"skill-type":"Triggered","checks-accuracy":"Depends on trigger","notes":"A triggered attack checks Accuracy; a triggered spell generally does not. Follow the underlying skill's type."}}],"note":"Minion accuracy behaviour is version-sensitive; confirm current rules in-game rather than copying older references."},{"id":"worked-examples","order":70,"title":"Worked examples","type":"data-table","visible":true,"toc":true,"caption":"Illustrative cases showing how distance and skill type change whether a hit lands. Numbers are qualitative, not exact coefficients.","columns":[{"key":"case","label":"Case"},{"key":"distance","label":"Distance"},{"key":"result","label":"Result"}],"filters":[],"rows":[{"tags":["melee"],"cells":{"case":"Close-range attack vs normal enemy","distance":"Point blank / melee","result":"Panel hit chance is representative; the attack almost always connects."}},{"tags":["ranged"],"cells":{"case":"Long-range attack vs normal enemy","distance":"Far across the screen","result":"Distance penalty reduces effective accuracy; high panel chance can still miss."}},{"tags":["spell"],"cells":{"case":"Spell at any range","distance":"Not applicable","result":"Spells bypass the Accuracy check, so the distance penalty does not apply to the hit roll."}},{"tags":["range-penalty"],"cells":{"case":"Near-100% shown chance at extreme range","distance":"Maximum range","result":"Distance factor can still cause a miss; the displayed number is not a guarantee at range."}}],"note":"Use these as mental models only; confirm real thresholds inside the current client."},{"id":"fix-low-hit-chance","order":80,"title":"Fix low hit chance","type":"diagnostic","visible":true,"toc":true,"intro":"Pick the likely cause of your missed attacks. The tool points to the next step.","controls":[{"id":"cause","label":"Where is the miss coming from?","options":[{"label":"Low Accuracy on gear","value":"gear"},{"label":"No accuracy from passives or tree","value":"passives"},{"label":"Standing too far from target","value":"positioning"},{"label":"Boss or evasive enemy","value":"keystone"}]}],"rules":[{"title":"Raise Accuracy on gear","when":{"cause":"gear"},"steps":["Look for Accuracy Rating on weapons, rings, and amulets.","Prefer flat Accuracy plus any percent increases on gear.","Re-check the tooltip hit chance after each swap."]},{"title":"Take accuracy on the passive tree","when":{"cause":"passives"},"steps":["Allocate passive nodes and notable clusters that grant Accuracy.","Check class and ascendancy nodes for accuracy bonuses.","Confirm the tooltip hit chance rises after respeccing."]},{"title":"Improve positioning","when":{"cause":"positioning"},"steps":["Move closer so the distance penalty is smaller for ranged attacks.","Use movement skills to close gaps against evasive enemies.","Re-test the same target at short range to see the penalty removed."]},{"title":"Handle evasive or boss enemies","when":{"cause":"keystone"},"steps":["Consider Hits Cannot Be Evaded or Resolute Technique to ignore Evasion.","Weigh the trade-off: Resolute Technique gives up critical-strike scaling.","Combine with Accuracy only if you still rely on crit or other checks."]}],"defaultResult":{"title":"General fix path","steps":["Confirm the miss is an accuracy issue and not a resist or damage problem.","Raise Accuracy through gear and passives first.","Then fix positioning, and only consider a keystone trade-off last."]}},{"id":"crit-interaction","order":90,"title":"How Accuracy and Evasion interact with critical hits","type":"overview","visible":true,"toc":true,"paragraphs":["A critical strike can only happen on a hit that lands. If the attack misses the accuracy versus evasion check, it cannot deal a critical hit — the crit never rolls. This means your effective critical-hit rate is gated by your hit chance, not just by your listed Critical Hit Chance.","For a crit-focused build, raising Accuracy is therefore double-valued: it both lands more hits and unlocks more of the crits those hits could have carried. Conversely, a very high Critical Hit Chance with poor Accuracy wastes most of that potential on misses."],"bullets":["A miss cannot crit — the hit must land first.","Effective crit rate equals hit chance multiplied by listed crit chance.","Accuracy investment pays off twice on crit builds.","Low hit chance silently wastes Critical Hit Chance."]},{"id":"troubleshooting","order":100,"title":"Common misreads","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["Most hit-chance problems come from reading the panel as if it were the whole story. These are the traps players fall into most often."],"bullets":["Seeing ~100% on the panel but still missing far away, because the distance penalty is not reflected in the close-range readout.","Assuming every projectile needs Accuracy — many spells bypass the check entirely.","Forgetting that bosses and evasive enemies have high Evasion, so your normal-map hit chance drops against them.","Treating the displayed chance as a guaranteed hit at any range — it is not.","Assuming minion accuracy equals your own accuracy — minions follow their own rules.","Thinking Resolute Technique or Hits Cannot Be Evaded solves everything, ignoring the critical-strike trade-off."]},{"id":"community-cases","order":110,"title":"Common player questions","type":"card-grid","visible":true,"toc":true,"intro":"Paraphrased confusions players frequently raise about accuracy and hit chance.","cards":[{"title":"Why do I miss with 100% shown?","tag":"distance","body":["The panel chance is measured at a reference distance. Ranged attacks lose effective accuracy at long range, so the real chance can be lower than the readout."]},{"title":"Do my spells need accuracy?","tag":"spell","body":["Most spells do not perform the Accuracy versus Evasion check. Players often over-invest in Accuracy on spell builds for no benefit."]},{"title":"Do my minions use my accuracy?","tag":"minion","body":["Minions follow their own accuracy rules, which are not the same as the player's. Do not assume shared accuracy."]},{"title":"Bosses dodge everything","tag":"boss","body":["High-Evasion bosses lower your hit chance well below your map-clearing number. Plan accuracy or an evasion-ignore option for bossing."]}]},{"id":"video-guide","order":120,"title":"Video guide","type":"video","visible":true,"toc":true,"entries":[{"label":"How to see your Hit Chance in Path of Exile 2 (Accuracy Rating)","creator":"Bue","description":"A clear walkthrough of where to find and read your hit chance, how Accuracy compares to Evasion, and how the ranged distance penalty works in Path of Exile 2.","takeaway":"Open the character panel to read your real hit chance, then raise Accuracy or close distance to stop missing at range.","url":"https://www.youtube.com/watch?v=UiHcZFe2xCo","timestamps":[{"label":"Introduction","time":"0:00"},{"label":"Where to see hit chance","time":"1:05"},{"label":"Accuracy versus Evasion","time":"3:40"},{"label":"The distance penalty","time":"6:20"},{"label":"Fixes for low hit chance","time":"9:10"},{"label":"Summary","time":"11:30"}]}]},{"id":"faq","order":130,"title":"Frequently asked questions","type":"faq","visible":true,"toc":true,"items":[{"question":"Is hit chance the same as the number on my tooltip?","answer":["At close range it is representative, but for ranged attacks the distance penalty means the real chance at long range can be lower than the tooltip shows. Read the tooltip as a reference-distance value."]},{"question":"Do spells use Accuracy in Path of Exile 2?","answer":["Most spells do not check Accuracy against Evasion. Investing in Accuracy for a pure spell build usually does nothing for hit rate. Some skills are explicitly Always Hit or Cannot Be Evaded regardless."]},{"question":"Why do I miss bosses but not trash mobs?","answer":["Bosses and evasive enemies carry much higher Evasion Rating, which lowers your hit chance against them. Your map-clearing accuracy may be far too low for boss content."]},{"question":"Does Resolute Technique make me always hit?","answer":["It removes Evasion as a factor for your hits, but it also typically gives up critical-strike scaling, so it is a trade-off rather than a free upgrade. Weigh it against your build's crit reliance."]},{"question":"Do minions share my Accuracy?","answer":["No. Minions use their own accuracy rules, which differ from the player's. Do not assume raising your Accuracy improves your minions' hit chance."]}]},{"id":"sources","order":140,"title":"Sources and verification","type":"sources","visible":true,"toc":true,"categories":[{"label":"Official wiki - Accuracy","description":"PoE2 wiki reference for Accuracy, Evasion, and the hit-chance relationship","url":"https://poe2wiki.net/wiki/Accuracy"},{"label":"Maxroll PoE2 hub","description":"Community mechanics hub covering accuracy and evasion in Path of Exile 2","url":"https://maxroll.gg/poe2"},{"label":"Mobalytics PoE2 hub","description":"Community mechanics hub with build and accuracy guidance","url":"https://mobalytics.gg/path-of-exile-2/"},{"label":"Video guide (Bue)","description":"YouTube walkthrough of reading hit chance and the distance penalty in Path of Exile 2","url":"https://www.youtube.com/watch?v=UiHcZFe2xCo"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":150,"title":"Changelog","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["Initial publication of the accuracy, distance penalty, and hit chance guide for Path of Exile 2 Early Access 0.5.4.","Added quick answers, key terms, hit-chance structure, variables table, distance penalty, skill matrix, worked examples, diagnostic, crit interaction, troubleshooting, community cases, video, FAQ, and sources."]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 wiki - Accuracy","url":"https://poe2wiki.net/wiki/Accuracy","sourceType":"official"},{"label":"Maxroll - Path of Exile 2 hub","url":"https://maxroll.gg/poe2","sourceType":"community"},{"label":"Mobalytics - Path of Exile 2 hub","url":"https://mobalytics.gg/path-of-exile-2/","sourceType":"community"},{"label":"Bue - How to see your Hit Chance in PoE2 (YouTube)","url":"https://www.youtube.com/watch?v=UiHcZFe2xCo","sourceType":"community"}],"seo":{"title":"PoE 2 Accuracy, Distance Penalty & Hit Chance Guide","description":"How Accuracy compares to Evasion, how ranged attacks lose hit chance at distance, and how to fix low hit chance in Path of Exile 2.","noindex":false}},{"id":"accuracy-distance-penalty-hit-chance","slug":"accuracy-distance-penalty-hit-chance","locale":"zh-cn","type":"guide","status":"published","featured":false,"title":"流放之路2 命中率、距离惩罚与击中几率","shortTitle":"命中率与击中","summary":"在流放之路2中，命中率、闪避以及远程距离惩罚如何决定你的攻击是否命中，以及如何在不靠猜测的情况下解决低命中率问题。","description":"一篇关于流放之路2击中几率的机制指南：命中率如何与闪避对比，远程攻击在远距离如何损失有效命中率，以及提升命中率的实用方法，同时避免常见误读。","guideCategory":"mechanics","heroImage":"/images/skills/snipe.webp","cardImage":"/images/skills/snipe.webp","imageAlt":"流放之路2 狙击技能图标，代表命中率与远距离命中","estimatedReadingMinutes":14,"prerequisites":["了解角色面板与物品悬浮窗的基本用法","熟悉装备上显示的命中率与闪避属性"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","accuracy","evasion","hit-chance","distance","attack","troubleshooting"],"sections":[{"id":"quick-answer","order":10,"title":"直接回答","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"攻击需要命中率才能命中吗？","body":["需要。攻击会将你的命中率与目标的闪避进行判定，以决定击中几率。近战或远程攻击若无法压过闪避判定，就会未命中。"]},{"title":"法术会检测命中率吗？","body":["通常不会。流放之路2中大多法术完全绕过命中率与闪避的判定。部分技能明确标注“必定命中”或“无法被闪避”，但法术的默认行为是不依赖你的命中率。"]},{"title":"为什么显示100%仍会在远距离未命中？","body":["面板几率是在参考距离下计算的。远程攻击随着目标变远会损失有效命中率，因此在远距离时真实几率可能远低于显示数值——即便读数为接近100%也可能在极限距离未命中。"]},{"title":"什么能让闪避不再成为因素？","body":["“击中无法被闪避”或“坚决技巧（Resolute Technique）”这类效果会阻止目标的闪避降低你的命中率，但它们有取舍（例如放弃暴击收益），需按构筑权衡。"]}]},{"id":"definitions","order":20,"title":"关键术语","type":"overview","visible":true,"toc":true,"paragraphs":["你的伤害能否命中有四个核心概念。命中率是攻击方用于对抗目标闪避的进攻数值；闪避率是目标用于躲避攻击的防御数值。击中几率是最终决定单次攻击是否命中的百分比。距离是你与目标之间的间隔，它特别影响远程攻击。","法术是另一类：在流放之路2中，大多数法术完全不进行命中率判定，因此它们的命中由其他规则决定，而非命中率与闪避的对抗。"],"bullets":["命中率：攻击用于尝试压过目标闪避的属性。","闪避率：让目标躲避来袭攻击的防御属性。","击中几率：显示攻击是否会命中的百分比。","距离：你与目标的间隔；它会对远程命中率施加惩罚。"]},{"id":"chance-to-hit-structure","order":30,"title":"击中几率如何构成","type":"overview","visible":true,"toc":true,"paragraphs":["攻击所显示的击中几率，是通过将你的命中率与目标的闪避对比得出的。该关系呈收益递减的形状：当你已远超目标闪避时，继续提升命中率的收益变小；当你远低于目标闪避时，提升命中率收益很大。","精确的曲线系数在流放之路2抢先体验版本中是随版本变化的，应在当前客户端内确认，而非套用固定公式。可将其结构理解为“命中率相对闪避决定一个百分比，随着你的命中率超过对方闪避而向高值攀升”，具体数值请在游戏内确认。","除了该曲线之外，远程攻击还会施加一个距离系数，随着目标越远而降低有效命中率。正是这个系数让面板读数在远距离显得过于乐观。"],"bullets":["相对闪避更高的命中率意味着更高的命中几率。","当你已远超目标闪避时，每点命中率的收益递减。","距离系数专门降低远程攻击的有效命中率。","精确系数随版本变化，请在当前客户端确认。"]},{"id":"formula-variables","order":40,"title":"击中计算中的变量","type":"data-table","visible":true,"toc":true,"caption":"影响击中结果的输入项。精确系数随版本变化，必须在当前客户端确认。","columns":[{"key":"variable","label":"变量"},{"key":"meaning","label":"含义"},{"key":"effect","label":"如何影响命中率"},{"key":"confidence","label":"把握度"}],"filters":[],"rows":[{"tags":["accuracy"],"cells":{"variable":"命中率","meaning":"你用于攻击的进攻属性","effect":"更高的命中率会提高对既定闪避目标的命中几率","confidence":"结构稳定；精确曲线系数随版本变化"}},{"tags":["evasion"],"cells":{"variable":"闪避率（目标）","meaning":"目标对抗攻击的防御属性","effect":"更高的闪避会降低你命中该目标的几率","confidence":"结构稳定；精确曲线系数随版本变化"}},{"tags":["distance"],"cells":{"variable":"距离系数","meaning":"随距离增长而施加于远程攻击的惩罚","effect":"在远距离降低有效命中率；近战不受影响","confidence":"确为机制；起始距离与衰减幅度随版本变化"}},{"tags":["result"],"cells":{"variable":"最终命中几率","meaning":"攻击显示的百分比","effect":"随命中率提升、随闪避与距离降低","confidence":"显示在悬浮窗；远距离真实值可能更低"}}],"note":"不要套用从旧资料复制的固定数值公式；请在当前客户端确认系数。"},{"id":"distance-penalty","order":50,"title":"远程攻击的距离惩罚","type":"overview","visible":true,"toc":true,"paragraphs":["流放之路2中的远程攻击承受距离惩罚：目标越远，你的有效命中率越低。这正是狙击或弓系角色近身显示高面板命中率、却在屏幕另一端敌人远处开始未命中的原因。","该惩罚是远程攻击专属机制。在贴身距离命中的近战攻击不受同样的距离命中率损失影响。惩罚具体从何处开始、衰减有多陡，均随版本变化，因此请在游戏内确认，而非死记固定数字。","一个实际后果：即便面板读数接近100%也不能保证在极限距离命中。距离系数会把真实几率拉到显示值以下，因此走位对远程构筑很重要。"],"bullets":["远程攻击随距离增长而损失有效命中率。","近战攻击不受同样的距离惩罚影响。","接近100%的面板几率在远距离仍可能未命中。","起始距离与衰减幅度随版本变化。"]},{"id":"skill-matrix","order":60,"title":"哪些技能类型检测命中率？","type":"data-table","visible":true,"toc":true,"caption":"在流放之路2中准确率检查如何作用于各技能类别。法术通常绕过它；攻击通常使用它。","columns":[{"key":"skill-type","label":"技能类型"},{"key":"checks-accuracy","label":"是否检测命中率？"},{"key":"notes","label":"说明"}],"filters":[],"rows":[{"tags":["attack"],"cells":{"skill-type":"攻击","checks-accuracy":"是","notes":"大多攻击将命中率与闪避进行判定。远程攻击还承受距离惩罚。"}},{"tags":["spell"],"cells":{"skill-type":"法术","checks-accuracy":"通常不","notes":"大多法术绕过命中率与闪避的判定。部分技能明确为必定命中或无法被闪避。"}},{"tags":["minion"],"cells":{"skill-type":"召唤物","checks-accuracy":"取决于召唤物","notes":"召唤物使用自身命中率规则，与玩家不同。不要假定玩家命中率适用于召唤物。"}},{"tags":["totem"],"cells":{"skill-type":"图腾","checks-accuracy":"是（继承技能）","notes":"使用攻击技能的图腾会像施法者一样执行该技能的命中率判定。"}},{"tags":["triggered"],"cells":{"skill-type":"触发","checks-accuracy":"取决于触发来源","notes":"触发的攻击会检测命中率；触发的法术通常不检测。请遵循底层技能类型。"}}],"note":"召唤物命中率行为随版本变化；请确认当前规则，勿照搬旧资料。"},{"id":"worked-examples","order":70,"title":"实例演示","type":"data-table","visible":true,"toc":true,"caption":"展示距离与技能类型如何改变命中结果的示例。数值为定性说明，非精确系数。","columns":[{"key":"case","label":"情形"},{"key":"distance","label":"距离"},{"key":"result","label":"结果"}],"filters":[],"rows":[{"tags":["melee"],"cells":{"case":"近身攻击普通敌人","distance":"贴身 / 近战","result":"面板命中率具有代表性；攻击几乎总是命中。"}},{"tags":["ranged"],"cells":{"case":"远距离攻击普通敌人","distance":"屏幕另一端","result":"距离惩罚降低有效命中率；高面板几率仍可能未命中。"}},{"tags":["spell"],"cells":{"case":"任意距离的法术","distance":"不适用","result":"法术绕过命中率判定，因此距离惩罚不适用于命中判定。"}},{"tags":["range-penalty"],"cells":{"case":"极限距离显示接近100%","distance":"最大射程","result":"距离系数仍可能导致未命中；显示数值在远距离并非保证。"}}],"note":"仅作为心智模型；真实阈值请在当前客户端确认。"},{"id":"fix-low-hit-chance","order":80,"title":"解决低命中率","type":"diagnostic","visible":true,"toc":true,"intro":"选择你未命中的可能原因，工具会指向下一步。","controls":[{"id":"cause","label":"未命中来自动哪里？","options":[{"label":"装备命中率过低","value":"gear"},{"label":"天赋或技能树无命中率","value":"passives"},{"label":"与目标距离过远","value":"positioning"},{"label":"Boss或高闪避敌人","value":"keystone"}]}],"rules":[{"title":"提升装备命中率","when":{"cause":"gear"},"steps":["查看武器、戒指与项链上的命中率。","优先选择固定命中率及装备上的百分比加成。","每次替换后复查悬浮窗命中率。"]},{"title":"从天赋树获取命中率","when":{"cause":"passives"},"steps":["点出提供命中率的天赋节点与 notable 集群。","查看职业与升华节点中的命中率加成。","洗点后确认悬浮窗命中率上升。"]},{"title":"改善走位","when":{"cause":"positioning"},"steps":["靠近目标以减小远程攻击的距离惩罚。","使用位移技能拉近与高闪避敌人的距离。","在同一目标近距离下重新测试，观察惩罚消失。"]},{"title":"应对高闪避或Boss敌人","when":{"cause":"keystone"},"steps":["考虑“击中无法被闪避”或“坚决技巧”来忽略闪避。","权衡取舍：坚决技巧会放弃暴击收益。","若仍依赖暴击或其他判定，仅在此情形下配合命中率使用。"]}],"defaultResult":{"title":"通用解决路径","steps":["先确认未命中是命中率问题，而非抗性或缺伤害问题。","优先通过装备与天赋提升命中率。","再修正走位，最后才考虑关键天赋的取舍。"]}},{"id":"crit-interaction","order":90,"title":"命中率与闪避如何与暴击互动","type":"overview","visible":true,"toc":true,"paragraphs":["暴击只能发生在已命中的攻击上。若攻击未通过命中率与闪避的判定，就不可能造成暴击——暴击根本不会判定。这意味着你的有效暴击率受命中率限制，而非仅由你列出的暴击几率决定。","对暴击流构筑而言，提升命中率因此有双重价值：它既让更多攻击命中，又释放了这些攻击本可携带的更多暴击。相反，暴击几率很高但命中率低时，大部分潜力都浪费在了未命中上。"],"bullets":["未命中无法暴击——必须先命中。","有效暴击率等于命中率乘以列出的暴击几率。","对暴击流而言，命中率投入收益翻倍。","低命中率会悄悄浪费暴击几率。"]},{"id":"troubleshooting","order":100,"title":"常见误读","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["大多数命中率问题源于把面板当作全部真相。以下是最常让玩家踩坑的地方。"],"bullets":["面板显示接近100%却在远处未命中，因为近距离读数未体现距离惩罚。","假定每个投射物都需要命中率——许多法术完全绕过该判定。","忘记Boss与高闪避敌人拥有高闪避率，因此你在普通地图的命中率打它们会大幅下降。","把显示几率当作任意距离的保证命中——它并非如此。","假定召唤物命中率等于你自己的命中率——召唤物遵循自身规则。","认为坚决技巧或击中无法被闪避能解决一切，忽略暴击收益的取舍。"]},{"id":"community-cases","order":110,"title":"玩家常见问题","type":"card-grid","visible":true,"toc":true,"intro":"玩家经常提出的关于命中率与击中几率的困惑（转述）。","cards":[{"title":"显示100%为何仍会未命中？","tag":"distance","body":["面板几率是在参考距离下测量的。远程攻击在远距离损失有效命中率，因此真实几率可能低于读数。"]},{"title":"我的法术需要命中率吗？","tag":"spell","body":["大多法术不进行命中率与闪避的判定。玩家常常在法术构筑上过度投资命中率却毫无收益。"]},{"title":"召唤物用我的命中率吗？","tag":"minion","body":["召唤物遵循自身命中率规则，与玩家不同。不要假定命中率共享。"]},{"title":"Boss闪避一切","tag":"boss","body":["高闪避Boss会大幅拉低你的命中率，远低于你清图的数值。为打Boss请规划命中率或忽略闪避的方案。"]}]},{"id":"video-guide","order":120,"title":"视频指南","type":"video","visible":true,"toc":true,"entries":[{"label":"如何在流放之路2中查看你的命中率（命中率评分）","creator":"Bue","description":"清晰讲解在哪里找到并阅读你的命中率、命中率如何与闪避对比，以及流放之路2中远程距离惩罚如何运作。","takeaway":"打开角色面板读取真实命中率，然后提升命中率或缩短距离，以停止在远距离未命中。","url":"https://www.youtube.com/watch?v=UiHcZFe2xCo","timestamps":[{"label":"简介","time":"0:00"},{"label":"在哪里查看命中率","time":"1:05"},{"label":"命中率与闪避对比","time":"3:40"},{"label":"距离惩罚","time":"6:20"},{"label":"解决低命中率","time":"9:10"},{"label":"总结","time":"11:30"}]}]},{"id":"faq","order":130,"title":"常见问题","type":"faq","visible":true,"toc":true,"items":[{"question":"命中几率和悬浮窗上的数字一样吗？","answer":["近距离时它具代表性，但远程攻击的距离惩罚意味着远距离真实几率可能低于悬浮窗显示。请将其视为参考距离下的数值。"]},{"question":"流放之路2中法术使用命中率吗？","answer":["大多法术不与闪避进行命中率判定。为纯法术构筑投资命中率通常对命中率毫无帮助。部分技能无论何种情况都明确为必定命中或无法被闪避。"]},{"question":"为什么我打Boss未命中之清小怪却不会？","answer":["Boss与高闪避敌人拥有高得多的闪避率，从而降低你对它们的命中率。你清图的命中率对Boss内容可能过低。"]},{"question":"坚决技巧让我必定命中吗？","answer":["它让闪避不再成为你命中的因素，但通常也会放弃暴击收益，因此是取舍而非免费升级。请对照你构筑对暴击的依赖来权衡。"]},{"question":"召唤物共享我的命中率吗？","answer":["不共享。召唤物使用自身命中率规则，与玩家不同。不要假定提升你的命中率能改善召唤物的命中率。"]}]},{"id":"sources","order":140,"title":"来源与验证","type":"sources","visible":true,"toc":true,"categories":[{"label":"官方wiki - 命中率","description":"PoE2 wiki 关于命中率、闪避与击中几率关系的参考","url":"https://poe2wiki.net/wiki/Accuracy"},{"label":"Maxroll PoE2 中心","description":"覆盖流放之路2命中率与闪避的社区机制中心","url":"https://maxroll.gg/poe2"},{"label":"Mobalytics PoE2 中心","description":"提供构筑与命中率指引的社区机制中心","url":"https://mobalytics.gg/path-of-exile-2/"},{"label":"视频指南（Bue）","description":"讲解流放之路2中读取命中率与距离惩罚的YouTube视频","url":"https://www.youtube.com/watch?v=UiHcZFe2xCo"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":150,"title":"更新日志","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["为流放之路2抢先体验0.5.4首发命中率、距离惩罚与击中几率指南。","新增直接回答、关键术语、击中结构、变量表、距离惩罚、技能矩阵、实例演示、诊断、暴击互动、常见误读、社区案例、视频、常见问题与来源。"]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 wiki - 命中率","url":"https://poe2wiki.net/wiki/Accuracy","sourceType":"official"},{"label":"Maxroll - Path of Exile 2 中心","url":"https://maxroll.gg/poe2","sourceType":"community"},{"label":"Mobalytics - Path of Exile 2 中心","url":"https://mobalytics.gg/path-of-exile-2/","sourceType":"community"},{"label":"Bue - 如何在PoE2查看命中率（YouTube）","url":"https://www.youtube.com/watch?v=UiHcZFe2xCo","sourceType":"community"}],"seo":{"title":"流放之路2 命中率、距离惩罚与击中几率指南","description":"命中率如何与闪避对比、远程攻击如何在远距离损失命中率，以及如何解决流放之路2中的低命中率问题。","noindex":false}},{"id":"critical-hit-chance-damage-bonus-transition","slug":"critical-hit-chance-damage-bonus-transition","locale":"en","type":"guide","status":"published","featured":false,"title":"Critical Hit Chance, Critical Damage Bonus, and the Crit Transition in Path of Exile 2","shortTitle":"Crit Chance & Crit Damage","summary":"How Critical Hit Chance and Critical Damage Bonus work in Path of Exile 2, how they accumulate, and how to judge whether your build should commit to a crit-focused focus or stay on a non-crit path.","description":"A mechanics guide to Critical Hit Chance, Critical Damage Bonus, per-hit crit rolls, and the transition from a non-crit to a crit build in Path of Exile 2. Covers base crit, increased crit chance, accuracy interaction, and a decision checklist.","guideCategory":"mechanics","heroImage":"/images/skills/cast-on-critical-strike.webp","cardImage":"/images/skills/cast-on-critical-strike.webp","imageAlt":"A Path of Exile 2 support skill icon representing critical hits and critical damage","estimatedReadingMinutes":16,"prerequisites":["A basic understanding of Hit and damage in Path of Exile 2","Familiarity with Increased vs More modifiers and how they stack","A character past the early campaign with some gear and passive choices"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","critical-hit","crit-chance","crit-damage","transition","scaling"],"sections":[{"id":"quick-answer","order":1,"title":"Direct answers","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"What is Critical Hit Chance?","body":["Critical Hit Chance is the probability that a given Hit becomes a critical hit. It starts from a base value (set by the weapon for attacks, or by the skill for spells), can receive flat additions, and is then raised by all your Increased Critical Hit Chance modifiers added together."]},{"title":"What is Critical Damage Bonus?","body":["Critical Damage Bonus is the extra damage a critical hit deals beyond the normal hit. In Path of Exile 2 the stat is named Critical Damage Bonus (it is the successor to the old 'Critical Strike Multiplier' terminology from earlier titles). The base value is a flat bonus on top of the hit; exact coefficients are version-sensitive and noted as pending PC verification."]},{"title":"When should I switch to a crit build?","body":["There is no single magic threshold. The transition is worth considering when your final Crit Chance is high enough that crits happen often, your Critical Damage Bonus is meaningful, your hits reliably land, and you are not giving up too much defence or budget to get there. Use the transition checklist section to judge your own case."]},{"title":"Does a crit matter if the hit misses?","body":["No. A Hit must first land (pass the Accuracy versus Evasion check for attacks) before the crit roll matters. If the hit is evaded, there is no damage and no crit."]}]},{"id":"definitions","order":2,"title":"Key definitions","type":"overview","visible":true,"toc":true,"paragraphs":["Critical hits are one of the most misread systems in Path of Exile 2 because several distinct numbers share similar names. Getting the vocabulary right is the first step to building around crit correctly.","Base Crit Chance is the starting probability from the source of the hit. For attacks this comes from the weapon's base critical strike chance; for spells it comes from the skill's own base. It is a property of the source, not something you stack directly.","Flat Crit Chance is any additive bonus to your crit chance that is not a percentage. These flat values are added to the base before Increased modifiers are applied.","Increased Crit Chance is the sum of all your '+% to Critical Hit Chance' modifiers. Like other Increased modifiers, they add together into one multiplier. This is separate from flat crit chance and must not be confused with it.","Critical Damage Bonus is the extra damage applied when a hit crits. It is expressed as a bonus (for example a flat +X% on top of the normal hit) rather than as a single 'multiplier' number. All sources of Critical Damage Bonus add together."],"bullets":["Base Crit Chance: where the crit roll starts (weapon for attacks, skill for spells).","Flat Crit Chance: additive points added to the base, applied before Increased.","Increased Crit Chance: all +% crit chance modifiers summed into one multiplier.","Critical Damage Bonus: extra damage on a crit, all sources add together.","Do not mix up flat crit chance with Increased crit chance — they occupy different steps of the calculation."]},{"id":"attack-vs-spell","order":3,"title":"Attacks vs spells: where base crit comes from","type":"data-table","visible":true,"toc":true,"caption":"The base Critical Hit Chance for a hit comes from different sources depending on whether the skill is an attack or a spell. This changes how you raise crit chance.","columns":[{"key":"source","label":"Source"},{"key":"base-crit-from","label":"Base crit from"},{"key":"notes","label":"Notes"}],"filters":[],"rows":[{"tags":["attack"],"cells":{"source":"Weapon attack","base-crit-from":"The weapon's base critical strike chance","notes":"Each weapon type has its own base crit. A higher base weapon makes every Increased crit chance modifier more effective."}},{"tags":["spell"],"cells":{"source":"Spell","base-crit-from":"The skill's own base critical strike chance","notes":"Spells do not use a weapon's crit base. Their crit floor depends on the specific spell, which can be very low for some skills."}},{"tags":["flat"],"cells":{"source":"Flat additions","base-crit-from":"Modifiers and support gems that add flat crit chance","notes":"Flat crit is added on top of the base and is especially valuable for low-base skills that would otherwise never crit."}},{"tags":["increased"],"cells":{"source":"Increased crit chance","base-crit-from":"All +% Critical Hit Chance modifiers summed","notes":"Scales the (base + flat) total. More effective when the base or flat portion is already higher."}}],"note":"Weapon base crit values differ by base type and are version-sensitive; confirm exact numbers in-game. The structure above is stable across versions."},{"id":"crit-check","order":4,"title":"How the crit roll happens","type":"overview","visible":true,"toc":true,"paragraphs":["A critical hit is decided by a single random roll against your Crit Chance for each 'crit check'. The number of crit checks depends on how the skill deals damage, and this is where many players over-simplify.","For a normal single Hit, one crit check is rolled. For a skill that hits multiple times (multi-hit), each separate hit performs its own crit check, so some hits can crit while others do not. For channeled skills, each damage tick is generally its own check. For damage over time, crit interaction follows the current Path of Exile 2 rules for ailments and DoT, which differ from a normal hit and should be sourced per the current version.","Critically, the hit must land first. For attacks, the Accuracy versus Evasion roll happens before the crit roll: if the attack is evaded, it never becomes a crit. A crit roll can therefore be 'wasted' on a hit that misses. Lucky and Unlucky modifiers, where they apply, affect how the crit roll is performed; describe their behavior from the current in-game tooltip."],"bullets":["One crit check per Hit, rolled against your Crit Chance.","Multi-hit skills roll crit separately for each hit.","Channeled skills usually roll per damage tick.","DoT and ailments follow their own current crit rules — source them.","An evaded attack cannot crit; accuracy gates crit relevance."]},{"id":"formula","order":5,"title":"How Crit Chance and Critical Damage Bonus accumulate","type":"overview","visible":true,"toc":true,"paragraphs":["The accumulation structure is the same across versions, even when exact coefficients change. Final Crit Chance is built from the base plus any flat crit chance, and then all Increased Crit Chance modifiers multiply that sum.","In formula terms: Final Crit Chance = (Base Crit Chance + Flat Crit Chance) x (1 + sum of Increased Crit Chance%). Critical Damage Bonus is handled separately: when a hit crits, it deals the normal hit damage plus the summed Critical Damage Bonus. Both systems add their same-category bonuses together; different categories and any More multipliers then multiply.","The numbers below are teaching examples with assumed values and are pending PC verification. They illustrate the structure, not the exact live coefficients."],"bullets":["Start from Base Crit Chance (weapon for attacks, skill for spells).","Add Flat Crit Chance on top of the base.","Multiply that sum by (1 + total Increased Crit Chance%).","On a crit, add summed Critical Damage Bonus to the hit damage.","Increased bonuses of the same category add; separate categories and More multipliers multiply."]},{"id":"formula-variables","order":6,"title":"Formula variables and a worked example","type":"data-table","visible":true,"toc":true,"caption":"Each variable in the crit calculation, what feeds it, and an assumed teaching example. Exact coefficients are pending PC verification.","columns":[{"key":"variable","label":"Variable"},{"key":"meaning","label":"What it means"},{"key":"example","label":"Assumed example"}],"filters":[],"rows":[{"tags":["base"],"cells":{"variable":"Base Crit Chance","meaning":"Starting crit from weapon (attack) or skill (spell)","example":"10% from a dagger base"}},{"tags":["flat"],"cells":{"variable":"Flat Crit Chance","meaning":"Additive points added before Increased","example":"+30% flat crit from gear and supports"}},{"tags":["increased"],"cells":{"variable":"Sum of Increased Crit Chance","meaning":"All +% crit chance modifiers added together","example":"+100% Increased (total multiplier 2.0)"}},{"tags":["final"],"cells":{"variable":"Final Crit Chance","meaning":"(Base + Flat) x (1 + Increased)","example":"(10% + 30%) x 2.0 = 80%"}},{"tags":["bonus"],"cells":{"variable":"Critical Damage Bonus","meaning":"Extra damage on a crit, all sources added","example":"+75% bonus (crit deals 175% of the hit), pending PC verification"}}],"note":"The example uses assumed teaching numbers. Confirm live base values and the base Critical Damage Bonus in-game."},{"id":"accuracy-interaction","order":7,"title":"Accuracy still gates crit relevance","type":"overview","visible":true,"toc":true,"paragraphs":["Crit chance is meaningless on a hit that never lands. For attack skills, the Accuracy rating is rolled against the enemy's Evasion before the crit roll. If you miss, the crit roll is never performed, so the attack deals no damage at all.","This means stacking Crit Chance without enough Accuracy is a trap. A high Crit Chance paired with a low Hit Chance produces few actual crits, because most attacks are evaded before they can crit. Spell skills that cannot miss by evasion still must connect with the target, so positioning and projectile behavior still matter.","When evaluating a crit transition, always pair your Crit Chance with your real Hit Chance. A lower Crit Chance that actually lands outperforms a higher Crit Chance that is constantly evaded."],"bullets":["Attacks roll Accuracy vs Evasion before the crit roll.","An evaded hit deals no damage and cannot crit.","High Crit Chance with low Hit Chance wastes most rolls.","Pair Crit Chance with real Hit Chance when planning the transition."]},{"id":"transition-checklist","order":8,"title":"Transition checklist: should you go crit?","type":"diagnostic","visible":true,"toc":true,"intro":"Answer the questions about your current build. The tool points to the most useful next step for deciding whether to commit to a crit focus.","controls":[{"id":"base-crit","label":"Your skill's base Critical Hit Chance","options":[{"label":"Low (under 5%)","value":"low"},{"label":"Moderate (5 to 10%)","value":"moderate"},{"label":"High (10% or more)","value":"high"}]},{"id":"final-crit","label":"Your final Crit Chance after Increased bonuses","options":[{"label":"Below 30%","value":"low"},{"label":"30% to 60%","value":"mid"},{"label":"Above 60%","value":"high"}]},{"id":"hit-chance","label":"Your reliable Hit Chance on the target","options":[{"label":"Reliable (above 90%)","value":"reliable"},{"label":"Unreliable","value":"unreliable"}]},{"id":"content","label":"Primary content you are building for","options":[{"label":"Mapping / clear speed","value":"mapping"},{"label":"Bossing / single target","value":"bossing"}]}],"rules":[{"title":"Fix accuracy before anything else","when":{"hit-chance":"unreliable"},"steps":["Raise Accuracy rating or switch to a skill that cannot be evaded.","Only revisit crit once your Hit Chance is reliably above 90%.","Remember: an evaded attack never crits, so crit investment is wasted until hits land."]},{"title":"Crit is not worth forcing yet","when":{"final-crit":"low"},"steps":["Your final Crit Chance is too low for crits to drive damage.","Prefer a More-multiplier or flat-damage scaling path instead.","Revisit crit only after base or flat crit chance can be raised meaningfully."]},{"title":"Lean into crit as your main damage","when":{"final-crit":"high","hit-chance":"reliable"},"steps":["Your Crit Chance is high and hits land, so crits are frequent.","Invest in Critical Damage Bonus and Power Charges where available.","Keep checking that defences and budget are not sacrificed to maintain it."]},{"title":"Balance crit with single-target uptime","when":{"content":"bossing","final-crit":"mid"},"steps":["Mid Crit Chance is okay for bosses if hits are reliable and frequent.","Add flat crit chance or Power Charge uptime to smooth boss variance.","Compare against a non-crit More-multiplier setup before over-investing."]}],"defaultResult":{"title":"General transition guidance","steps":["Confirm hits reliably land before valuing crit at all.","Raise base or flat crit chance so Increased modifiers have something to scale.","Add Critical Damage Bonus only after crits happen often enough to matter.","Keep an eye on defences and budget you give up to reach the crit setup."]}},{"id":"worked-examples","order":9,"title":"Worked examples","type":"data-table","visible":true,"toc":true,"caption":"Two illustrative cases showing how base crit and flat crit change the value of the same Increased Crit Chance investment. Numbers are assumed teaching values, pending PC verification.","columns":[{"key":"case","label":"Case"},{"key":"setup","label":"Setup"},{"key":"result","label":"Result"}],"filters":[],"rows":[{"tags":["low-base"],"cells":{"case":"Low-base spell (assumed 5% base)","setup":"5% base + 0 flat + 100% Increased = (5% + 0) x 2.0","result":"10% final Crit Chance. Crit is rare; forcing it needs flat crit additions first."}},{"tags":["high-base"],"cells":{"case":"High-base dagger attack (assumed 15% base)","setup":"15% base + 30% flat + 100% Increased = (15% + 30%) x 2.0","result":"90% final Crit Chance. Same Increased investment pays off far more thanks to higher base and flat."}}],"note":"The contrast shows why flat and base crit chance matter as much as the Increased percentage. Exact live base values are pending PC verification."},{"id":"troubleshooting","order":10,"title":"Common mistakes","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["Most crit problems come from misunderstanding the calculation rather than from bad luck. Watching for these saves far more damage than any single roll."],"bullets":["Stacking Increased Crit Chance on a near-zero base, so the final number stays low.","Confusing flat crit chance with Increased crit chance and double-counting one as the other.","Investing in Crit Chance while Accuracy is too low, so most attacks are evaded before they can crit.","Assuming every skill crits the same way; multi-hit, channel, and DoT perform separate or different checks.","Thinking a single 'reach X%' rule applies to every build — the right threshold depends on base, flat, bonus, and uptime.","Giving up too much defence or budget to reach a crit setup that barely beats a non-crit path."]},{"id":"community-cases","order":11,"title":"Common points of confusion","type":"card-grid","visible":true,"toc":true,"intro":"Paraphrased confusions players frequently raise about crit chance and crit damage in Path of Exile 2.","cards":[{"title":"Crit Multiplier vs Critical Damage Bonus","tag":"terminology","body":["Players still call it 'crit multiplier'. In Path of Exile 2 the current name is Critical Damage Bonus, and it is expressed as a bonus added on a crit rather than a single multiplier value."]},{"title":"Flat crit does nothing","tag":"misconception","body":["Some believe flat crit chance is useless. On low-base skills it is the most efficient way to make crits happen at all, because Increased only scales what the base plus flat already provide."]},{"title":"Why my crits feel random on bosses","tag":"variance","body":["With mid Crit Chance and few hits per second, crits arrive in bursts. Smoother boss damage needs higher Crit Chance, more attacks, or Power Charge uptime — not just more Increased."]},{"title":"Evaded hits 'should have crit'","tag":"accuracy","body":["Players blame RNG when the real issue is Accuracy. An evaded attack is removed before the crit roll, so no crit can occur regardless of Crit Chance."]}]},{"id":"video-guide","order":12,"title":"Video guide","type":"video","visible":true,"toc":true,"entries":[{"label":"Complete Critical Hit Guide - Path of Exile 2","creator":"silentstill","description":"A full walkthrough of critical hits in Path of Exile 2: base crit, increased crit chance, Critical Damage Bonus, crit checks per hit, and how to plan a crit build.","takeaway":"Build crit from the base up — raise base or flat crit chance first, then scale with Increased, and only add Critical Damage Bonus once crits happen often.","url":"https://www.youtube.com/watch?v=QRGpfmRYqt8","timestamps":[{"label":"Introduction","time":"0:00"},{"label":"Base critical hit chance","time":"1:20"},{"label":"Increased Critical Hit Chance","time":"3:45"},{"label":"Critical Damage Bonus","time":"6:10"},{"label":"Multi-hit and per-hit crit checks","time":"9:30"},{"label":"Transition checklist","time":"12:15"},{"label":"Summary","time":"15:00"}]}]},{"id":"faq","order":13,"title":"Frequently asked questions","type":"faq","visible":true,"toc":true,"items":[{"question":"Is Critical Damage Bonus the same as the old Crit Multiplier?","answer":["In Path of Exile 2 the current name is Critical Damage Bonus. It represents the extra damage dealt on a critical hit, and all sources add together. Exact base coefficients are version-sensitive and noted as pending PC verification."]},{"question":"Why does stacking Increased Crit Chance not raise my crits much?","answer":["Increased Crit Chance multiplies your (base + flat) crit chance. If your base and flat values are near zero, even a large Increased total produces a small final number. Raise base or flat crit chance first."]},{"question":"Do damage over time and ailments crit in Path of Exile 2?","answer":["DoT and ailment crit interaction follows the current Path of Exile 2 rules, which differ from a normal hit and can change between versions. Source the current behavior from the in-game tooltip before relying on it."]},{"question":"If my Crit Chance is high but I rarely crit, what is wrong?","answer":["Check your Hit Chance first. For attacks, an evaded hit is removed before the crit roll, so low Accuracy wastes your Crit Chance. For spells, confirm the hits are actually connecting with the target."]},{"question":"Is there a single Crit Chance percentage where I should always switch to crit?","answer":["No. The right point depends on your base crit, flat crit, Critical Damage Bonus, hit reliability, and how often you hit. Use the transition checklist to judge your own build rather than a universal threshold."]},{"question":"Do all skills roll crit the same way?","answer":["No. A single Hit rolls once, multi-hit skills roll per hit, and channeled skills usually roll per tick. Each behaves differently, so crit investment scales differently per skill type."]}]},{"id":"sources","order":14,"title":"Sources and verification","type":"sources","visible":true,"toc":true,"categories":[{"label":"PoE2 Wiki (official)","description":"Official Path of Exile 2 wiki reference for critical hits and related combat mechanics","url":"https://poe2wiki.net/"},{"label":"silentstill - Complete Critical Hit Guide (YouTube)","description":"Community video walkthrough of crit mechanics in Path of Exile 2","url":"https://www.youtube.com/watch?v=QRGpfmRYqt8"},{"label":"Maxroll PoE2 guides hub","description":"Community mechanics and build hub for Path of Exile 2","url":"https://maxroll.gg/poe2"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":15,"title":"Changelog","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["Initial publication of the Critical Hit Chance, Critical Damage Bonus, and transition guide for Path of Exile 2 Early Access 0.5.4.","Added quick answers, definitions, attack vs spell base crit, crit check behavior, accumulation formula, accuracy interaction, transition diagnostic, worked examples, common mistakes, community confusion, video, FAQ, and sources."]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 Wiki (official)","url":"https://poe2wiki.net/","sourceType":"official"},{"label":"silentstill - Complete Critical Hit Guide (YouTube)","url":"https://www.youtube.com/watch?v=QRGpfmRYqt8","sourceType":"community"},{"label":"Maxroll PoE2 guides hub","url":"https://maxroll.gg/poe2","sourceType":"community"}],"seo":{"title":"PoE 2 Critical Hit Chance, Critical Damage Bonus & Crit Transition Guide","description":"How Critical Hit Chance and Critical Damage Bonus work in Path of Exile 2, how they accumulate, and how to decide whether to transition your build into a crit focus.","noindex":false}},{"id":"critical-hit-chance-damage-bonus-transition","slug":"critical-hit-chance-damage-bonus-transition","locale":"zh-cn","type":"guide","status":"published","featured":false,"title":"流放之路2 暴击几率、暴击伤害加成与暴击流派转型","shortTitle":"暴击几率与暴击伤害","summary":"讲解《流放之路2》中暴击几率与暴击伤害加成的运作方式、它们如何叠加，以及如何判断你的流派应不应该转向以暴击为核心的发展方向。","description":"一份关于《流放之路2》中暴击几率、暴击伤害加成、每次命中的暴击判定，以及从非暴击流派向暴击流派转型的机制指南。涵盖基础暴击、增加暴击几率、与命中的交互，以及决策清单。","guideCategory":"mechanics","heroImage":"/images/skills/cast-on-critical-strike.webp","cardImage":"/images/skills/cast-on-critical-strike.webp","imageAlt":"流放之路2 辅助技能图标，代表暴击与暴击伤害","estimatedReadingMinutes":16,"prerequisites":["对《流放之路2》中的命中和伤害有基本了解","熟悉增加类与更多类词缀的区别及叠加方式","角色已过早期剧情，有一定装备与天赋选择"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","critical-hit","crit-chance","crit-damage","transition","scaling"],"sections":[{"id":"quick-answer","order":1,"title":"直接回答","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"什么是暴击几率？","body":["暴击几率是指某次命中成为暴击的概率。它从基础值开始（攻击来自武器，法术来自技能自身），可以受到固定值加成，再被你所有“增加暴击几率”的词缀加总后放大。"]},{"title":"什么是暴击伤害加成？","body":["暴击伤害加成是暴击命中时，在正常伤害之外额外造成的伤害。在《流放之路2》中，这个属性名为暴击伤害加成（它是早期版本“暴击倍率”称谓的继承者）。其基础值是在命中伤害之上的一个固定加成；具体系数随版本变动，已标注为待 PC 验证。"]},{"title":"我什么时候应该转暴击流派？","body":["并没有一个万能的门槛数值。当你的最终暴击几率高到暴击经常发生、暴击伤害加成有意义、你的命中稳定落地，且为此没有牺牲过多防御或预算时，转型才值得考虑。请使用“转型清单”一节来判断你自己的情况。"]},{"title":"如果没命中，暴击还有意义吗？","body":["没有意义。一次命中必须先落地（对攻击而言要通过命中对抗闪避的判定），暴击判定才有意义。如果被闪避，则没有伤害，也不存在暴击。"]}]},{"id":"definitions","order":2,"title":"关键定义","type":"overview","visible":true,"toc":true,"paragraphs":["暴击是《流放之路2》中最容易被误读的系统之一，因为几个不同的数值名字很相似。把术语搞清楚，是正确围绕暴击构建流派的第一步。","基础暴击几率是暴击判定的起始概率。对攻击来说来自武器的基础暴击几率；对法术来说来自技能自身的基础值。它是来源的属性，不是你直接堆叠的东西。","固定暴击几率是一切不以百分比形式出现的暴击几率加成。这些固定值会在应用增加类词缀之前，加在基础值之上。","增加暴击几率是你所有“+% 暴击几率”词缀的总和。和其他增加类词缀一样，它们加总成一个乘数。这与固定暴击几率是不同的步骤，切勿混淆。","暴击伤害加成是暴击命中时施加的额外伤害。它以加成形式呈现（例如在正常命中之上额外 +X%），而不是一个单独的“倍率”数字。所有来源的暴击伤害加成会加在一起。"],"bullets":["基础暴击几率：暴击判定的起点（攻击来自武器，法术来自技能）。","固定暴击几率：加在基础值之上的固定点数，在增加类之前应用。","增加暴击几率：所有 +% 暴击几率词缀加总成一个乘数。","暴击伤害加成：暴击时的额外伤害，所有来源加在一起。","不要把固定暴击几率与增加暴击几率混为一谈——它们处于计算的不同步骤。"]},{"id":"attack-vs-spell","order":3,"title":"攻击 vs 法术：基础暴击来自哪里","type":"data-table","visible":true,"toc":true,"caption":"一次命中的基础暴击几率来自不同来源，取决于技能是攻击还是法术。这会改变你提升暴击几率的方式。","columns":[{"key":"source","label":"来源"},{"key":"base-crit-from","label":"基础暴击来自"},{"key":"notes","label":"说明"}],"filters":[],"rows":[{"tags":["attack"
