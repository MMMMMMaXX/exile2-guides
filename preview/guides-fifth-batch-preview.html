],"cells":{"source":"武器攻击","base-crit-from":"武器的基础暴击几率","notes":"每种武器类型有各自的基础暴击。更高的基础武器会让每一个增加暴击几率词缀更有效。"}},{"tags":["spell"],"cells":{"source":"法术","base-crit-from":"技能自身的基础暴击几率","notes":"法术不使用武器的暴击基础。它们的暴击下限取决于具体法术，有些技能可能非常低。"}},{"tags":["flat"],"cells":{"source":"固定加成","base-crit-from":"增加固定暴击几率的词缀与辅助宝石","notes":"固定暴击加在基础值之上，对基础值很低、否则几乎不会暴击的技能尤其有价值。"}},{"tags":["increased"],"cells":{"source":"增加暴击几率","base-crit-from":"所有 +% 暴击几率词缀的总和","notes":"对（基础 + 固定）的总量进行缩放。当基础或固定部分已经较高时更有效。"}}],"note":"不同基础类型的武器基础暴击值不同，且随版本变动；请于游戏内确认具体数值。上述结构是跨版本稳定的。"},{"id":"crit-check","order":4,"title":"暴击判定如何进行","type":"overview","visible":true,"toc":true,"paragraphs":["暴击由针对你的暴击几率所做的单次随机判定决定，称为一次“暴击判定”。暴击判定的次数取决于技能如何造成伤害，许多玩家正是在这里做了过度简化。","对普通单次命中，会进行一次暴击判定。对多段命中（multi-hit）技能，每一段独立命中都会进行各自的暴击判定，因此有些段会暴击，有些不会。对引导（channel）技能，通常每一跳伤害都是独立的判定。对于持续伤害（DoT），暴击交互遵循《流放之路2》当前版本关于异常状态与持续伤害的规则，与正常命中不同，请按当前版本查证。","关键点是：命中必须先落地。对攻击而言，命中对抗闪避的判定发生在暴击判定之前：若攻击被闪避，它永远不会成为暴击。因此暴击判定可能“浪费”在一次未命中的攻击上。幸运与不幸（Lucky / Unlucky）词缀在适用时，会影响暴击判定的执行方式；其行为请以当前游戏内 tooltip 为准。"],"bullets":["每次命中进行一次暴击判定，针对你的暴击几率。","多段命中技能对每一段分别判定暴击。","引导技能通常每一跳伤害各自判定。","持续伤害与异常状态遵循各自的当前暴击规则——请查证。","被闪避的攻击无法暴击；命中率决定了暴击是否相关。"]},{"id":"formula","order":5,"title":"暴击几率与暴击伤害加成如何叠加","type":"overview","visible":true,"toc":true,"paragraphs":["叠加的结构在各版本间保持一致，即使具体系数会变化。最终暴击几率由基础值加上任何固定暴击几率构成，再被你所有增加暴击几率词缀放大。","用公式表达：最终暴击几率 =（基础暴击几率 + 固定暴击几率）×（1 + 增加暴击几率之和）。暴击伤害加成单独处理：当一次命中暴击时，它在正常命中伤害之外，加上加总后的暴击伤害加成。两个系统都会把同类的加成加在一起；不同类别以及任何更多类乘数再进行相乘。","下面的数值是带有假设值的教学示例，已标注为待 PC 验证。它们说明的是结构，而非确切的线上系数。"],"bullets":["从基础暴击几率开始（攻击来自武器，法术来自技能）。","在基础值之上加上固定暴击几率。","将该总和乘以（1 + 增加暴击几率总和）。","暴击时，将加总后的暴击伤害加成加到命中伤害上。","同类增加加成相加；不同类别与更多类乘数相乘。"]},{"id":"formula-variables","order":6,"title":"公式变量与计算示例","type":"data-table","visible":true,"toc":true,"caption":"暴击计算中的每一个变量、其来源，以及一个假设的教学示例。具体系数待 PC 验证。","columns":[{"key":"variable","label":"变量"},{"key":"meaning","label":"含义"},{"key":"example","label":"假设示例"}],"filters":[],"rows":[{"tags":["base"],"cells":{"variable":"基础暴击几率","meaning":"暴击起始值，攻击来自武器，法术来自技能","example":"匕首基础 10%"}},{"tags":["flat"],"cells":{"variable":"固定暴击几率","meaning":"在增加类之前加上的固定点数","example":"装备与辅助提供 +30% 固定暴击"}},{"tags":["increased"],"cells":{"variable":"增加暴击几率总和","meaning":"所有 +% 暴击几率词缀加在一起","example":"+100% 增加（总乘数 2.0）"}},{"tags":["final"],"cells":{"variable":"最终暴击几率","meaning":"（基础 + 固定）×（1 + 增加）","example":"（10% + 30%）× 2.0 = 80%"}},{"tags":["bonus"],"cells":{"variable":"暴击伤害加成","meaning":"暴击时的额外伤害，所有来源相加","example":"+75% 加成（暴击造成命中的 175%），待 PC 验证"}}],"note":"示例使用了假设的教学数值。请于游戏内确认实时基础值与基础暴击伤害加成。"},{"id":"accuracy-interaction","order":7,"title":"命中率仍然决定暴击是否有意义","type":"overview","visible":true,"toc":true,"paragraphs":["对一次从未落地的命中而言，暴击几率毫无意义。对攻击技能，命中值会在暴击判定之前与敌人的闪避对抗。若你未命中，则暴击判定永远不会进行，因此攻击根本不造成伤害。","这意味着只堆叠暴击几率而命中不足是一个陷阱。高暴击几率配上低命中率，实际暴击很少，因为大多数攻击在能暴击之前就被闪避了。不会被闪避判定的法术技能仍然必须命中目标，因此走位与弹道行为仍然重要。","在评估暴击转型时，务必把你的暴击几率与真实命中率配对看。一个较低但能真正命中的暴击几率，优于一个经常被闪避的高暴击几率。"],"bullets":["攻击在暴击判定之前进行命中对抗闪避的判定。","被闪避的命中不造成伤害，也无法暴击。","高暴击几率配低命中率会浪费大多数判定。","规划转型时，把暴击几率与真实命中率配对考虑。"]},{"id":"transition-checklist","order":8,"title":"转型清单：你是否该走暴击？","type":"diagnostic","visible":true,"toc":true,"intro":"回答关于你当前流派的问题。工具会指向判断你应不应该投入暴击方向最有用的下一步。","controls":[{"id":"base-crit","label":"你技能的基础暴击几率","options":[{"label":"低（低于 5%）","value":"low"},{"label":"中（5% 到 10%）","value":"moderate"},{"label":"高（10% 或更高）","value":"high"}]},{"id":"final-crit","label":"叠加增加类之后的最终暴击几率","options":[{"label":"低于 30%","value":"low"},{"label":"30% 到 60%","value":"mid"},{"label":"高于 60%","value":"high"}]},{"id":"hit-chance","label":"你对目标的可靠命中率","options":[{"label":"可靠（高于 90%）","value":"reliable"},{"label":"不可靠","value":"unreliable"}]},{"id":"content","label":"你主要构建的内容","options":[{"label":"刷图 / 清图速度","value":"mapping"},{"label":"打 boss / 单体","value":"bossing"}]}],"rules":[{"title":"先解决命中问题","when":{"hit-chance":"unreliable"},"steps":["提升命中值，或换成不会被闪避的技能。","只有当命中率可靠地高于 90% 后，再回头考虑暴击。","记住：被闪避的攻击永远不会暴击，因此在命中落地前投入暴击是浪费。"]},{"title":"暴击尚不值得强行投入","when":{"final-crit":"low"},"steps":["你的最终暴击几率太低，暴击无法驱动伤害。","优先选择更多类乘数或固定伤害缩放路线。","只有当基础或固定暴击几率能被显著提升后，再考虑暴击。"]},{"title":"把暴击作为主力伤害","when":{"final-crit":"high","hit-chance":"reliable"},"steps":["你的暴击几率高且命中落地，因此暴击频繁发生。","在条件允许时投资暴击伤害加成与能量球。","持续检查你是否为了维持这套暴击而牺牲了防御与预算。"]},{"title":"平衡暴击与单体覆盖率","when":{"content":"bossing","final-crit":"mid"},"steps":["若命中可靠且攻击频繁，中等暴击几率对 boss 也可接受。","增加固定暴击几率或能量球覆盖率，以平滑 boss 战的方差。","在过度投资之前，与一套非暴击的更多类乘数方案做对比。"]}],"defaultResult":{"title":"通用转型指引","steps":["在重视暴击之前，先确认命中可靠落地。","提升基础或固定暴击几率，让增加类词缀有可缩放的对象。","只有当暴击发生得足够频繁后，再叠加暴击伤害加成。","关注你为达成暴击方案而放弃的防御与预算。"]}},{"id":"worked-examples","order":9,"title":"计算示例","type":"data-table","visible":true,"toc":true,"caption":"两个说明性案例，展示基础暴击与固定暴击如何改变同一笔增加暴击几率投资的价值。数值为假设的教学值，待 PC 验证。","columns":[{"key":"case","label":"案例"},{"key":"setup","label":"配置"},{"key":"result","label":"结果"}],"filters":[],"rows":[{"tags":["low-base"],"cells":{"case":"低基础法术（假设基础 5%）","setup":"5% 基础 + 0 固定 + 100% 增加 =（5% + 0）× 2.0","result":"最终暴击几率 10%。暴击罕见；强行走暴击需先加固定暴击。"}},{"tags":["high-base"],"cells":{"case":"高基础匕首攻击（假设基础 15%）","setup":"15% 基础 + 30% 固定 + 100% 增加 =（15% + 30%）× 2.0","result":"最终暴击几率 90%。同样的增加投资因更高的基础与固定而回报大得多。"}}],"note":"对比说明固定与基础暴击几率与增加百分比同等重要。实时基础值的具体数值待 PC 验证。"},{"id":"troubleshooting","order":10,"title":"常见错误","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["大多数暴击问题来自对计算的误解，而非运气不好。留意这些点，比任何单次判定都更能保住伤害。"],"bullets":["在接近零的基础上堆叠增加暴击几率，导致最终数值仍很低。","把固定暴击几率与增加暴击几率混淆，把一个当成另一个重复计算。","命中不足时投资暴击几率，导致大多数攻击在被闪避前就消失了。","假设所有技能暴击方式相同；多段、引导与持续伤害进行独立或不同的判定。","认为存在一个适用于所有流派的“达到 X%”规则——正确门槛取决于基础、固定、加成与覆盖率。","为达成暴击方案而牺牲过多防御或预算，结果仅略微优于非暴击路线。"]},{"id":"community-cases","order":11,"title":"常见困惑点","type":"card-grid","visible":true,"toc":true,"intro":"玩家在《流放之路2》暴击几率与暴击伤害方面经常提出的困惑（转述）。","cards":[{"title":"暴击倍率 vs 暴击伤害加成","tag":"terminology","body":["玩家仍称之为“暴击倍率”。在《流放之路2》中当前名称为暴击伤害加成，它以暴击时的加成形式呈现，而非一个单独的倍率数值。"]},{"title":"固定暴击没用","tag":"misconception","body":["有人认为固定暴击几率毫无用处。对低基础技能而言，它是让暴击得以发生最高效的方式，因为增加类只会缩放基础加固定已经提供的部分。"]},{"title":"为什么 boss 战暴击手感随机","tag":"variance","body":["中等暴击几率且每秒命中少时，暴击会成簇出现。更平滑的 boss 伤害需要更高暴击几率、更多攻击次数或能量球覆盖率——而不只是更多增加类。"]},{"title":"被闪避的命中“本该暴击”","tag":"accuracy","body":["玩家归咎于随机，真正问题却是命中。被闪避的攻击在暴击判定之前就被移除，因此无论暴击几率多高都不会暴击。"]}]},{"id":"video-guide","order":12,"title":"视频指南","type":"video","visible":true,"toc":true,"entries":[{"label":"Complete Critical Hit Guide - Path of Exile 2","creator":"silentstill","description":"完整讲解《流放之路2》中的暴击：基础暴击、增加暴击几率、暴击伤害加成、每次命中的暴击判定，以及如何规划暴击流派。","takeaway":"从基础往上构建暴击——先提升基础或固定暴击几率，再用增加类缩放，只有在暴击足够频繁后再叠加暴击伤害加成。","url":"https://www.youtube.com/watch?v=QRGpfmRYqt8","timestamps":[{"label":"简介","time":"0:00"},{"label":"基础暴击几率","time":"1:20"},{"label":"增加暴击几率","time":"3:45"},{"label":"暴击伤害加成","time":"6:10"},{"label":"多段命中与每次命中暴击判定","time":"9:30"},{"label":"转型清单","time":"12:15"},{"label":"总结","time":"15:00"}]}]},{"id":"faq","order":13,"title":"常见问题","type":"faq","visible":true,"toc":true,"items":[{"question":"暴击伤害加成和旧版的暴击倍率是一样的吗？","answer":["在《流放之路2》中当前名称为暴击伤害加成。它代表暴击命中时额外造成的伤害，所有来源加在一起。基础具体系数随版本变动，已标注为待 PC 验证。"]},{"question":"为什么我堆叠增加暴击几率，暴击却没提升多少？","answer":["增加暴击几率会乘以你的（基础 + 固定）暴击几率。如果你的基础和固定值接近零，再大的增加总量也只产生很小的最终数值。请先提升基础或固定暴击几率。"]},{"question":"持续伤害与异常状态在《流放之路2》中会暴击吗？","answer":["持续伤害与异常状态的暴击交互遵循《流放之路2》当前规则，与正常命中不同，且可能随版本变化。在依赖它之前，请以游戏内 tooltip 查证当前行为。"]},{"question":"如果我的暴击几率很高却很少暴击，问题出在哪？","answer":["先检查你的命中率。对攻击而言，被闪避的命中在暴击判定之前就被移除，因此低命中会浪费你的暴击几率。对法术，请确认命中确实打到了目标。"]},{"question":"有没有一个暴击几率百分比，达到就该转暴击？","answer":["没有。正确的临界点取决于你的基础暴击、固定暴击、暴击伤害加成、命中可靠度，以及你的攻击频率。请用转型清单判断你自己的流派，而不是套用统一门槛。"]},{"question":"所有技能的暴击判定方式都一样吗？","answer":["不一样。单次命中判定一次，多段命中技能逐段判定，引导技能通常逐跳判定。每种行为不同，因此暴击投资在不同技能类型上的收益也不同。"]}]},{"id":"sources","order":14,"title":"来源与验证","type":"sources","visible":true,"toc":true,"categories":[{"label":"PoE2 官方 wiki","description":"《流放之路2》官方 wiki，关于暴击及相关战斗机制的参考","url":"https://poe2wiki.net/"},{"label":"silentstill - Complete Critical Hit Guide（YouTube）","description":"关于《流放之路2》暴击机制的社区视频讲解","url":"https://www.youtube.com/watch?v=QRGpfmRYqt8"},{"label":"Maxroll PoE2 指南中心","description":"《流放之路2》的社区机制与流派构建中心","url":"https://maxroll.gg/poe2"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":15,"title":"更新日志","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["首次发布《流放之路2》抢先体验 0.5.4 版本的暴击几率、暴击伤害加成与转型指南。","新增直接回答、关键定义、攻击与法术基础暴击、暴击判定行为、叠加公式、命中交互、转型诊断、计算示例、常见错误、社区困惑、视频、常见问题与来源。"]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 官方 wiki","url":"https://poe2wiki.net/","sourceType":"official"},{"label":"silentstill - Complete Critical Hit Guide（YouTube）","url":"https://www.youtube.com/watch?v=QRGpfmRYqt8","sourceType":"community"},{"label":"Maxroll PoE2 指南中心","url":"https://maxroll.gg/poe2","sourceType":"community"}],"seo":{"title":"流放之路2 暴击几率、暴击伤害加成与暴击转型指南","description":"讲解《流放之路2》中暴击几率与暴击伤害加成的运作方式、它们如何叠加，以及如何判断你的流派是否该转向以暴击为核心的发展方向。","noindex":false}},{"id":"life-mana-recovery-leech-regeneration-recoup-recharge","slug":"life-mana-recovery-leech-regeneration-recoup-recharge","locale":"en","type":"guide","status":"published","featured":false,"title":"Life & Mana Recovery: Leech, Regeneration, Recoup, Recharge, and Flasks in Path of Exile 2","shortTitle":"Recovery Mechanics","summary":"How the five recovery methods in Path of Exile 2 actually work: Leech, Regeneration, Recoup, Energy Shield Recharge, and Flasks — what triggers each, which resource they fill, and how the 0.5 Leech rework changed everything.","description":"A mechanic guide to Path of Exile 2 life and mana recovery: Leech rules and the 0.5 damage cap, Regeneration rates, Recoup as delayed recovery, Energy Shield Recharge start and interruption, and Flask burst sustain, with a comparison table and a choose-your-recovery diagnostic.","guideCategory":"mechanics","heroImage":"/images/items/charms-hero.webp","cardImage":"/images/items/charms-hero.webp","imageAlt":"A Path of Exile 2 charm icon representing life and mana recovery methods","estimatedReadingMinutes":16,"prerequisites":["A basic understanding of Life, Mana, and Energy Shield as your character's resources","Familiarity with the character panel, buff icons, and reading item modifiers"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","leech","regeneration","recoup","recharge","flask","recovery","resource"],"sections":[{"id":"quick-answer","order":1,"title":"Direct answers","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"Leech","body":["Recovers a fraction of the damage you deal as Life, Mana, or Energy Shield — but only for the Damage Type and Hit type the leech modifier names. Most leech is physical Attack leech, so it does nothing on a fully elementally-converted build."]},{"title":"Regeneration","body":["Continuous, always-on recovery of a resource over time. Not tied to hitting or being hit, and not stopped when the resource is full. Life and Energy Shield have no base regen; Mana regenerates on its own."]},{"title":"Recoup","body":["Pays back a portion of the damage you take from a Hit as Life, Mana, or Energy Shield over a duration. It is delayed recovery, separate from Regeneration, and keeps running even at full resource."]},{"title":"Recharge","body":["Energy Shield only. After you avoid damage for a short moment, your ES refills; any damaging hit interrupts it. The 0.5 update slowed recharge-start passives."]},{"title":"Flasks","body":["Instant on-use burst of Life or Mana. The most reliable sustain when you cannot land hits (so Leech is weak) or take few hits (so Recoup is weak), limited by flask charges."]}]},{"id":"comparison","order":2,"title":"Recovery method comparison","type":"data-table","visible":true,"toc":true,"caption":"The five recovery methods side by side: what starts them, which resource they fill, whether they need a hit, what happens at full resource, and how they behave against bosses.","columns":[{"key":"recovery","label":"Recovery"},{"key":"trigger","label":"Trigger"},{"key":"resource","label":"Resource"},{"key":"needs-hit","label":"Needs Hit?"},{"key":"full-behavior","label":"Full-resource behavior"},{"key":"boss-stability","label":"Boss stability"}],"filters":[],"rows":[{"tags":["leech"],"cells":{"recovery":"Leech","trigger":"Dealing damage of the matching Damage Type and Hit type","resource":"Life, Mana, or Energy Shield","needs-hit":"Yes — a hit you deal","full-behavior":"Normally stops at full resource; must keep hitting","boss-stability":"Unstable during no-hit or immunity phases"}},{"tags":["regeneration"],"cells":{"recovery":"Regeneration","trigger":"Passive, always on","resource":"Life, Mana, or Energy Shield","needs-hit":"No","full-behavior":"Continuous; not stopped at full","boss-stability":"Stable; works while you do nothing"}},{"tags":["recoup"],"cells":{"recovery":"Recoup","trigger":"Taking a Hit","resource":"Life, Mana, or Energy Shield","needs-hit":"Yes — a hit you take","full-behavior":"Continues at full (excess wasted)","boss-stability":"Stable while you keep getting hit; delayed"}},{"tags":["recharge"],"cells":{"recovery":"Recharge","trigger":"Stop taking damage for a moment","resource":"Energy Shield only","needs-hit":"No — needs no damage","full-behavior":"Fills ES after a delay; interrupted by damage","boss-stability":"Fragile — any hit interrupts recharge"}},{"tags":["flask"],"cells":{"recovery":"Flask","trigger":"Use flask / gain charges","resource":"Life or Mana","needs-hit":"No — charges from kills or time","full-behavior":"Instant burst; capped by charges","boss-stability":"Strong burst but limited by charge income"}}],"note":"These are behaviors in current Path of Exile 2 Early Access; specific thresholds and rates are client-version dependent."},{"id":"leech","order":3,"title":"Leech","type":"overview","visible":true,"toc":true,"paragraphs":["Leech recovers a portion of the damage you deal as Life, Mana, or Energy Shield. The critical rule in Path of Exile 2 is that leech only applies to the Damage Type and Hit type named by the leech modifier. Most leech found on items grants physical Attack leech, which only counts physical damage dealt by attacks. A hit that deals none of the matching damage type leeches nothing at all.","The 0.5 update reworked Leech. Only one Leech instance can be active per resource at a time — if several trigger, only the one with the highest recovery rate applies and the others are ignored. There is also a damage cap: a single hit is treated as dealing at most 40,000 damage for Leech calculations, so very large hits no longer scale Leech without limit. The exact per-instance recovery rate and duration are client-version dependent; confirm precise coefficients in-game."],"bullets":["Leech requires you to deal a hit of the matching Damage Type — it is not 'any damage'.","Physical Attack Leech fails on a build that fully converts its physical damage to elemental.","One instance per resource (0.5): the highest recovery-rate instance wins.","40,000 damage cap per hit for Leech purposes (0.5).","Leech normally ends when the resource is full, so you must keep hitting to keep leeching."]},{"id":"regeneration","order":4,"title":"Regeneration","type":"overview","visible":true,"toc":true,"paragraphs":["Regeneration is continuous, always-on recovery of a resource over time. It is not tied to dealing or taking damage. Life and Energy Shield have no base regeneration by default; Mana has a small base regeneration (about 4% of maximum Mana per second). All other regeneration comes from passive nodes, gear, or auras.","Regeneration can be a flat amount per second or a percentage of the resource's maximum. It is not stopped when the resource is full, and it is a separate mechanic from Leech, Recoup, and Recharge — modifiers to Regeneration do not affect those other recovery types."],"bullets":["Life and Energy Shield: no base regeneration; must be gained from modifiers.","Mana: base regeneration of roughly 4% of maximum Mana per second.","Flat regeneration and percent regeneration add to the base differently but both contribute.","Regeneration is continuous and works during boss immunity phases — excellent for sustained bossing.","Recovery Rate modifiers also multiply regeneration alongside other recovery types."]},{"id":"recoup","order":5,"title":"Recoup","type":"overview","visible":true,"toc":true,"paragraphs":["Recoup recovers a portion of the damage you take from a Hit, returned as Life, Mana, or Energy Shield over a duration (8 seconds by default in current Path of Exile 2). Each hit you take creates its own Recoup instance, and there is no cap on how many instances can run at once.","Recoup is NOT Regeneration and is not affected by modifiers to Regeneration. Unlike Leech, Recoup continues even when the resource is already full, though any excess is wasted. Damage over Time does not trigger Recoup. The exact base duration is client-version dependent (some community pages still cite older 4-second values); confirm precise numbers in-game."],"bullets":["Triggered by taking a Hit, not by dealing one.","Paid back over time (8 seconds base) — delayed recovery, not instant.","Distinct from Regeneration; uses its own modifier pool.","Damage over Time effects do not activate Recoup.","Per-hit instances are independent and uncapped in number."]},{"id":"recharge","order":6,"title":"Recharge","type":"overview","visible":true,"toc":true,"paragraphs":["Recharge applies to Energy Shield only. After you stop taking damage for a short period, your Energy Shield begins to refill at a rate based on your maximum Energy Shield. Any hit that deals damage interrupts recharge and resets the start delay.","In the 0.5 update, passive-tree recharge-start thresholds were reduced (for example the Mystic Stance node dropped from 30% to 12%), so Energy Shield generally starts recharging more slowly after a hit than before. Treat the exact node values as client-version dependent."],"bullets":["Energy Shield only — Life and Mana do not recharge.","Starts after a delay during which you take no damage.","Interrupted by any damaging hit.","0.5 nerfed recharge-start passives, so recovery after hits is slower.","Pairs best with high avoidance so you can stop getting hit."]},{"id":"flasks","order":7,"title":"Flasks","type":"overview","visible":true,"toc":true,"paragraphs":["Flasks provide an instant burst of Life or Mana recovery (or other effects) when used. They refill their charges from kills and, for some flask types, over time. Flasks are the most reliable burst sustain because they do not depend on hitting or being hit.","In boss fights where you cannot always land hits (so Leech is weak) and where you take few hits (so Recoup is weak), flask charges become your main planned sustain. Do not quote fixed flask sustain numbers without testing — values depend on flask tier, modifiers, and charge gain, which are client-version dependent."],"bullets":["Instant, on-use recovery of Life or Mana.","Charges come mainly from kills; some flasks refill over time.","Best burst sustain when Leech and Recoup are unreliable.","Boss sustain depends on charge income, not a fixed figure.","Flask recovery is separate from Regeneration."]},{"id":"choose-recovery","order":8,"title":"Choose your recovery","type":"diagnostic","visible":true,"toc":true,"intro":"Pick the profile that matches your build. The tool points to the recovery methods that fit best.","controls":[{"id":"build-profile","label":"Which build profile fits you?","options":[{"label":"Attack build (physical)","value":"attack"},{"label":"Caster / spell build","value":"caster"},{"label":"Energy Shield build","value":"es"},{"label":"Damage-over-Time build","value":"dot"},{"label":"Bossing-heavy build","value":"bossing"}]}],"rules":[{"title":"Attack build recovery","when":{"build-profile":"attack"},"steps":["Use physical Attack Leech if your hits deal physical damage.","If you convert physical to elemental, switch to a matching leech or use Recoup/Flask instead.","Keep a Life Flask for burst and consider small Regeneration for steady sustain."]},{"title":"Caster build recovery","when":{"build-profile":"caster"},"steps":["Add Mana Leech or Mana Regeneration so spell costs do not drain you.","Use spell-damage leech only if your leech modifier supports spells.","Keep a Mana Flask and some Life recovery for survivability."]},{"title":"Energy Shield build recovery","when":{"build-profile":"es"},"steps":["Rely on Energy Shield Recharge after avoiding damage.","ES Leech is possible but recharge is steadier; note 0.5 slowed recharge-start.","Improve avoidance so recharge is not interrupted."]},{"title":"Damage-over-Time build recovery","when":{"build-profile":"dot"},"steps":["Leech is weak because DoT is not a Hit — do not depend on it.","Use Recoup (you still take hits) plus Regeneration for stable sustain.","Keep Flasks for burst when Recoup lag is dangerous."]},{"title":"Bossing-heavy build recovery","when":{"build-profile":"bossing"},"steps":["Prioritize Regeneration and Flasks — both work during immunity phases.","Do not rely on Leech when you cannot land hits.","Use Recoup if the fight keeps dealing contact damage to you."]}],"defaultResult":{"title":"General recovery guidance","steps":["Stack at least two independent recovery layers rather than one.","Match leech to your actual Damage Type and Hit type.","Keep Flasks as your reliable burst backstop in every fight."]}},{"id":"worked-examples","order":9,"title":"Worked examples","type":"data-table","visible":true,"toc":true,"caption":"Three illustrative cases showing how Damage Type, Hit type, and resource shape the right recovery choice. No fixed numbers are promised.","columns":[{"key":"case","label":"Case"},{"key":"setup","label":"Setup"},{"key":"result","label":"Result"}],"filters":[],"rows":[{"tags":["leech"],"cells":{"case":"Elemental-converted attack","setup":"Attack build converts 100% of physical damage to fire","result":"Physical Attack Leech leeches nothing — conversion removed the matching damage type. Use fire/chaos leech, Recoup, or Flasks instead."}},{"tags":["recoup"],"cells":{"case":"Damage-over-Time build","setup":"Poison or ignite caster that lands few direct hits","result":"Leech is weak because DoT is not a Hit. Use Recoup (you still take hits) plus Regeneration for stable sustain."}},{"tags":["recharge"],"cells":{"case":"Energy Shield build","setup":"ES build with high avoidance and some recharge-start investment","result":"Use ES Recharge after avoiding hits. ES Leech is possible but recharge is steadier; the 0.5 recharge-start nerfs slow the refill after a hit."}}],"note":"These are teaching examples; exact sustain depends on your modifiers and client version."},{"id":"troubleshooting","order":10,"title":"Common mistakes","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["Most recovery problems come from mismatched Damage Types or misunderstanding which mechanic triggers which layer, not from bad luck. Watch for these before you re-roll gear."],"bullets":["Have Leech but see no recovery: your damage type does not match the leech modifier (for example physical leech on a fully converted build).","Unstable Mana: no Mana Leech or Mana Regeneration, so skill costs drain you. Add mana leech, mana regen, or flasks.","Recharge never starts: you are taking constant damage. Improve avoidance or use another layer.","Thinking Recoup is Regeneration (or vice versa) — they use separate modifiers.","Expecting Leech to work during boss immunity phases when you cannot land hits.","Assuming Leech scales with huge hits after 0.5 — there is a 40,000 damage cap per hit."]},{"id":"community-cases","order":11,"title":"Common points of confusion","type":"card-grid","visible":true,"toc":true,"intro":"Paraphrased confusions players frequently raise about recovery mechanics.","cards":[{"title":"Physical leech on a converted build","tag":"leech","body":["A player converts all physical damage to fire and wonders why their physical Attack Leech heals nothing. The matching damage type is gone, so leech has nothing to count."]},{"title":"Leech not working in a boss fight","tag":"leech","body":["During an immunity or untargetable phase the player cannot land hits, so no leech triggers. Regeneration and Flasks keep them alive instead."]},{"title":"Recoup versus regeneration","tag":"recoup","body":["A player stacks regeneration modifiers expecting Recoup to grow. They are separate pools; regeneration mods do not raise Recoup."]},{"title":"Recharge keeps interrupting","tag":"recharge","body":["An Energy Shield player stands in damage and recharge never completes. Any hit resets the start delay; avoidance is what lets ES refill."]}]},{"id":"video","order":12,"title":"Video guide","type":"video","visible":true,"toc":true,"entries":[{"label":"How To Leech In Path of Exile 2 | Is Leech Working?","creator":"HumbleHazard","description":"A community walkthrough of how Leech works in Path of Exile 2, the requirements for it to trigger, leech resistance, and how conversion interacts with leech after the 0.5 changes.","takeaway":"Leech only counts the damage type and hit type your leech modifier specifies, and the 0.5 rework capped per-hit leech and limited one instance per resource.","url":"https://www.youtube.com/watch?v=9Fg_uniySKE","timestamps":[{"label":"Introduction","time":"0:00"},{"label":"What Leech is","time":"1:10"},{"label":"Leech requirements","time":"3:25"},{"label":"Leech resistance","time":"6:40"},{"label":"Conversion interaction","time":"9:15"},{"label":"0.5 Leech changes","time":"12:00"},{"label":"Summary","time":"15:30"}]}]},{"id":"faq","order":13,"title":"Frequently asked questions","type":"faq","visible":true,"toc":true,"items":[{"question":"Does Leech work on any damage?","answer":["No. Leech only applies to the Damage Type and Hit type named by the leech modifier. Common physical Attack leech only counts physical damage from attacks, so elemental or spell damage may leech nothing."]},{"question":"Why does my physical leech do nothing on my fire build?","answer":["If your build converts 100% of physical damage to fire, there is no physical damage left for physical Attack Leech to count. Use a leech modifier that matches your actual damage type, or switch to Recoup or Flasks."]},{"question":"Is Recoup the same as Regeneration?","answer":["No. Recoup pays back a portion of damage you take from hits over a duration, and it is a separate mechanic with its own modifiers. Regeneration is continuous recovery not tied to taking damage, and modifiers to one do not affect the other."]},{"question":"Why will my Energy Shield not recharge?","answer":["Recharge only starts after you avoid damage for a short moment, and any damaging hit interrupts it. The 0.5 update also reduced recharge-start passives, so it begins more slowly. Improve avoidance so the delay can elapse."]},{"question":"Can one huge hit refill my whole life bar through Leech?","answer":["Not after the 0.5 rework. A single hit is treated as dealing at most 40,000 damage for Leech calculations, so beyond that point bigger hits do not increase leech. Higher leech percentage still helps, but the per-hit cap stays."]},{"question":"Does Flask recovery count as Regeneration?","answer":["No. Flasks are an instant on-use burst and are a separate recovery source. Recovery Rate modifiers may multiply flask recovery alongside other types, but flasks are not Regeneration."]}]},{"id":"sources","order":14,"title":"Sources and verification","type":"sources","visible":true,"toc":true,"categories":[{"label":"Official wiki - Leech","description":"PoE2 wiki reference for the Leech mechanic and its Damage Type / Hit requirements","url":"https://poe2wiki.net/wiki/Leech"},{"label":"Official wiki - Recoup","description":"PoE2 wiki reference for Recoup as delayed recovery after taking a hit","url":"https://poe2wiki.net/wiki/Recoup"},{"label":"Mobalytics - PoE2 mechanics hub","description":"Community hub covering regeneration, recoup, leech, and recharge mechanics","url":"https://mobalytics.gg/path-of-exile-2/"},{"label":"Video guide (HumbleHazard)","description":"Community video explaining how Leech works in Path of Exile 2","url":"https://www.youtube.com/watch?v=9Fg_uniySKE"}],"verificationChecklist":{"status":"pending-pc","method":"official","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":15,"title":"Changelog","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["Initial publication of the life and mana recovery guide for Path of Exile 2 Early Access 0.5.4, covering Leech, Regeneration, Recoup, Recharge, and Flasks.","Documented the 0.5 Leech rework: one instance per resource and a 40,000 damage cap per hit for Leech calculations.","Flagged version-sensitive coefficients (leech rate/duration, recoup duration, recharge-start thresholds) as client-version dependent."]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 wiki - Leech","url":"https://poe2wiki.net/wiki/Leech","sourceType":"official"},{"label":"PoE2 wiki - Recoup","url":"https://poe2wiki.net/wiki/Recoup","sourceType":"official"},{"label":"Mobalytics - Path of Exile 2 mechanics","url":"https://mobalytics.gg/path-of-exile-2/","sourceType":"community"},{"label":"HumbleHazard - How To Leech In Path of Exile 2 (YouTube)","url":"https://www.youtube.com/watch?v=9Fg_uniySKE","sourceType":"community"}],"seo":{"title":"PoE 2 Life & Mana Recovery: Leech, Regeneration, Recoup, Recharge, Flasks","description":"How life and mana recovery works in Path of Exile 2: Leech rules, the 0.5 damage cap, Regeneration, Recoup, Energy Shield Recharge, and Flask sustain, with a comparison table and diagnostic.","noindex":false}},{"id":"life-mana-recovery-leech-regeneration-recoup-recharge","slug":"life-mana-recovery-leech-regeneration-recoup-recharge","locale":"zh-cn","type":"guide","status":"published","featured":false,"title":"生命与法力恢复：流放之路2 中的偷取、再生、补偿、充能护盾与药剂","shortTitle":"恢复机制","summary":"流放之路2 中五种恢复方式到底如何运作：偷取、再生、补偿、能量护盾充能以及药剂——各自由什么触发、恢复哪种资源，以及 0.5 版本对偷取的改动如何改变了整个体系。","description":"流放之路2 生命与法力恢复机制指南：偷取规则与 0.5 伤害上限、再生速率、作为延迟恢复的补偿、能量护盾充能的启动与中断，以及药剂爆发恢复，并附有对比表与「选择你的恢复」诊断。","guideCategory":"mechanics","heroImage":"/images/items/charms-hero.webp","cardImage":"/images/items/charms-hero.webp","imageAlt":"流放之路2 护符图标，代表生命与法力的恢复方式","estimatedReadingMinutes":16,"prerequisites":["基本理解生命、法力与能量护盾作为角色资源的含义","熟悉角色面板、增益图标以及物品词缀的阅读"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","leech","regeneration","recoup","recharge","flask","recovery","resource"],"sections":[{"id":"quick-answer","order":1,"title":"直接结论","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"偷取（Leech）","body":["把你造成伤害的一部分按生命、法力或能量护盾的形式回收——但只针对偷取词缀所指定的伤害类型与命中类型。多数偷取为物理攻击偷取，因此在完全转为元素伤害的流派中毫无作用。"]},{"title":"再生（Regeneration）","body":["持续、常驻的资源随时间恢复。不与命中或受击挂钩，且在资源已满时也不会停止。生命与能量护盾没有基础再生；法力会自动再生。"]},{"title":"补偿（Recoup）","body":["把你受到命中伤害的一部分，在持续时间内以生命、法力或能量护盾的形式返还。它是延迟恢复，与再生相互独立，即便资源已满也会继续结算。"]},{"title":"充能（Recharge）","body":["仅限能量护盾。在你短时间未受伤害后，能量护盾开始回充；任何造成伤害的命中都会打断它。0.5 版本削弱了充能起始加成。"]},{"title":"药剂（Flask）","body":["使用即触发、瞬间爆发恢复生命或法力。当你无法稳定命中（偷取偏弱）或很少受击（补偿偏弱）时最可靠，但受药剂充能限制。"]}]},{"id":"comparison","order":2,"title":"恢复方式对比","type":"data-table","visible":true,"toc":true,"caption":"五种恢复方式并排对比：由什么触发、恢复哪种资源、是否需要命中、资源已满时的表现，以及在 Boss 战中的稳定性。","columns":[{"key":"recovery","label":"恢复方式"},{"key":"trigger","label":"触发条件"},{"key":"resource","label":"资源"},{"key":"needs-hit","label":"需要命中？"},{"key":"full-behavior","label":"资源已满时"},{"key":"boss-stability","label":"Boss 战稳定性"}],"filters":[],"rows":[{"tags":["leech"],"cells":{"recovery":"偷取","trigger":"造成匹配伤害类型与命中类型的伤害","resource":"生命、法力或能量护盾","needs-hit":"是——你打出的命中","full-behavior":"资源满后通常停止，需持续命中","boss-stability":"在无命中或免疫阶段不稳定"}},{"tags":["regeneration"],"cells":{"recovery":"再生","trigger":"被动，常驻生效","resource":"生命、法力或能量护盾","needs-hit":"否","full-behavior":"持续，资源满也不停止","boss-stability":"稳定，空闲时也能生效"}},{"tags":["recoup"],"cells":{"recovery":"补偿","trigger":"受到命中伤害","resource":"生命、法力或能量护盾","needs-hit":"是——你受到的命中","full-behavior":"资源满仍继续（溢出浪费）","boss-stability":"持续受击时稳定，但延迟"}},{"tags":["recharge"],"cells":{"recovery":"充能","trigger":"短时间未受伤害","resource":"仅能量护盾","needs-hit":"否——需要不受伤害","full-behavior":"延迟后回充，受击即中断","boss-stability":"脆弱——任何命中都会打断"}},{"tags":["flask"],"cells":{"recovery":"药剂","trigger":"使用药剂 / 获得充能","resource":"生命或法力","needs-hit":"否——充能来自击杀或时间","full-behavior":"瞬间爆发，受充能上限限制","boss-stability":"爆发强，但受充能收入限制"}}],"note":"以上为当前流放之路2 抢先体验版本中的行为；具体阈值与速率随客户端版本变化。"},{"id":"leech","order":3,"title":"偷取","type":"overview","visible":true,"toc":true,"paragraphs":["偷取把你造成伤害的一部分以生命、法力或能量护盾的形式回收。流放之路2 中的关键规则是：偷取仅作用于偷取词缀所指明的伤害类型与命中类型。物品上最常见的偷取为物理攻击偷取，只计算攻击造成的物理伤害。一次命中若不含任何匹配的伤害类型，则完全不会触发偷取。","0.5 版本对偷取进行了重做。每种资源同时只能存在一个偷取实例——若多个被触发，仅有恢复速率最高的那个生效，其余被忽略。此外还有伤害上限：单此命中在偷取计算中最多只按 40000 点伤害计算，因此超高伤害不再能无限放大偷取。单次实例的恢复速率与持续时间为客户端版本相关，具体系数请以游戏内为准。"],"bullets":["偷取要求你打出匹配伤害类型的命中——并非「任何伤害」都生效。","物理攻击偷取在完全将物理伤害转为元素的流派中会失效。","每种资源仅一个实例（0.5）：恢复速率最高者胜出。","偷取的单次命中伤害上限为 40000（0.5）。","资源满后偷取通常停止，因此必须持续命中才能持续偷取。"]},{"id":"regeneration","order":4,"title":"再生","type":"overview","visible":true,"toc":true,"paragraphs":["再生是持续、常驻的资源随时间恢复。它不与造成或承受伤害挂钩。生命与能量护盾默认没有基础再生；法力有少量基础再生（约为最大法力的 4%/秒）。其余再生全部来自天赋节点、装备或光环。","再生可以是每秒固定数值，也可以是资源最大值的一定百分比。它在资源已满时不会停止，且与偷取、补偿、充能是相互独立的机制——再生词缀不会影响其他几种恢复类型。"],"bullets":["生命与能量护盾：无基础再生，需通过词缀获取。","法力：基础再生约为最大法力的 4%/秒。","固定再生与百分比再生对基础的加成方式不同，但都会贡献。","再生是持续的，在 Boss 免疫阶段也能生效——非常适合持久 Boss 战。","恢复速率（Recovery Rate）词缀会与其他恢复类型一起乘算再生。"]},{"id":"recoup","order":5,"title":"补偿","type":"overview","visible":true,"toc":true,"paragraphs":["补偿把你受到命中伤害的一部分，在持续时间内以生命、法力或能量护盾的形式返还（当前流放之路2 默认持续 8 秒）。你受到的每次命中都会创建独立的补偿实例，且同时存在的实例数量没有上限。","补偿并非再生，也不受再生词缀影响。与偷取不同，即便资源已满，补偿仍会继续结算，只是溢出部分被浪费。持续伤害（Damage over Time）不会触发补偿。具体的默认持续时间为客户端版本相关（部分社区页面仍引用较早的 4 秒数值），请以游戏内为准。"],"bullets":["由受到命中触发，而非由造成伤害触发。","随时间返还（默认 8 秒）——是延迟恢复，而非瞬发。","与再生相互独立，使用各自的词缀池。","持续伤害效果不会激活补偿。","每次命中产生的实例相互独立，数量无上限。"]},{"id":"recharge","order":6,"title":"充能","type":"overview","visible":true,"toc":true,"paragraphs":["充能仅作用于能量护盾。在你短时间未受伤害后，能量护盾开始按最大能量护盾的速率回充。任何造成伤害的命中都会打断充能并重置启动延迟。","在 0.5 版本中，天赋树上的充能起始阈值被下调（例如神秘姿态节点由 30% 降为 12%），因此受击后能量护盾一般比之前更慢才开始回充。具体节点数值为客户端版本相关。"],"bullets":["仅限能量护盾——生命与法力不会充能。","在你一段时间不受伤害后的延迟后启动。","任何造成伤害的命中都会打断。","0.5 削弱了充能起始加成，受击后恢复更慢。","最契合高闪避，让你能够停止受击。"]},{"id":"flasks","order":7,"title":"药剂","type":"overview","visible":true,"toc":true,"paragraphs":["药剂在使用时提供瞬间的生命或法力爆发恢复（或其他效果）。它们通过击杀获得充能，部分药剂类型也可随时间回充。药剂是最可靠的爆发恢复，因为它不依赖命中或受击。","在 Boss 战中，当你难以稳定命中（偷取偏弱）且很少受击（补偿偏弱）时，药剂充能成为你主要的计划性恢复。请勿在未测试的情况下给出固定的药剂恢复数值——具体数值取决于药剂等级、词缀与充能获取，均为客户端版本相关。"],"bullets":["使用即触发，瞬间恢复生命或法力。","充能主要来自击杀；部分药剂随时间回充。","在偷取与补偿都不可靠时是最佳爆发恢复。","Boss 战恢复取决于充能收入，而非固定数字。","药剂恢复与再生相互独立。"]},{"id":"choose-recovery","order":8,"title":"选择你的恢复","type":"diagnostic","visible":true,"toc":true,"intro":"选择符合你流派的画像，工具会指向最合适的恢复方式。","controls":[{"id":"build-profile","label":"你属于哪种流派画像？","options":[{"label":"攻击流派（物理）","value":"attack"},{"label":"施法 / 法术流派","value":"caster"},{"label":"能量护盾流派","value":"es"},{"label":"持续伤害流派","value":"dot"},{"label":"重度 Boss 战流派","value":"bossing"}]}],"rules":[{"title":"攻击流派恢复","when":{"build-profile":"attack"},"steps":["若你的命中造成物理伤害，使用物理攻击偷取。","若将物理转为元素，请改用匹配的偷取，或改用补偿 / 药剂。","保留一瓶生命药剂应对爆发，并考虑少量再生作为稳定续航。"]},{"title":"施法流派恢复","when":{"build-profile":"caster"},"steps":["添加法力偷取或法力再生，避免技能消耗把你抽干。","仅当偷取词缀支持法术时，才使用法术伤害偷取。","保留法力药剂，并准备一些生命恢复以维持生存。"]},{"title":"能量护盾流派恢复","when":{"build-profile":"es"},"steps":["依赖能量护盾在闪避后的充能。","能量护盾偷取可行，但充能更稳定；注意 0.5 放慢了充能起始。","提升闪避，避免充能被打断。"]},{"title":"持续伤害流派恢复","when":{"build-profile":"dot"},"steps":["偷取偏弱，因为持续伤害不是命中——不要依赖它。","使用补偿（你仍会受击）配合再生以获得稳定续航。","在补偿延迟危险的时刻用药剂应对爆发。"]},{"title":"重度 Boss 战流派恢复","when":{"build-profile":"bossing"},"steps":["优先再生与药剂——二者在免疫阶段都能生效。","无法命中时，不要依赖偷取。","若战斗持续对你造成接触伤害，使用补偿。"]}],"defaultResult":{"title":"通用恢复建议","steps":["至少叠加两层相互独立的恢复，而非只有一层。","使偷取匹配你实际的伤害类型与命中类型。","每场战斗都保留药剂作为可靠的爆发兜底。"]}},{"id":"worked-examples","order":9,"title":"实例解析","type":"data-table","visible":true,"toc":true,"caption":"三个示例说明伤害类型、命中类型与资源如何影响正确的恢复选择。不承诺任何固定数值。","columns":[{"key":"case","label":"情形"},{"key":"setup","label":"配置"},{"key":"result","label":"结果"}],"filters":[],"rows":[{"tags":["leech"],"cells":{"case":"元素转化的攻击流派","setup":"攻击流派将 100% 物理伤害转化为火焰","result":"物理攻击偷取完全不生效——转化移除了匹配的伤害类型。应改用火焰 / 混沌偷取，或改用补偿、药剂。"}},{"tags":["recoup"],"cells":{"case":"持续伤害流派","setup":"中毒或点燃的施法者，很少打出直接命中","result":"偷取偏弱，因为持续伤害不是命中。使用补偿（你仍会受击）配合再生以获得稳定续航。"}},{"tags":["recharge"],"cells":{"case":"能量护盾流派","setup":"高闪避、投入一定充能起始的能量护盾流派","result":"在闪避后用能量护盾充能。能量护盾偷取可行但充能更稳定；0.5 的充能起始削弱使受击后回充更慢。"}}],"note":"以上为教学示例；实际续航取决于你的词缀与客户端版本。"},{"id":"troubleshooting","order":10,"title":"常见错误","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["多数恢复问题源于伤害类型不匹配，或误解了哪种机制触发哪一层恢复，而非运气不佳。重roll 装备前先检查这些。"],"bullets":["有偷取却看不到恢复：你的伤害类型与偷取词缀不匹配（例如完全转化的流派上的物理偷取）。","法力不稳定：没有法力偷取或法力再生，技能消耗把你抽干。应添加法力偷取、法力再生或药剂。","充能永远不启动：你一直在持续受击。提升闪避或改用其他层。","把补偿当作再生（或反之）——它们使用相互独立的词缀。","期望在 Boss 免疫、无法命中的阶段靠偷取生效。","以为 0.5 之后偷取还能随超高伤害放大——单次命中有 40000 伤害上限。"]},{"id":"community-cases","order":11,"title":"常见疑惑","type":"card-grid","visible":true,"toc":true,"intro":"玩家经常提出的关于恢复机制的疑惑（转述）。","cards":[{"title":"转化流派上的物理偷取","tag":"leech","body":["玩家把全部物理伤害转为火焰，却疑惑为何物理攻击偷取毫无恢复。匹配的伤害类型已消失，偷取无物可算。"]},{"title":"Boss 战中偷取不生效","tag":"leech","body":["在免疫或无法被选中的阶段，玩家无法打出命中，因此偷取不触发。此时由再生与药剂维持生存。"]},{"title":"补偿与再生混淆","tag":"recoup","body":["玩家堆叠再生词缀，以为补偿会随之增长。二者是不同的池子，再生词缀不会提升补偿。"]},{"title":"充能不断被打断","tag":"recharge","body":["能量护盾玩家站在伤害里，充能始终无法完成。任何命中都会重置启动延迟；闪避才是让能量护盾回充的关键。"]}]},{"id":"video","order":12,"title":"视频指南","type":"video","visible":true,"toc":true,"entries":[{"label":"流放之路2 偷取机制详解 | 偷取还生效吗？","creator":"HumbleHazard","description":"社区视频讲解流放之路2 中偷取的运作方式、触发条件、偷取抗性，以及 0.5 改动后转化与偷取的交互。","takeaway":"偷取只计算偷取词缀指定的伤害类型与命中类型；0.5 重做为单次命中偷取设上限，并限制每种资源仅一个实例。","url":"https://www.youtube.com/watch?v=9Fg_uniySKE","timestamps":[{"label":"简介","time":"0:00"},{"label":"什么是偷取","time":"1:10"},{"label":"偷取触发条件","time":"3:25"},{"label":"偷取抗性","time":"6:40"},{"label":"转化交互","time":"9:15"},{"label":"0.5 偷取改动","time":"12:00"},{"label":"总结","time":"15:30"}]}]},{"id":"faq","order":13,"title":"常见问题","type":"faq","visible":true,"toc":true,"items":[{"question":"偷取对所有伤害都生效吗？","answer":["不。偷取仅作用于偷取词缀所指明的伤害类型与命中类型。常见的物理攻击偷取只计算攻击造成的物理伤害，因此元素或法术伤害可能完全不触发偷取。"]},{"question":"为什么我的物理偷取在火伤流派里毫无作用？","answer":["若你的流派将 100% 物理伤害转为火焰，就不再有物理伤害可供物理攻击偷取计算。请改用匹配实际伤害类型的偷取，或改用补偿与药剂。"]},{"question":"补偿和再生是一回事吗？","answer":["不是。补偿把你受到命中伤害的一部分在持续时间内返还，是独立的机制，拥有自己的词缀。再生是不依赖受击的持续恢复，二者词缀互不影响。"]},{"question":"为什么我的能量护盾不充能？","answer":["充能仅在短时间未受伤害后启动，任何造成伤害的命中都会打断它。0.5 版本还下调了充能起始加成，使其启动更慢。提升闪避才能让延迟走完。"]},{"question":"一次超高伤害能否靠偷取回满血？","answer":["0.5 重做后不行。单次命中在偷取计算中最多只按 40000 点伤害计算，超出部分不再放大偷取。更高的偷取百分比仍有帮助，但单次命中上限不变。"]},{"question":"药剂恢复算再生吗？","answer":["不算。药剂是使用时瞬间爆发的独立恢复来源。恢复速率词缀可能与其他类型一起乘算药剂恢复，但药剂本身不是再生。"]}]},{"id":"sources","order":14,"title":"来源与核验","type":"sources","visible":true,"toc":true,"categories":[{"label":"官方 wiki - 偷取","description":"流放之路2 wiki 关于偷取机制及其伤害类型 / 命中要求的参考","url":"https://poe2wiki.net/wiki/Leech"},{"label":"官方 wiki - 补偿","description":"流放之路2 wiki 关于补偿作为受击后延迟恢复的参考","url":"https://poe2wiki.net/wiki/Recoup"},{"label":"Mobalytics - 流放之路2 机制中心","description":"涵盖再生、补偿、偷取与充能机制的社区中心","url":"https://mobalytics.gg/path-of-exile-2/"},{"label":"视频指南（HumbleHazard）","description":"讲解流放之路2 偷取机制的社区视频","url":"https://www.youtube.com/watch?v=9Fg_uniySKE"}],"verificationChecklist":{"status":"pending-pc","method":"official","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":15,"title":"更新日志","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["首次发布流放之路2 抢先体验 0.5.4 的生命与法力恢复指南，涵盖偷取、再生、补偿、充能与药剂。","记录 0.5 偷取重做：每种资源仅一个实例，且单次命中偷取伤害上限为 40000。","将版本相关系数（偷取速率 / 持续、补偿持续、充能起始阈值）标注为客户端版本相关。"]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"流放之路2 wiki - 偷取","url":"https://poe2wiki.net/wiki/Leech","sourceType":"official"},{"label":"流放之路2 wiki - 补偿","url":"https://poe2wiki.net/wiki/Recoup","sourceType":"official"},{"label":"Mobalytics - 流放之路2 机制","url":"https://mobalytics.gg/path-of-exile-2/","sourceType":"community"},{"label":"HumbleHazard - 流放之路2 偷取详解（YouTube）","url":"https://www.youtube.com/watch?v=9Fg_uniySKE","sourceType":"community"}],"seo":{"title":"流放之路2 生命与法力恢复：偷取、再生、补偿、充能、药剂","description":"流放之路2 中生命与法力恢复如何运作：偷取规则、0.5 伤害上限、再生、补偿、能量护盾充能与药剂续航，附对比表与诊断。","noindex":false}},{"id":"projectile-pierce-fork-chain-return","slug":"projectile-pierce-fork-chain-return","locale":"en","type":"guide","status":"published","featured":false,"title":"Projectile Pierce, Fork, Chain, and Return in Path of Exile 2","shortTitle":"Projectile Behaviours","summary":"How Pierce, Fork, Chain, and Return resolve on a single projectile collision in Path of Exile 2, including the priority order, enemy vs terrain chaining, and which skills forbid certain behaviours.","description":"A mechanics guide to Path of Exile 2 projectile behaviours: the collision priority order (Split, Pierce, Fork, Chain, Return), how enemy-chain differs from terrain-chain, which skills cannot Pierce/Fork/Chain/Return, and how to pick supports for clearing vs bossing.","guideCategory":"mechanics","heroImage":"/images/skills/chain-support.webp","cardImage":"/images/skills/chain-support.webp","imageAlt":"A Path of Exile 2 support gem icon representing projectile chain behaviour","estimatedReadingMinutes":15,"prerequisites":["Basic understanding of projectile skills and support gems","Familiarity with the in-game tooltip and the stats panel"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","projectile","pierce","fork","chain","return","support"],"sections":[{"id":"quick-answer","order":1,"title":"Direct answers","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"What is the collision priority order for projectile behaviours?","body":["Whenever a projectile collides, it checks its remaining behaviours in this priority: Split, then Pierce, then Fork, then Chain, then Return. Only one behaviour can occur on a single collision, so the first one it still has available wins."]},{"title":"Can a projectile Pierce and Fork or Chain on the same hit?","body":["No. Only one behaviour applies per collision. A projectile that Pierces does not Fork or Chain from that enemy; Fork/Chain from enemies only become possible after Piercing and Forking are exhausted."]},{"title":"Do all projectile skills support all four behaviours?","body":["No. Some skills or items explicitly forbid a behaviour. For example, Lightning Arrow cannot Chain (including from terrain), and Freezing Pulse Pierces all targets so it cannot Fork. Always read the skill tooltip."]},{"title":"Does Return let a projectile hit the same enemy again?","body":["Unlike the other behaviours, Return allows one extra collision per simultaneous set against targets that were already hit. A projectile normally Returns only once."]}]},{"id":"definitions","order":2,"title":"Definitions","type":"overview","visible":true,"toc":true,"paragraphs":["Projectile behaviours are special properties a projectile can carry. They decide what happens when the projectile hits an enemy or an obstacle instead of simply stopping. Four of them are the focus of this guide: Pierce, Fork, Chain, and Return. A fifth, Split, shares the same priority system and is described for completeness.","These behaviours are usually added by support gems (Pierce Support, Fork Support, Chain Support, Returning Projectiles Support) but can also come from a skill's own text, unique items, or passives. They are not all compatible on a single hit — only one resolves per collision."],"bullets":["Projectile: an entity that travels independently until it collides with an enemy, an obstacle, or reaches its travel limit (about 15 metres).","Pierce: the projectile passes through the enemy it hits and continues on its original trajectory. This still counts as a hit.","Fork: the projectile splits into two identical projectiles that travel away from each other at 60 and -60 degrees from the original path.","Chain: the projectile is redirected to another nearby enemy after colliding, up to a number of times.","Return: the projectile travels back toward its origin after reaching the end of its travel.","Split: the projectile splits into several auto-targeting projectiles (highest priority; only once)."]},{"id":"collision-order","order":3,"title":"What happens on a single collision","type":"data-table","visible":true,"toc":true,"caption":"Priority the game uses at each collision. It checks behaviours top to bottom and applies the first one the projectile still has available. Only one line is used per collision.","columns":[{"key":"step","label":"Step"},{"key":"on-collision","label":"On collision"},{"key":"what-happens","label":"What happens"},{"key":"note","label":"Note"}],"filters":[],"rows":[{"tags":["split","priority"],"cells":{"step":"1. Split","on-collision":"Projectile checks whether it can still Split","what-happens":"It splits into auto-targeting projectiles and the collision is consumed","note":"Highest priority; a projectile can only Split once"}},{"tags":["pierce","priority"],"cells":{"step":"2. Pierce","on-collision":"If Split is exhausted, it checks Pierce","what-happens":"Passes through the target and keeps its original trajectory","note":"Counts as a hit; does not change direction or speed; uses one Pierce count"}},{"tags":["fork","priority"],"cells":{"step":"3. Fork","on-collision":"If neither Split nor Pierce applies here, it checks Fork","what-happens":"Splits into two projectiles at 60 and -60 degrees from the path","note":"Only one fork unless Awakened Fork Support; a piercing hit does not fork"}},{"tags":["chain","priority"],"cells":{"step":"4. Chain","on-collision":"If still nothing applied, it checks Chain","what-happens":"Redirects to another enemy within about 6 metres","note":"Applied last among enemy-targeting behaviours; same enemy not hit twice in one Chain"}},{"tags":["return","priority"],"cells":{"step":"5. Return","on-collision":"If nothing else applies, or at end of travel","what-happens":"The projectile heads back toward its origin","note":"Lowest priority; normally once; allows one extra hit on already-hit targets"}}],"note":"This priority is the global rule in Path of Exile 2. Specific skills or unique items can override part of it (for example forcing Fork before Pierce), so never assume a single skill's special case is the universal order."},{"id":"interaction-matrix","order":4,"title":"Behaviour pairing matrix","type":"data-table","visible":true,"toc":true,"caption":"Which behaviours can combine, and how. 'Per collision' means on a single hit; several behaviours can still appear across the projectile's whole journey.","columns":[{"key":"pairing","label":"Pairing"},{"key":"possible","label":"Possible?"},{"key":"result","label":"Result"}],"filters":[],"rows":[{"tags":["pierce","fork"],"cells":{"pairing":"Pierce + Fork","possible":"Not on the same hit","result":"Mutually exclusive per collision. A piercing projectile does not fork on that hit; Fork only happens once Pierce is used up (or never, if it pierces all targets)."}},{"tags":["pierce","chain"],"cells":{"pairing":"Pierce + Chain (from enemy)","possible":"Not on the same hit","result":"A projectile that can Pierce will not chain from enemies. It can chain from terrain after piercing."}},{"tags":["fork","chain"],"cells":{"pairing":"Fork + Chain (from enemy)","possible":"Not on the same hit","result":"Fork consumes the collision. After forked projectiles travel out, they may chain from terrain; enemy-chain follows only once their travel ends."}},{"tags":["fork","return"],"cells":{"pairing":"Fork + Return","possible":"Yes","result":"Forked projectiles can Return toward the origin at the end of their travel."}},{"tags":["pierce","return"],"cells":{"pairing":"Pierce + Return","possible":"Yes","result":"After piercing, the projectile can Return. Some uniques require a pierce condition before Return triggers."}},{"tags":["chain","return"],"cells":{"pairing":"Chain + Return","possible":"Yes","result":"Once the chain ends, Return can trigger and bring the projectile back."}},{"tags":["split"],"cells":{"pairing":"Split + Pierce + Fork + Chain + Return","possible":"Yes (in priority order)","result":"Split has top priority and can be followed by the rest in sequence across the projectile's full path."}}],"note":"Shotgun prevention still applies: when several projectiles are created at once, only one may collide with the same target, so extra copies can pass through without hitting."},{"id":"terrain-vs-enemy","order":5,"title":"Chain from enemy vs chain from terrain","type":"data-table","visible":true,"toc":true,"caption":"Enemy-target Chain and terrain/object Chain are separate systems with different rules. Do not conflate them.","columns":[{"key":"trigger-source","label":"Trigger source"},{"key":"chains-from","label":"Chains from"},{"key":"notes","label":"Notes"}],"filters":[],"rows":[{"tags":["chain","enemy"],"cells":{"trigger-source":"Enemy collision, projectile can Pierce or Fork","chains-from":"Does NOT chain from enemy","notes":"Only one behaviour per collision. If it pierces or forks, the enemy-chain is skipped."}},{"tags":["chain","enemy"],"cells":{"trigger-source":"Enemy collision, no Pierce/Fork left","chains-from":"Chains from enemy","notes":"Redirects to another enemy within about 6 metres; the same enemy is not targeted twice in one Chain."}},{"tags":["chain","terrain"],"cells":{"trigger-source":"Terrain, wall, or obstacle","chains-from":"Chains from terrain","notes":"By default only once unless otherwise stated. Chance to chain from terrain stacks additively. Can occur after piercing or forking an enemy."}},{"tags":["chain","enemy"],"cells":{"trigger-source":"Skill that cannot chain (e.g. Lightning Arrow)","chains-from":"Does NOT chain from terrain either","notes":"Some skills are forbidden from chaining entirely, including off terrain. This was fixed as a bug for Lightning Arrow in patch 0.2.0."}}],"note":"Projectiles have a base chaining distance of about 6 metres; other (non-projectile) effects chain from about 4 metres."},{"id":"worked-examples","order":6,"title":"Worked examples","type":"data-table","visible":true,"toc":true,"caption":"Qualitative cases showing how the priority order and target availability change the outcome. No exact numbers are stated because support values are version-sensitive.","columns":[{"key":"case","label":"Case"},{"key":"setup","label":"Setup"},{"key":"result","label":"Result"}],"filters":[],"rows":[{"tags":["pierce","chain"],"cells":{"case":"Straight line of mobs","setup":"Five enemies in a row; projectile has Pierce and Chain","result":"The projectile Pierces through the line first (Pierce beats Chain). After Pierce is used up with no more enemies in the way, it may chain from terrain or simply end. Chain from enemies does not trigger while it can still Pierce."}},{"tags":["chain","terrain"],"cells":{"case":"Wall bounce","setup":"One enemy near a wall; projectile has % chance to chain from terrain","result":"On hitting the enemy with no Pierce/Fork left, the projectile can chain off the wall to a second enemy. Terrain chain happens at most once by default and its chance is additive."}},{"tags":["return","boss"],"cells":{"case":"Boss, single target","setup":"One boss; projectile has Fork, Chain, and Return","result":"With no other target nearby, Fork and Chain find nothing to redirect to and travel off. Return can add one extra collision against the boss (the only already-hit target), making Return the most useful of the four here."}}],"note":"These are teaching examples of the priority system. Exact Pierce/Chain counts and damage come from the current in-game tooltip."},{"id":"clear-vs-single-target","order":7,"title":"Clear speed vs bossing","type":"diagnostic","visible":true,"toc":true,"intro":"Pick the kind of encounter you are building for. The tool points to the supports that actually help.","controls":[{"id":"encounter","label":"What are you mainly fighting?","options":[{"label":"Mapping and clear speed (many enemies)","value":"clear"},{"label":"Bossing (few or one enemy)","value":"boss"}]}],"rules":[{"title":"Spread damage for clear speed","when":{"encounter":"clear"},"steps":["Use Chain and/or Fork to reach extra enemies that the single projectile would miss.","Add Pierce if enemies are lined up so one shot passes through several.","Remember only one behaviour per collision: Fork or Chain, not both, on a given hit."]},{"title":"Focus the single target","when":{"encounter":"boss"},"steps":["Prefer Pierce plus Return, since Return can add one extra hit on the same boss.","Fork and Chain give little on a lone enemy because they need other targets to redirect to.","If the boss is the only target, most of a Fork/Chain setup is wasted travel."]}],"defaultResult":{"title":"General support choice","steps":["Match the support to the target density you fight most.","Use Fork/Chain for packs, Pierce/Return for single targets.","Check the in-game tooltip for current counts and damage modifiers."]}},{"id":"skill-exceptions","order":8,"title":"Skills and items that forbid behaviours","type":"overview","visible":true,"toc":true,"paragraphs":["Not every projectile skill can use all four behaviours. Some skills or items explicitly forbid one, and the rule is written in the skill or item text. Always read the tooltip before assuming a support will work.","In general, a behaviour is forbidden when the text says the projectile 'cannot Pierce / Fork / Chain / Return', or when the skill already has a built-in behaviour that blocks another (for example a skill that Pierces all targets cannot Fork on a hit it passes through)."],"bullets":["Lightning Arrow: cannot Chain, including off terrain (fixed as a bug in patch 0.2.0).","Freezing Pulse: projectiles Pierce all targets, so they cannot Fork.","Spectral Throw: projectiles Return and behave as piercing, so Fork does not apply on its hits.","Some unique items (for example the Snakepit ring) prevent spell projectiles from Piercing or Chaining depending on the socket.","Ascendancy or passive effects can also grant or remove a behaviour; the tooltip is the source of truth."]},{"id":"troubleshooting","order":9,"title":"Common mistakes","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["Most projectile problems come from misunderstanding the priority order and the single-behaviour-per-collision rule rather than from bad rolls. Watch for these before blaming the game."],"bullets":["Chain 'not triggering': the projectile can also Pierce or Fork, so enemy-chain is skipped; or there is no valid enemy within the chain distance; or the skill cannot chain at all.","Projectile 'disappears': it ran out of behaviours and travelled off. Fork and Chain need a valid secondary target, otherwise the projectile just expires at its travel limit.","Return 'deals no damage': shotgun prevention means a returning projectile gets only one extra collision per set on already-hit targets; other returns pass through without colliding.","Assuming every projectile skill supports all four behaviours — check the tooltip for 'cannot Pierce/Fork/Chain/Return'.","Conflating enemy Chain with terrain Chain — they follow different rules and limits.","Mixing up Fork (two at plus/minus 60 degrees) with Split (auto-targeting copies) and with Projectile Count (more separate projectiles)."]},{"id":"community-cases","order":10,"title":"Common points of confusion","type":"card-grid","visible":true,"toc":true,"intro":"Paraphrased confusions players often raise about projectile behaviours.","cards":[{"title":"Chain feels weak on bosses","tag":"chain","body":["Players expect Chain to add damage to a lone boss, but Chain needs another enemy to redirect to. On a single target it does almost nothing, which is the core point of the referenced video guide."],"link":"https://www.youtube.com/watch?v=t-GpBSwf6kE","linkLabel":"Why Chain Might Be Worse Than You Think"},{"title":"Pierce and Fork together","tag":"pierce","body":["Many assume a gem can both Pierce and Fork on the same hit. Only one behaviour resolves per collision, so a piercing hit does not fork."]},{"title":"Lightning Arrow still chains","tag":"chain","body":["Some players believed Lightning Arrow could chain off terrain. Patch 0.2.0 fixed it so the skill cannot chain at all, including off terrain."]},{"title":"Return hitting the same enemy","tag":"return","body":["Players are surprised a returning projectile hits an already-hit enemy again. Return uniquely allows one extra collision per set on targets already struck."]}]},{"id":"video-guide","order":11,"title":"Video guide","type":"video","visible":true,"toc":true,"entries":[{"label":"PoE 2 - Why Chain Might Be Worse Than You Think [Patch 0.2]","creator":"Last Protagonist","description":"A community breakdown of when Chain helps clear speed and when it wastes value on single targets, plus how projectile supports compare in Path of Exile 2.","takeaway":"Chain shines against packs but adds little to a lone boss; choose Fork/Chain for clearing and Pierce/Return for single targets based on the collision priority order.","url":"https://www.youtube.com/watch?v=t-GpBSwf6kE","timestamps":[{"label":"Introduction","time":"0:00"},{"label":"What Chain actually does","time":"1:30"},{"label":"When Chain helps (clear speed)","time":"4:00"},{"label":"When Chain hurts (single target)","time":"7:00"},{"label":"Projectile support gems compared","time":"10:00"},{"label":"Summary and build advice","time":"13:00"}]}]},{"id":"faq","order":12,"title":"Frequently asked questions","type":"faq","visible":true,"toc":true,"items":[{"question":"Can every projectile skill use Pierce, Fork, Chain, and Return?","answer":["No. Some skills or items explicitly forbid a behaviour. Lightning Arrow cannot Chain (including from terrain), and Freezing Pulse Pierces all targets so it cannot Fork. Read the skill tooltip for 'cannot Pierce/Fork/Chain/Return'."]},{"question":"What is the priority order when a projectile collides?","answer":["The game checks Split, then Pierce, then Fork, then Chain, then Return. Only one of these behaviours occurs on a single collision, so the first one the projectile still has available wins."]},{"question":"Does Chain from enemies work the same as Chain from terrain?","answer":["No. If the projectile can Pierce or Fork, it will not chain from enemies, but it can chain from terrain afterward (and only once by default). Some skills cannot chain from terrain either."]},{"question":"Does Return hit the same enemy again?","answer":["Yes. Unlike the other behaviours, Return allows one extra collision per simultaneous set against targets that were already hit. A projectile normally Returns only once."]},{"question":"What is the base chain distance?","answer":["Projectiles chain from about 6 metres away; other (non-projectile) effects chain from about 4 metres. The same enemy is not targeted twice within one Chain."]},{"question":"Is Fork the same as Split or Projectile Count?","answer":["No. Fork makes two projectiles at 60 and -60 degrees. Split makes several auto-targeting copies. Projectile Count simply fires more separate projectiles. Shotgun prevention still stops multiple simultaneous projectiles from all hitting one target."]}]},{"id":"sources","order":13,"title":"Sources and verification","type":"sources","visible":true,"toc":true,"categories":[{"label":"PoE2 Wiki - Projectile","description":"Collision priority, behaviour definitions, shotgun prevention, and the 15-metre travel limit","url":"https://poe2wiki.net/wiki/Projectile"},{"label":"PoE2 Wiki - Pierce","description":"Pierce behaviour, Pierce count, and interaction with Fork/Chain/Return","url":"https://poe2wiki.net/wiki/Pierce"},{"label":"PoE2 Wiki - Fork","description":"Fork behaviour, the 60/-60 degree split, and fork limits","url":"https://poe2wiki.net/wiki/Fork"},{"label":"PoE2 Wiki - Chain","description":"Chain behaviour, enemy vs terrain chaining, and base chain distance","url":"https://poe2wiki.net/wiki/Chain"},{"label":"PoE2 Wiki - Return","description":"Return behaviour and the extra collision against already-hit targets","url":"https://poe2wiki.net/wiki/Return"},{"label":"Last Protagonist - Why Chain Might Be Worse Than You Think","description":"Community video on when Chain helps or hurts in Path of Exile 2","url":"https://www.youtube.com/watch?v=t-GpBSwf6kE"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":14,"title":"Changelog","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["Initial publication of the projectile Pierce, Fork, Chain, and Return guide for Path of Exile 2 Early Access 0.5.4.","Added direct answers, definitions, collision priority order, behaviour pairing matrix, enemy vs terrain chaining, worked examples, clear vs bossing diagnostic, skill exceptions, troubleshooting, community confusion, video, FAQ, and sources."]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 Wiki - Projectile","url":"https://poe2wiki.net/wiki/Projectile","sourceType":"official"},{"label":"PoE2 Wiki - Pierce","url":"https://poe2wiki.net/wiki/Pierce","sourceType":"official"},{"label":"PoE2 Wiki - Fork","url":"https://poe2wiki.net/wiki/Fork","sourceType":"official"},{"label":"PoE2 Wiki - Chain","url":"https://poe2wiki.net/wiki/Chain","sourceType":"official"},{"label":"PoE2 Wiki - Return","url":"https://poe2wiki.net/wiki/Return","sourceType":"official"},{"label":"Last Protagonist - Why Chain Might Be Worse Than You Think (YouTube)","url":"https://www.youtube.com/watch?v=t-GpBSwf6kE","sourceType":"community"}],"seo":{"title":"PoE 2 Projectile Pierce, Fork, Chain & Return Guide","description":"Learn how Pierce, Fork, Chain, and Return resolve on a single projectile collision in Path of Exile 2, the priority order, enemy vs terrain chaining, and which skills forbid behaviours.","noindex":false}},{"id":"projectile-pierce-fork-chain-return","slug":"projectile-pierce-fork-chain-return","locale":"zh-cn","type":"guide","status":"published","featured":false,"title":"流放之路2 投射物穿透、分裂、连锁与返回机制详解","shortTitle":"投射物行为","summary":"本文讲解流放之路2中单次投射物碰撞时穿透、分裂、连锁与返回的结算顺序，包括优先级、敌人连锁与地形连锁的区别，以及哪些技能禁止某些行为。","description":"一份流放之路2投射物机制指南：碰撞优先级顺序（分裂、穿透、分裂、连锁、返回），敌人连锁与地形连锁的差异，哪些技能无法穿透/分裂/连锁/返回，以及如何为清图与打BOSS选择辅助。","guideCategory":"mechanics","heroImage":"/images/skills/chain-support.webp","cardImage":"/images/skills/chain-support.webp","imageAlt":"流放之路2 辅助宝石图标，代表投射物连锁行为","estimatedReadingMinutes":15,"prerequisites":["了解投射物技能与辅助宝石的基础知识","熟悉游戏内悬浮提示与属性面板"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","projectile","pierce","fork","chain","return","support"],"sections":[{"id":"quick-answer","order":1,"title":"直接回答","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"投射物行为的碰撞优先级顺序是什么？","body":["每当投射物发生碰撞时，会按以下优先级检查剩余行为：分裂、然后穿透、然后分裂（Fork）、然后连锁、然后返回。单次碰撞只会触发一种行为，因此最先仍可使用的那个会生效。"]},{"title":"投射物能在同一次命中时既穿透又分裂或连锁吗？","body":["不能。单次碰撞只会触发一种行为。穿透的投射物不会在该次命中时分裂或连锁；只有穿透与分裂耗尽后，才可能从敌人处连锁。"]},{"title":"所有投射物技能都支持这四种行为吗？","body":["不是。某些技能或物品会明确禁止某行为。例如闪电箭无法连锁（包括从地形），冰霜脉冲会穿透所有目标因此无法分裂。务必阅读技能提示。"]},{"title":"返回会让投射物再次击中同一敌人吗？","body":["与其他行为不同，返回允许在同一组中对已命中的目标额外碰撞一次。投射物通常只返回一次。"]}]},{"id":"definitions","order":2,"title":"定义","type":"overview","visible":true,"toc":true,"paragraphs":["投射物行为是指投射物可能携带的特殊属性。它们决定了投射物击中敌人或障碍物（而不是直接消失）时发生的事。本指南重点关注其中四种：穿透、分裂（Fork）、连锁与返回。第五种“分裂（Split）”共享同一套优先级系统，为完整起见一并说明。","这些行为通常由辅助宝石添加（穿透辅助、分裂辅助、连锁辅助、返回投射物辅助），但也可来自技能自身文本、独特物品或天赋。它们并非在单次命中时全部兼容——每次碰撞只结算一种。"],"bullets":["投射物：独立飞行的实体，直到撞到敌人、障碍物或到达其飞行距离上限（约15米）为止。","穿透：投射物穿过击中的敌人并沿原轨迹继续前进。这仍算作命中。","分裂（Fork）：投射物分裂为两个相同的投射物，沿原路径的正负60度方向飞离。","连锁：投射物在碰撞后重定向到附近另一名敌人，可多次。","返回：投射物在飞行结束后朝其来源方向返回。","分裂（Split）：投射物分裂为多个自动索敌的投射物（优先级最高，仅一次）。"]},{"id":"collision-order","order":3,"title":"单次碰撞时发生了什么","type":"data-table","visible":true,"toc":true,"caption":"游戏在每次碰撞时使用的优先级。自上而下检查行为，并应用投射物仍可用的第一个。每次碰撞只使用其中一行。","columns":[{"key":"step","label":"步骤"},{"key":"on-collision","label":"碰撞时"},{"key":"what-happens","label":"发生什么"},{"key":"note","label":"注意"}],"filters":[],"rows":[{"tags":["split","priority"],"cells":{"step":"1. 分裂（Split）","on-collision":"投射物检查是否仍能分裂","what-happens":"分裂为自动索敌的投射物，碰撞被消耗","note":"优先级最高；投射物只能分裂一次"}},{"tags":["pierce","priority"],"cells":{"step":"2. 穿透","on-collision":"若分裂已耗尽，检查穿透","what-happens":"穿过目标并保留原轨迹","note":"算作命中；不改变方向或速度；消耗一次穿透次数"}},{"tags":["fork","priority"],"cells":{"step":"3. 分裂（Fork）","on-collision":"若分裂与穿透在此都不适用，检查Fork","what-happens":"沿路径的正负60度分裂为两个投射物","note":"仅分裂一次，除非觉醒分裂辅助；穿透的命中不会分裂"}},{"tags":["chain","priority"],"cells":{"step":"4. 连锁","on-collision":"若仍无行为适用，检查连锁","what-happens":"重定向到约6米内的另一名敌人","note":"在敌人目标行为中最后结算；同一连锁中不会重复锁定同一敌人"}},{"tags":["return","priority"],"cells":{"step":"5. 返回","on-collision":"若其他都不适用，或在飞行结束时","what-happens":"投射物朝来源返回","note":"优先级最低；通常一次；允许对已命中目标额外命中一次"}}],"note":"该优先级是流放之路2中的全局规则。特定技能或独特物品可能覆盖其中一部分（例如强制先Fork后穿透），因此切勿把某个技能的特殊情况当作通用顺序。"},{"id":"interaction-matrix","order":4,"title":"行为组合矩阵","type":"data-table","visible":true,"toc":true,"caption":"哪些行为可以组合，以及如何组合。“同一次命中”指单次碰撞；整个飞行过程中仍可出现多种行为。","columns":[{"key":"pairing","label":"组合"},{"key":"possible","label":"可能？"},{"key":"result","label":"结果"}],"filters":[],"rows":[{"tags":["pierce","fork"],"cells":{"pairing":"穿透 + 分裂（Fork）","possible":"同一次命中时不行","result":"单次碰撞时互斥。穿透的投射物不会在该次命中时分裂；只有穿透用尽后才会分裂（若穿透所有目标则永不分裂）。"}},{"tags":["pierce","chain"],"cells":{"pairing":"穿透 + 连锁（敌人）","possible":"同一次命中时不行","result":"能穿透的投射物不会从敌人处连锁。穿透后可从地形连锁。"}},{"tags":["fork","chain"],"cells":{"pairing":"分裂（Fork） + 连锁（敌人）","possible":"同一次命中时不行","result":"分裂消耗了碰撞。分裂后的投射物飞出后可能从地形连锁；敌连锁仅在其飞行结束后才可能出现。"}},{"tags":["fork","return"],"cells":{"pairing":"分裂（Fork） + 返回","possible":"可以","result":"分裂出的投射物在飞行结束时可朝来源返回。"}},{"tags":["pierce","return"],"cells":{"pairing":"穿透 + 返回","possible":"可以","result":"穿透后投射物可返回。某些独特物品要求满足穿透条件后才触发返回。"}},{"tags":["chain","return"],"cells":{"pairing":"连锁 + 返回","possible":"可以","result":"连锁结束后可触发返回，将投射物带回。"}},{"tags":["split"],"cells":{"pairing":"分裂（Split） + 穿透 + Fork + 连锁 + 返回","possible":"可以（按优先级顺序）","result":"分裂优先级最高，之后可在整个飞行路径上依次出现其余行为。"}}],"note":"霰弹（shotgun）防护仍然生效：同时生成的多个投射物中，只有其中一个能与同一目标碰撞，其余会穿过而不命中。"},{"id":"terrain-vs-enemy","order":5,"title":"敌人连锁 vs 地形连锁","type":"data-table","visible":true,"toc":true,"caption":"以敌人为目标的连锁与以地形/物体为目标的连锁是两套不同规则的系统。请勿混淆。","columns":[{"key":"trigger-source","label":"触发来源"},{"key":"chains-from","label":"从何处连锁"},{"key":"notes","label":"注意"}],"filters":[],"rows":[{"tags":["chain","enemy"],"cells":{"trigger-source":"敌人碰撞，且投射物能穿透或分裂","chains-from":"不从敌人处连锁","notes":"每次碰撞只有一种行为。若穿透或分裂，则跳过敌人连锁。"}},{"tags":["chain","enemy"],"cells":{"trigger-source":"敌人碰撞，且已无穿透/分裂","chains-from":"从敌人处连锁","notes":"重定向到约6米内的另一名敌人；同一连锁中不会重复锁定同一敌人。"}},{"tags":["chain","terrain"],"cells":{"trigger-source":"地形、墙壁或障碍物","chains-from":"从地形连锁","notes":"默认最多一次（除非另有说明）。从地形连锁的几率叠加计算。可在穿透或分裂敌人之后发生。"}},{"tags":["chain","enemy"],"cells":{"trigger-source":"无法连锁的技能（例如闪电箭）","chains-from":"也不从地形连锁","notes":"某些技能完全禁止连锁，包括从地形。闪电箭在0.2.0版本将其修复为bug。"}}],"note":"投射物的基础连锁距离约为6米；其他（非投射物）效果的连锁距离约为4米。"},{"id":"worked-examples","order":6,"title":"实例分析","type":"data-table","visible":true,"toc":true,"caption":"定性案例，展示优先级顺序与目标可用性如何改变结果。因辅助数值随版本变化，不给出具体数字。","columns":[{"key":"case","label":"案例"},{"key":"setup","label":"配置"},{"key":"result","label":"结果"}],"filters":[],"rows":[{"tags":["pierce","chain"],"cells":{"case":"直线小怪队列","setup":"一排五名敌人；投射物有穿透与连锁","result":"投射物先穿过队列（穿透优先于连锁）。穿透用尽且前方无更多敌人后，才可能从地形连锁或直接结束。能穿透时不会从敌人处连锁。"}},{"tags":["chain","terrain"],"cells":{"case":"墙壁弹射","setup":"一名敌人靠近墙壁；投射物有从地形连锁的几率","result":"击中敌人且无穿透/分裂后，投射物可借墙壁连锁到第二名敌人。地形连锁默认最多一次，其几率叠加。"}},{"tags":["return","boss"],"cells":{"case":"BOSS，单一目标","setup":"单个BOSS；投射物有分裂、连锁与返回","result":"附近无其他目标时，分裂与连锁找不到可重定向的目标而飞走。返回可对该BOSS额外碰撞一次（唯一已命中目标），因此四种行为中返回在此最有用。"}}],"note":"这些是讲解优先级系统的教学案例。具体穿透/连锁次数与伤害以当前游戏内提示为准。"},{"id":"clear-vs-single-target","order":7,"title":"清图速度 vs 打BOSS","type":"diagnostic","visible":true,"toc":true,"intro":"选择你主要面对的战斗类型。工具会指向真正有用的辅助。","controls":[{"id":"encounter","label":"你主要打什么？","options":[{"label":"刷图与清怪（多敌人）","value":"clear"},{"label":"打BOSS（少或无其他敌人）","value":"boss"}]}],"rules":[{"title":"为清图速度铺开伤害","when":{"encounter":"clear"},"steps":["使用连锁和/或分裂以命中单个投射物会漏掉的额外敌人。","若敌人排成一线，加上穿透让一次射击穿过多个目标。","记住单次碰撞只一种行为：给定命中时是分裂或连锁，而非两者。"]},{"title":"集中对付单一目标","when":{"encounter":"boss"},"steps":["优先穿透加返回，因为返回可对该BOSS额外命中一次。","分裂与连锁在 lone 敌人身上收益很低，因为它们需要其他目标来重定向。","若BOSS是唯一目标，大部分分裂/连锁配置都成了无用的飞行。"]}],"defaultResult":{"title":"通用辅助选择","steps":["让辅助匹配你最常面对的目标密度。","清怪用分裂/连锁，单目标用穿透/返回。","在游戏内提示中核对当前的次数与伤害修正。"]}},{"id":"skill-exceptions","order":8,"title":"禁止某些行为的技能与物品","type":"overview","visible":true,"toc":true,"paragraphs":["并非每个投射物技能都能使用全部四种行为。某些技能或物品会明确禁止其中一种，规则写在技能或物品文本中。在假定某辅助可用前，务必阅读提示。","一般而言，当文本写明投射物“无法穿透/分裂/连锁/返回”，或技能已内置某种会阻止另一种行为的行为（例如穿透所有目标的技能不会对其穿过的命中触发分裂）时，该行为即被禁止。"],"bullets":["闪电箭：无法连锁，包括从地形（在0.2.0版本作为bug修复）。","冰霜脉冲：投射物穿透所有目标，因此无法分裂。","灵体投掷：投射物返回且表现为穿透，因此命中时不适用的分裂。","某些独特物品（例如Snakepit戒指）根据插槽阻止法术投射物穿透或连锁。","升华或天赋效果也可赋予或移除某行为；提示才是最终依据。"]},{"id":"troubleshooting","order":9,"title":"常见错误","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["大多数投射物问题来自对优先级顺序和“每次碰撞仅一种行为”规则的误解，而非运气不好。在归咎于游戏前先留意这些。"],"bullets":["连锁“不触发”：投射物还能穿透或分裂，因此跳过敌人连锁；或连锁距离内没有有效敌人；或技能根本无法连锁。","投射物“消失”：行为耗尽并飞走。分裂与连锁需要有效次级目标，否则投射物在飞行上限处消失。","返回“不造成伤害”：霰弹防护意味着返回的投射物对同一组已命中目标仅能额外碰撞一次；其余返回会穿过而不碰撞。","假定每个投射物技能都支持全部四种行为——检查提示中的“无法穿透/分裂/连锁/返回”。","混淆敌人连锁与地形连锁——二者规则与限制不同。","把分裂（Fork，正负60度两个）与分裂（Split，自动索敌副本）以及投射物数量（更多独立投射物）混为一谈。"]},{"id":"community-cases","order":10,"title":"常见困惑点","type":"card-grid","visible":true,"toc":true,"intro":"玩家常提出的关于投射物行为的困惑（转述）。","cards":[{"title":"连锁在BOSS上感觉很弱","tag":"chain","body":["玩家期望连锁能给 lone BOSS 追加伤害，但连锁需要另一名敌人来重定向。单一目标时它几乎无用，这正是相关视频指南的核心观点。"],"link":"https://www.youtube.com/watch?v=t-GpBSwf6kE","linkLabel":"为什么连锁可能比你想的更差"},{"title":"穿透与分裂同时用","tag":"pierce","body":["许多人以为一颗宝石能在同一次命中既穿透又分裂。每次碰撞只结算一种行为，因此穿透的命中不会分裂。"]},{"title":"闪电箭仍能连锁","tag":"chain","body":["有玩家认为闪电箭可从地形连锁。0.2.0版本将其修复为该技能完全无法连锁，包括从地形。"]},{"title":"返回再次击中同一敌人","tag":"return","body":["玩家惊讶于返回的投射物再次命中已击中的敌人。返回独特地允许在同一组中对已命中目标额外碰撞一次。"]}]},{"id":"video-guide","order":11,"title":"视频指南","type":"video","visible":true,"toc":true,"entries":[{"label":"PoE 2 - 为什么连锁可能比你想的更差 [0.2版本]","creator":"Last Protagonist","description":"社区视频，讲解连锁何时有助于清图、何时在单一目标上浪费价值，以及流放之路2中投射物辅助的对比。","takeaway":"连锁在群怪中表现出色，但在 lone BOSS 上几乎无增益；根据碰撞优先级顺序，清图选分裂/连锁，单目标选穿透/返回。","url":"https://www.youtube.com/watch?v=t-GpBSwf6kE","timestamps":[{"label":"简介","time":"0:00"},{"label":"连锁到底做了什么","time":"1:30"},{"label":"连锁何时有用（清图）","time":"4:00"},{"label":"连锁何时有害（单一目标）","time":"7:00"},{"label":"投射物辅助宝石对比","time":"10:00"},{"label":"总结与配装建议","time":"13:00"}]}]},{"id":"faq","order":12,"title":"常见问题","type":"faq","visible":true,"toc":true,"items":[{"question":"每个投射物技能都能使用穿透、分裂、连锁与返回吗？","answer":["不能。某些技能或物品会明确禁止某行为。闪电箭无法连锁（包括从地形），冰霜脉冲穿透所有目标因此无法分裂。阅读技能提示中的“无法穿透/分裂/连锁/返回”。"]},{"question":"投射物碰撞时的优先级顺序是什么？","answer":["游戏依次检查分裂、穿透、分裂（Fork）、连锁、返回。单次碰撞只会触发其中一种行为，因此投射物仍可用的第一个会生效。"]},{"question":"从敌人的连锁与从地形的连锁一样吗？","answer":["不一样。若投射物能穿透或分裂，则不会从敌人处连锁，但之后可从地形连锁（默认仅一次）。某些技能也无法从地形连锁。"]},{"question":"返回会再次击中同一敌人吗？","answer":["会。与其他行为不同，返回允许在同一组中对已命中目标额外碰撞一次。投射物通常只返回一次。"]},{"question":"基础连锁距离是多少？","answer":["投射物从约6米外连锁；其他（非投射物）效果从约4米外连锁。同一连锁中不会重复锁定同一敌人。"]},{"question":"分裂（Fork）与分裂（Split）或投射物数量相同吗？","answer":["不同。分裂（Fork）产生正负60度的两个投射物。分裂（Split）产生多个自动索敌副本。投射物数量只是发射更多独立投射物。霰弹防护仍会阻止多个同时生成的投射物全部命中一个目标。"]}]},{"id":"sources","order":13,"title":"来源与核验","type":"sources","visible":true,"toc":true,"categories":[{"label":"PoE2 维基 - 投射物","description":"碰撞优先级、行为定义、霰弹防护与15米飞行上限","url":"https://poe2wiki.net/wiki/Projectile"},{"label":"PoE2 维基 - 穿透","description":"穿透行为、穿透次数及其与分裂/连锁/返回的交互","url":"https://poe2wiki.net/wiki/Pierce"},{"label":"PoE2 维基 - 分裂（Fork）","description":"分裂行为、正负60度分裂及分裂限制","url":"https://poe2wiki.net/wiki/Fork"},{"label":"PoE2 维基 - 连锁","description":"连锁行为、敌人连锁与地形连锁的区别及基础连锁距离","url":"https://poe2wiki.net/wiki/Chain"},{"label":"PoE2 维基 - 返回","description":"返回行为及对已命中目标的额外碰撞","url":"https://poe2wiki.net/wiki/Return"},{"label":"Last Protagonist - 为什么连锁可能比你想的更差","description":"社区视频，讲解流放之路2中连锁何时有益或有害","url":"https://www.youtube.com/watch?v=t-GpBSwf6kE"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":14,"title":"更新日志","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["为流放之路2抢先体验0.5.4首发投射物穿透、分裂、连锁与返回指南。","新增直接回答、定义、碰撞优先级顺序、行为组合矩阵、敌人与地形连锁、实例分析、清图与打BOSS诊断、技能例外、常见问题、社区困惑、视频、问答与来源。"]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 维基 - 投射物","url":"https://poe2wiki.net/wiki/Projectile","sourceType":"official"},{"label":"PoE2 维基 - 穿透","url":"https://poe2wiki.net/wiki/Pierce","sourceType":"official"},{"label":"PoE2 维基 - 分裂（Fork）","url":"https://poe2wiki.net/wiki/Fork","sourceType":"official"},{"label":"PoE2 维基 - 连锁","url":"https://poe2wiki.net/wiki/Chain","sourceType":"official"},{"label":"PoE2 维基 - 返回","url":"https://poe2wiki.net/wiki/Return","sourceType":"official"},{"label":"Last Protagonist - 为什么连锁可能比你想的更差（YouTube）","url":"https://www.youtube.com/watch?v=t-GpBSwf6kE","sourceType":"community"}],"seo":{"title":"流放之路2 投射物穿透、分裂、连锁与返回指南","description":"了解流放之路2中单次投射物碰撞时穿透、分裂、连锁与返回的结算方式、优先级顺序、敌人连锁与地形连锁的区别，以及哪些技能禁止某些行为。","noindex":false}},{"id":"power-frenzy-endurance-charges","slug":"power-frenzy-endurance-charges","locale":"en","type":"guide","status":"published","featured":false,"title":"Power, Frenzy, and Endurance Charges in Path of Exile 2","shortTitle":"Charges in PoE 2","summary":"How Power, Frenzy, and Endurance charges work as generatable and consumable combat resources in Path of Exile 2, how they differ from PoE1 passive bonuses, and how to build generation and consumption loops with Combat Frenzy and Resonance.","description":"A mechanics guide to Path of Exile 2 charges: generation, maximum, duration, consumption, the Combat Frenzy setup, the Resonance conversion keystone, and mapping-versus-bossing uptime. Charges are spent resources, not passive stat bonuses.","guideCategory":"mechanics","heroImage":"/images/skills/combat-frenzy.webp","cardImage":"/images/skills/combat-frenzy.webp","imageAlt":"A Path of Exile 2 skill icon representing frenzy charges and charge generation","estimatedReadingMinutes":16,"prerequisites":["Basic understanding of skills, support gems, and the passive skill tree","Familiarity with the character status bar and buff icons","A build that uses or wants to use charges, such as Amazon, Monk, or Warrior"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","charges","power-charge","frenzy-charge","endurance-charge","generation","consumption"],"sections":[{"id":"quick-answer","order":1,"title":"Direct answers","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"What are Power, Frenzy, and Endurance charges in Path of Exile 2?","body":["In PoE2 these three charge types are temporary, stackable resources. You generate them through specific skills, supports, passives, and items, then spend them to empower other abilities. They do NOT grant passive stat bonuses just by being held — this is the major change from Path of Exile 1."]},{"title":"Do charges automatically boost my damage, attack speed, or resistances?","body":["No. In PoE2 a charge is only valuable when consumed by a skill or passive that explicitly interacts with it. Merely holding a charge provides no inherent stat. The value comes entirely from the consuming effect."]},{"title":"How many charges can I hold?","body":["Each charge type has a default maximum (commonly 3 per type) that specific passives, keystones, and items can raise. Maximum, Duration, and how many generate per event are three separate numbers — do not conflate them."]}]},{"id":"three-charge-types","order":2,"title":"The three charge types at a glance","type":"data-table","visible":true,"toc":true,"caption":"Each charge type is a distinct resource with its own generation and consumption partners. Values and exact cooldowns are version-sensitive — confirm specifics in-game.","columns":[{"key":"charge","label":"Charge"},{"key":"generation","label":"Common generation"},{"key":"consumption","label":"Common consumption"},{"key":"fits","label":"Fits skill types"},{"key":"boss-risk","label":"Boss risk"}],"filters":[],"rows":[{"tags":["power-charge","generation"],"cells":{"charge":"Power Charge","generation":"Killing Palm (grants a Power Charge on kill); the Resonance keystone can convert other charge gains into Power Charges; some items and passives add generation","consumption":"Falling Thunder (consumes Power Charges for extra lightning projectiles and more damage per charge spent); Charge Infusion (crit-chance buff when charges are consumed)","fits":"Intelligence and caster-attack builds such as Monk Invoker, plus any skill that explicitly consumes Power Charges","boss-risk":"Generation often depends on kills; single-target bosses give fewer triggers, so uptime can drop"}},{"tags":["frenzy-charge","generation"],"cells":{"charge":"Frenzy Charge","generation":"Combat Frenzy (grants a Frenzy Charge when you apply Freeze, Electrocute, or Pin, on a short cooldown); Cull the Weak; Parry plus Disengage; Sniper's Mark (crit on a marked enemy); Retort; Frenzy-on-Kill modifiers","consumption":"Barrage (extra repetitions per Frenzy Charge consumed); Amazon Infuse Weapon (Lightning Infusion when a Frenzy Charge is consumed); Tumult; Charge Infusion buffs","fits":"Dexterity and attack builds (Ranger, Amazon, Huntress) using skills that consume Frenzy Charges","boss-risk":"Freeze, Electrocute, and Pin are weaker or resisted on many bosses, so generation can stall"}},{"tags":["endurance-charge","generation"],"cells":{"charge":"Endurance Charge","generation":"Magma Barrier (block while the magma buff is active grants an Endurance Charge); Break Endurance support (chance when fully breaking armour); Cranial Impact (gain one when you Heavy Stun a Rare or Unique); Grit notable","consumption":"Infernal Cry (consumes all Endurance Charges to empower attacks and make enemies combust on death); Seismic Cry; Shielding Cry; Rally support; Amazon Infuse Weapon (Fire Infusion); Charge Infusion","fits":"Stren
