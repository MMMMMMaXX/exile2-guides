gth, defensive, and Warrior warcry builds, plus skills that consume Endurance Charges","boss-risk":"Relies on blocking, Heavy Stun, or armour break, which can be inconsistent against fast or unblockable bosses"}}],"note":"Link generation to a consumer of the same charge type. For related mechanics, see the Critical Hit, Recovery, Builds, and Skills guides."},{"id":"generation","order":3,"title":"How charges are generated","type":"overview","visible":true,"toc":true,"paragraphs":["Charge generation in PoE2 comes from three broad buckets: active skills, support gems, and passives or items. A skill like Killing Palm grants a Power Charge whenever it scores a kill. The Combat Frenzy setup grants a Frenzy Charge each time you apply a Freeze, Electrocute, or Pin effect, gated by a short cooldown so you cannot trigger it every frame. Warrior tools such as Magma Barrier grant an Endurance Charge when you block during the buff.","Some passives and keystones add or convert generation. The Resonance keystone, for example, redirects which charge type you gain, letting a build that would generate one type instead gain another. Items with implicit or crafted modifiers, such as Frenzy Charge on Kill, provide generation that scales with how many enemies you defeat."],"bullets":["Active skills: Killing Palm (Power), Magma Barrier (Endurance), Cull the Weak (Frenzy).","Support gems: Combat Frenzy (Frenzy on Freeze, Electrocute, or Pin), Retort (Frenzy when consuming a Parried debuff), Break Endurance (Endurance chance on fully breaking armour).","Marks: Sniper's Mark grants a Frenzy Charge when you critically hit a marked enemy.","Passives and keystones: Grit, Cranial Impact, and Resonance alter maximum and conversion.","Items: implicit or crafted modifiers such as Frenzy Charge on Kill."]},{"id":"duration-maximum","order":4,"title":"Duration, maximum, and generation amount are separate","type":"overview","visible":true,"toc":true,"paragraphs":["Three numbers govern a charge system, and players often blur them. Maximum Charges is the cap you can hold at once. Charge Duration is how long a held charge persists before it expires. Generation amount is how many charges a single event grants. Raising one does not raise the others.","For example, a passive may raise your Maximum Endurance Charges while a separate modifier extends Duration, and a generation skill may grant only one charge per trigger regardless of your maximum. Treat them as independent dials when planning a build."],"bullets":["Maximum Charges: the per-type cap; raised by passives, keystones, and some belt or ring enchants.","Duration: how long a charge survives untended; extended by specific nodes and items.","Generation amount: charges granted per event; often a fixed 1 per qualifying trigger.","Do not assume a higher maximum means faster or automatic generation."]},{"id":"consumption","order":5,"title":"What consuming a charge grants","type":"overview","visible":true,"toc":true,"paragraphs":["The payoff of charges is consumption. In PoE2 you spend charges through skills, supports, or passives that explicitly state they interact with a charge type. The consumed charge empowers the effect rather than passively buffing you.","Examples: Falling Thunder consumes Power Charges to add lightning projectiles and increase damage; Barrage consumes Frenzy Charges to add repetitions to the next bow attack; Infernal Cry consumes all Endurance Charges to empower subsequent attacks and make enemies combust on death. The Amazon's Infuse Weapon triggers elemental infusions when you consume Power, Endurance, or Frenzy Charges. The persistent Charge Infusion skill grants buffs based on your active charges and consumes charges on a timer."],"bullets":["Power spenders: Falling Thunder, Charge Infusion (crit bonus on consume).","Frenzy spenders: Barrage, Amazon Infuse Weapon (Lightning Infusion), Tumult.","Endurance spenders: Infernal Cry, Seismic Cry, Shielding Cry, Rally, Amazon Infuse Weapon (Fire Infusion).","A charge is worthless unless something in your build consumes it."]},{"id":"replacement","order":6,"title":"Charge type conversion and replacement","type":"overview","visible":true,"toc":true,"paragraphs":["PoE2 has a real charge-conversion mechanic: the Resonance keystone. When allocated, it changes which charge type you gain from generation sources — you gain Power Charges instead of Frenzy, Frenzy instead of Endurance, and Endurance instead of Power. This lets a build funnel generation into the single charge type its consumers want.","Outside keystones, individual skills and supports define exactly which charge they grant or consume; there is no automatic universal conversion between charge types. If a skill says it grants or consumes a specific charge, it only ever interacts with that type."],"bullets":["Resonance keystone: redirects generated charge type (Power, Frenzy, Endurance cycling).","Skills and supports are type-specific: a Frenzy consumer never spends Power or Endurance.","No global 'any charge' pool exists; the three types remain distinct resources."]},{"id":"mapping-vs-bossing","order":7,"title":"Mapping versus bossing","type":"data-table","visible":true,"toc":true,"caption":"Charge uptime differs sharply by environment. Do not project mapping uptime onto boss fights.","columns":[{"key":"environment","label":"Environment"},{"key":"generation-ease","label":"Generation ease"},{"key":"consumption-value","label":"Consumption value"},{"key":"notes","label":"Notes"}],"filters":[],"rows":[{"tags":["mapping"],"cells":{"environment":"Mapping and clearing","generation-ease":"High — many kills and frequent status effects (Freeze, Electrocute, Pin) keep charges flowing","consumption-value":"Sustained — spend charges continuously for clear speed and area payoff","notes":"On-kill sources such as Frenzy on Kill shine here; uptime is easy to maintain"}},{"tags":["bossing"],"cells":{"environment":"Bossing and few targets","generation-ease":"Lower — fewer kills, and bosses often resist Freeze, Electrocute, and Pin or cannot be reliably staggered into a guard or stun","consumption-value":"Burst — each consumed charge is high value for single-target damage or defense","notes":"Plan generation around the boss's resistances; do not assume mapping uptime carries over"}}],"note":"Boss uptime must be measured against the boss itself, never inferred from mapping performance."},{"id":"uptime-checklist","order":8,"title":"Charge uptime checklist","type":"diagnostic","visible":true,"toc":true,"intro":"Walk through these checks to see whether charges will actually help your build, and where the loop breaks.","controls":[{"id":"primary-charge","label":"Which charge does your build want?","options":[{"label":"Power","value":"power"},{"label":"Frenzy","value":"frenzy"},{"label":"Endurance","value":"endurance"}]},{"id":"generation","label":"How reliably can you generate it in your content?","options":[{"label":"Reliably (kills or status effects happen often)","value":"reliable"},{"label":"Unreliably (few targets or resists the trigger)","value":"unreliable"}]},{"id":"consumer","label":"Does a skill or passive consume it?","options":[{"label":"Yes, I have a consumer","value":"yes"},{"label":"No consumer yet","value":"no"}]}],"rules":[{"title":"Add a consumer first","when":{"consumer":"no"},"steps":["Charges do nothing if they are never spent.","Add a spender that matches your charge type: Falling Thunder (Power), Barrage (Frenzy), Infernal Cry or Rally (Endurance), or Charge Infusion.","If you cannot fit a consumer, drop the charge plan rather than generating wasted resources."]},{"title":"Fix generation for bosses","when":{"generation":"unreliable"},"steps":["Mapping generation depends on kills and status effects that bosses resist.","Add Sniper's Mark (Frenzy) or defense-based sources such as Magma Barrier and Cranial Impact (Endurance).","Consider the Resonance keystone to redirect generation into the charge your consumers want.","Expect boss uptime to sit well below mapping uptime."]},{"title":"You have a working loop","when":{"consumer":"yes","generation":"reliable"},"steps":["Spend on cooldown so charges do not expire from Duration.","Maintain the generation trigger and watch Maximum so you are not capping early.","Track Duration so a generated charge is spent before it decays."]}],"defaultResult":{"title":"General uptime check","steps":["Confirm your generation trigger fits the content you actually run.","Confirm a consumer of the same charge type exists in your build.","Confirm Duration and Maximum cover your spending pace.","Expect boss uptime to be lower than mapping uptime."]}},{"id":"worked-examples","order":9,"title":"Worked examples","type":"data-table","visible":true,"toc":true,"caption":"Three build archetypes and how each turns generation into consumption. Mechanics only — no fabricated numbers, levels, or prices.","columns":[{"key":"case","label":"Case"},{"key":"class-type","label":"Class or skill type"},{"key":"how-used","label":"How charges are used"}],"filters":[],"rows":[{"tags":["power-charge","monk"],"cells":{"case":"Monk or Invoker-style (Power Charges)","class-type":"Intelligence caster-attack with a quarterstaff","how-used":"Generate Power Charges with Killing Palm on kills; consume them via Falling Thunder for extra lightning projectiles and damage, or via Charge Infusion for a crit bonus."}},{"tags":["frenzy-charge","ranger"],"cells":{"case":"Ranger or Amazon-style (Frenzy Charges)","class-type":"Dexterity attack with a bow or spear","how-used":"Generate Frenzy Charges with Combat Frenzy on Freeze, Electrocute, or Pin, or with Sniper's Mark crits; consume via Barrage for extra repetitions or Amazon Infuse Weapon for Lightning Infusion."}},{"tags":["endurance-charge","warrior"],"cells":{"case":"Warrior-style (Endurance Charges)","class-type":"Strength warcry or melee","how-used":"Generate Endurance Charges via Magma Barrier blocks or Cranial Impact Heavy Stuns; consume via Infernal Cry to empower attacks and combust enemies, or Rally to recover life."}}],"note":"These are teaching examples of the generation-to-consumption loop, not specific gear or level recommendations."},{"id":"troubleshooting","order":10,"title":"Common mistakes","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["Most charge problems come from carrying the PoE1 mental model into PoE2. Watch for these pitfalls before blaming the mechanic."],"bullets":["Assuming charges auto-grant crit, attack speed, or damage reduction just by being held — in PoE2 they do not.","Building generation but no consumer, so charges expire unused.","Conflating Maximum, Duration, and generation amount, then wondering why more maximum did not mean more uptime.","Relying on mapping uptime (many kills, easy status effects) and expecting the same on a boss that resists those triggers.","Forgetting charges expire: a generated charge decays if you do not spend it before Duration ends.","Feeding a consumer of one charge type with a different type because you skipped the Resonance conversion."]},{"id":"community-cases","order":11,"title":"Common points of confusion","type":"card-grid","visible":true,"toc":true,"intro":"Confusions players frequently carry over from Path of Exile 1.","cards":[{"title":"Charges should boost me passively","tag":"poe1-habit","body":["Many players expect held charges to raise crit or attack speed like PoE1. In PoE2 they are spent resources — only a consuming skill gives value."]},{"title":"More maximum means more power","tag":"confusion","body":["Players raise Maximum Charges and expect automatic strength. Maximum, Duration, and per-event generation are separate; a higher cap alone changes nothing."]},{"title":"Boss uptime equals mapping uptime","tag":"uptime","body":["Because mapping floods charges from kills and status effects, players assume bosses do too. Bosses resist those triggers, so plan separate generation."]},{"title":"Any charge works for any skill","tag":"type","body":["Players try to feed a Frenzy consumer with Power Charges. The three types are distinct; only Resonance or a type-specific source changes what you gain."]}]},{"id":"video-guide","order":12,"title":"Video guide","type":"video","visible":true,"toc":true,"entries":[{"label":"Power, Frenzy, Endurance Charges EXPLAINED in Path of Exile 2 + Combat Frenzy","creator":"DrybearGamers","description":"A walkthrough of how the three charge types work as generatable and consumable resources in Path of Exile 2, with a focus on the Combat Frenzy generation setup and how charges differ from PoE1.","takeaway":"Treat charges as a generate-then-spend loop: pick generation that fits your content, pair it with a consumer of the same charge type, and do not expect passive bonuses from holding them.","url":"https://www.youtube.com/watch?v=5KBHxWgU-0s","timestamps":[{"label":"Introduction","time":"0:00"},{"label":"What charges are","time":"1:30"},{"label":"Generating charges","time":"4:15"},{"label":"Frenzy and Combat Frenzy","time":"7:40"},{"label":"Consuming charges","time":"11:20"},{"label":"Uptime and mapping versus bossing","time":"14:05"},{"label":"Summary","time":"17:30"}]}]},{"id":"faq","order":13,"title":"Frequently asked questions","type":"faq","visible":true,"toc":true,"items":[{"question":"Do Power, Frenzy, and Endurance charges give passive bonuses in PoE2?","answer":["No. Unlike PoE1, held charges grant no inherent stats. Their value comes only from skills, supports, and passives that consume them. A charge is a resource, not a standing buff."]},{"question":"What is the default maximum number of charges?","answer":["Each type commonly has a default maximum of 3, raised by specific passives, keystones such as Grit, and items. Maximum, Duration, and per-event generation are independent numbers, so raising one does not raise the others."]},{"question":"How do I generate Frenzy Charges?","answer":["Common routes are Combat Frenzy (on Freeze, Electrocute, or Pin, with a short cooldown), Cull the Weak, Parry plus Disengage, Sniper's Mark (crit on a marked enemy), Retort, and Frenzy-on-Kill modifiers. Exact cooldowns and values are version-sensitive, so confirm them in-game."]},{"question":"What consumes Endurance Charges?","answer":["Warrior warcries such as Infernal Cry (consumes all to empower attacks and combust enemies), Seismic Cry, and Shielding Cry, the Rally support, and Amazon Infuse Weapon (Fire Infusion). The persistent Charge Infusion skill also consumes them on a timer."]},{"question":"What is the Resonance keystone?","answer":["A passive that redirects which charge type you gain: Power instead of Frenzy, Frenzy instead of Endurance, Endurance instead of Power. It lets a build funnel generation into the single charge type its consumers want."]},{"question":"Why do my charges keep disappearing?","answer":["Charges have a Duration and expire if not consumed in time. If you generate faster than you spend, or your consumer is on cooldown, they decay. Ensure a consumer of the same type exists and watch Duration so charges are spent before they lapse."]}]},{"id":"sources","order":14,"title":"Sources and verification","type":"sources","visible":true,"toc":true,"categories":[{"label":"Official wiki - Charges","description":"PoE2 wiki reference for charges, generation, consumption, and the Resonance keystone","url":"https://poe2wiki.net/"},{"label":"Game Rant - Endurance Charges Explained","description":"Community walkthrough of Endurance Charge generation and consumption in Path of Exile 2","url":"https://gamerant.com/path-of-exile-2-how-do-endurance-charges-work-poe2"},{"label":"Video guide (DrybearGamers)","description":"YouTube explanation of Power, Frenzy, and Endurance charges plus Combat Frenzy in Path of Exile 2","url":"https://www.youtube.com/watch?v=5KBHxWgU-0s"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":15,"title":"Changelog","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["Initial publication of the Power, Frenzy, and Endurance charges guide for Path of Exile 2 Early Access 0.5.4.","Added quick answers, the three charge types, generation, duration and maximum, consumption, conversion, mapping versus bossing, uptime checklist, worked examples, common mistakes, community confusion, video, FAQ, and sources."]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 wiki - Charges (official)","url":"https://poe2wiki.net/","sourceType":"official"},{"label":"Game Rant - Endurance Charges Explained (community)","url":"https://gamerant.com/path-of-exile-2-how-do-endurance-charges-work-poe2","sourceType":"community"},{"label":"DrybearGamers - Charges Explained (YouTube)","url":"https://www.youtube.com/watch?v=5KBHxWgU-0s","sourceType":"community"}],"seo":{"title":"PoE 2 Power, Frenzy & Endurance Charges Guide","description":"How charges work in Path of Exile 2: generation, duration, maximum, consumption, Combat Frenzy, and the Resonance conversion — distinct from PoE1 passive bonuses.","noindex":false}},{"id":"power-frenzy-endurance-charges","slug":"power-frenzy-endurance-charges","locale":"zh-cn","type":"guide","status":"published","featured":false,"title":"流放之路2 中的力量、狂怒与坚忍球","shortTitle":"PoE2 中的充能","summary":"本篇讲解流放之路2 中力量、狂怒与坚忍球如何作为可生成、可消耗的战斗资源运作，它们与流放之路1 的被动加成有何不同，以及如何用战斗狂热与共鸣构建生成与消耗循环。","description":"一篇关于流放之路2 充能的机制指南：生成、上限、持续时间、消耗、战斗狂热套路、共鸣转化基石，以及刷图与打 Boss 的覆盖时间。充能是消耗型资源，而非被动属性加成。","guideCategory":"mechanics","heroImage":"/images/skills/combat-frenzy.webp","cardImage":"/images/skills/combat-frenzy.webp","imageAlt":"流放之路2 技能图标，代表狂怒球与充能生成","estimatedReadingMinutes":16,"prerequisites":["对技能、辅助宝石与天赋树有基本了解","熟悉角色状态栏与增益图标","正在使用或希望使用充能的流派，例如亚马逊、武僧或战士"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","charges","power-charge","frenzy-charge","endurance-charge","generation","consumption"],"sections":[{"id":"quick-answer","order":1,"title":"直接回答","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"流放之路2 中的力量、狂怒与坚忍球是什么？","body":["在流放之路2 中，这三种充能类型是临时、可叠加的资源。你通过特定的技能、辅助宝石、天赋与装备生成它们，再消耗它们来强化其他能力。单靠持有它们并不会提供被动属性加成——这是相较流放之路1 的重大改变。"]},{"title":"充能会自动提升我的伤害、攻击速度或抗性吗？","body":["不会。在流放之路2 中，充能只有在被明确与其互动的技能或天赋消耗时才有价值。单靠持有充能本身不提供任何固有属性。价值完全来自消耗它的效果。"]},{"title":"我最多能持有多少个充能？","body":["每种充能都有默认上限（通常每种 3 个），可由特定天赋、基石与装备提升。上限、持续时间和每次事件生成的个数，是三个相互独立的数值——不要混为一谈。"]}]},{"id":"three-charge-types","order":2,"title":"三种充能一览","type":"data-table","visible":true,"toc":true,"caption":"每种充能都是独立的资源，拥有各自的生成与消耗搭档。具体数值与冷却时间会随版本变化，请以游戏内为准。","columns":[{"key":"charge","label":"充能"},{"key":"generation","label":"常见生成"},{"key":"consumption","label":"常见消耗"},{"key":"fits","label":"适合技能类型"},{"key":"boss-risk","label":"打 Boss 风险"}],"filters":[],"rows":[{"tags":["power-charge","generation"],"cells":{"charge":"力量球","generation":"击杀掌（击杀时获得一个力量球）；共鸣基石可将其他充能的生成转化为力量球；部分装备与天赋也会提供生成","consumption":"落雷（消耗力量球获得额外闪电弹射，且每消耗一个球伤害更高）；充能灌注（消耗充能时提供暴击几率加成）","fits":"智力与法术攻击型流派，例如武僧 Invoker，以及任何明确消耗力量球的技能","boss-risk":"生成往往依赖击杀；单体 Boss 触发机会更少，因此覆盖率可能下降"}},{"tags":["frenzy-charge","generation"],"cells":{"charge":"狂怒球","generation":"战斗狂热（施加冰冻、触电或钉住时获得一个狂怒球，有较短冷却）；弱点击杀；招架加脱离；狙击标记（对标记敌人暴击）；反击；击杀获得狂怒球词缀","consumption":"齐射（每消耗一个狂怒球增加额外次数）；亚马逊注入武器（消耗狂怒球时获得闪电灌注）；骚动；充能灌注加成","fits":"敏捷与攻击型流派（游侠、亚马逊、女猎手），使用消耗狂怒球的技能","boss-risk":"冰冻、触电、钉住在许多 Boss 身上更弱或会被抵抗，因此生成可能中断"}},{"tags":["endurance-charge","generation"],"cells":{"charge":"坚忍球","generation":"岩浆壁垒（岩浆增益持续期间格挡可获得一个坚忍球）；破甲辅助（完全破甲时有几率）；颅击（重度眩晕稀有或独特敌人时获得一个）；坚毅天赋","consumption":"地狱呐喊（消耗全部坚忍球强化攻击并使敌人在死亡时燃烧）；震荡呐喊；护盾呐喊；集结辅助；亚马逊注入武器（火焰灌注）；充能灌注","fits":"力量、防御与战士战吼流派，以及消耗坚忍球的技能","boss-risk":"依赖格挡、重度眩晕或破甲，在面对快速或无法被格挡的 Boss 时可能不稳定"}}],"note":"生成要与同类型充能的消耗者对应。相关机制请参阅暴击、恢复、流派与技能指南。"},{"id":"generation","order":3,"title":"充能如何生成","type":"overview","visible":true,"toc":true,"paragraphs":["流放之路2 中的充能生成来自三大类：主动技能、辅助宝石，以及天赋或装备。像击杀掌这样的技能在击杀时给予一个力量球。战斗狂热套路在你施加冰冻、触电或钉住效果时给予一个狂怒球，并受到较短冷却限制，因此无法每帧触发。战士类工具如岩浆壁垒在你格挡时给予一个坚忍球。","部分天赋与基石会增加或转化生成。例如共鸣基石会改变你生成的充能类型，让本应生成某一种充能的流派改为生成另一种。带有内置或制造词缀（如击杀获得狂怒球）的装备，则会随击杀敌人数而提供生成。"],"bullets":["主动技能：击杀掌（力量）、岩浆壁垒（坚忍）、弱点击杀（狂怒）。","辅助宝石：战斗狂热（冰冻、触电或钉住时获得狂怒）、反击（消耗招架减益时获得狂怒）、破甲（完全破甲时有几率获得坚忍）。","标记：狙击标记在你对标记敌人暴击时给予一个狂怒球。","天赋与基石：坚毅、颅击、共鸣会改变上限与转化。","装备：内置或制造词缀，例如击杀获得狂怒球。"]},{"id":"duration-maximum","order":4,"title":"持续时间、上限与生成个数相互独立","type":"overview","visible":true,"toc":true,"paragraphs":["三个数值决定一套充能体系，但玩家常常混淆它们。充能上限是你同时可持有的数量上限。充能持续时间是一个持有中的充能在过期前能维持多久。生成个数是单次事件给予多少个充能。提升其中一个并不会提升其他两个。","例如，某个天赋可能提升你的坚忍球上限，而另一个独立词缀延长持续时间，某个生成技能每次触发可能只给一个充能，与你的上限无关。规划流派时请将它们视为独立的调节旋钮。"],"bullets":["充能上限：每种类型的上限；由天赋、基石以及部分腰带或戒指附魔提升。","持续时间：充能未被照料时能存活多久；由特定节点与装备延长。","生成个数：每次事件给予的充能数；通常每次合格触发固定为 1 个。","不要认为更高的上限意味着更快或自动的生成。"]},{"id":"consumption","order":5,"title":"消耗充能带来什么","type":"overview","visible":true,"toc":true,"paragraphs":["充能的回报在于消耗。在流放之路2 中，你通过明确声明与某类充能互动的技能、辅助或天赋来消耗充能。被消耗的充能强化该效果，而非被动强化你自身。","例如：落雷消耗力量球以获得额外闪电弹射并提升伤害；齐射消耗狂怒球为下一次弓箭攻击增加次数；地狱呐喊消耗全部坚忍球以强化后续攻击并使敌人在死亡时燃烧。亚马逊的注入武器在你消耗力量、坚忍或狂怒球时触发元素灌注。常驻的充能灌注技能会根据你当前的充能提供加成，并按计时消耗充能。"],"bullets":["力量消耗者：落雷、充能灌注（消耗时提供暴击加成）。","狂怒消耗者：齐射、亚马逊注入武器（闪电灌注）、骚动。","坚忍消耗者：地狱呐喊、震荡呐喊、护盾呐喊、集结、亚马逊注入武器（火焰灌注）。","如果没有流派中的某个东西消耗它，充能就毫无价值。"]},{"id":"replacement","order":6,"title":"充能类型转化与替换","type":"overview","visible":true,"toc":true,"paragraphs":["流放之路2 存在真实的充能转化机制：共鸣基石。点出后，它会改变你从生成来源获得的充能类型——你改为获得力量球而非狂怒球、狂怒球而非坚忍球、坚忍球而非力量球。这让流派能将生成集中导向其消耗者所需的那一种充能。","在基石之外，单个技能与辅助会精确定义它们给予或消耗的是哪一种充能；充能类型之间不存在自动的通用转化。如果某个技能声明它给予或消耗某一特定充能，它就只与该类型互动。"],"bullets":["共鸣基石：改变生成的充能类型（力量、狂怒、坚忍循环转化）。","技能与辅助是类型专属的：狂怒消耗者永远不会消耗力量或坚忍球。","不存在通用的“任意充能”池；三种类型仍是彼此独立的资源。"]},{"id":"mapping-vs-bossing","order":7,"title":"刷图与打 Boss 的对比","type":"data-table","visible":true,"toc":true,"caption":"充能覆盖率会因环境而显著不同。不要将刷图覆盖率套用到 Boss 战。","columns":[{"key":"environment","label":"环境"},{"key":"generation-ease","label":"生成难易"},{"key":"consumption-value","label":"消耗价值"},{"key":"notes","label":"说明"}],"filters":[],"rows":[{"tags":["mapping"],"cells":{"environment":"刷图与清怪","generation-ease":"高——大量击杀与频繁的异常状态（冰冻、触电、钉住）让充能持续流动","consumption-value":"持续——持续消耗充能换取清图速度与范围收益","notes":"击杀类来源（如击杀获得狂怒球）在此表现出色；覆盖率很容易维持"}},{"tags":["bossing"],"cells":{"environment":"打 Boss 与少目标","generation-ease":"较低——击杀更少，且 Boss 常抵抗冰冻、触电、钉住，或无法被稳定格挡、眩晕","consumption-value":"爆发——每个被消耗的充能在单体伤害或防御上价值极高","notes":"根据 Boss 的抗性规划生成；不要假设刷图覆盖率能延续到此处"}}],"note":"Boss 覆盖率必须针对该 Boss 本身衡量，绝不能从刷图表现推断。"},{"id":"uptime-checklist","order":8,"title":"充能覆盖率检查表","type":"diagnostic","visible":true,"toc":true,"intro":"逐项检查，判断充能是否真的对你的流派有用，以及循环在哪里中断。","controls":[{"id":"primary-charge","label":"你的流派想要哪种充能？","options":[{"label":"力量","value":"power"},{"label":"狂怒","value":"frenzy"},{"label":"坚忍","value":"endurance"}]},{"id":"generation","label":"在你实际游玩的内容中，生成有多稳定？","options":[{"label":"稳定（击杀或异常状态频繁发生）","value":"reliable"},{"label":"不稳定（目标少或抵抗触发条件）","value":"unreliable"}]},{"id":"consumer","label":"是否有技能或天赋消耗它？","options":[{"label":"有，我有消耗者","value":"yes"},{"label":"还没有消耗者","value":"no"}]}],"rules":[{"title":"先添加消耗者","when":{"consumer":"no"},"steps":["如果充能从不消耗，它就毫无作用。","添加与你的充能类型匹配的消耗者：落雷（力量）、齐射（狂怒）、地狱呐喊或集结（坚忍），或充能灌注。","如果无法放入消耗者，就放弃充能规划，而非生成被浪费的资源。"]},{"title":"针对 Boss 修复生成","when":{"generation":"unreliable"},"steps":["刷图生成依赖击杀与 Boss 会抵抗的异常状态。","添加狙击标记（狂怒）或基于防御的来源，例如岩浆壁垒与颅击（坚忍）。","考虑共鸣基石，将生成导向你的消耗者所需的充能。","预期 Boss 覆盖率会明显低于刷图覆盖率。"]},{"title":"你已拥有可用的循环","when":{"consumer":"yes","generation":"reliable"},"steps":["在冷却就绪时持续消耗，避免充能因持续时间而过期。","维持生成触发条件，并注意上限，避免过早触顶。","关注持续时间，确保生成的充能在衰减前被消耗。"]}],"defaultResult":{"title":"通用覆盖率检查","steps":["确认你的生成触发条件适配你实际游玩的内容。","确认流派中存在同类型充能的消耗者。","确认持续时间与上限覆盖你的消耗节奏。","预期 Boss 覆盖率低于刷图覆盖率。"]}},{"id":"worked-examples","order":9,"title":"实例讲解","type":"data-table","visible":true,"toc":true,"caption":"三个流派原型，以及各自如何将生成转化为消耗。仅讲机制——不含虚构的数值、等级或价格。","columns":[{"key":"case","label":"情形"},{"key":"class-type","label":"职业或技能类型"},{"key":"how-used","label":"充能如何被使用"}],"filters":[],"rows":[{"tags":["power-charge","monk"],"cells":{"case":"武僧或 Invoker 型（力量球）","class-type":"使用长杖的智力法术攻击","how-used":"用击杀掌在击杀时生成力量球；通过落雷消耗以获得额外闪电弹射与伤害，或通过充能灌注获得暴击加成。"}},{"tags":["frenzy-charge","ranger"],"cells":{"case":"游侠或亚马逊型（狂怒球）","class-type":"使用弓或长矛的敏捷攻击","how-used":"用战斗狂热在冰冻、触电或钉住时生成狂怒球，或用狙击标记暴击生成；通过齐射消耗以获得额外次数，或通过亚马逊注入武器获得闪电灌注。"}},{"tags":["endurance-charge","warrior"],"cells":{"case":"战士型（坚忍球）","class-type":"力量战吼或近战","how-used":"通过岩浆壁垒格挡或颅击重度眩晕生成坚忍球；通过地狱呐喊消耗以强化攻击并使敌人燃烧，或通过集结恢复生命。"}}],"note":"这些是用于讲解“生成到消耗”循环的教学示例，并非具体的装备或等级建议。"},{"id":"troubleshooting","order":10,"title":"常见错误","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["大多数充能问题源于把流放之路1 的心智模型带进了流放之路2。在归咎于机制之前，先注意这些陷阱。"],"bullets":["认为单靠持有充能就会自动提供暴击、攻击速度或减伤——在流放之路2 中并不会。","只搭了生成却没有消耗者，导致充能未使用就过期。","混淆上限、持续时间与生成个数，然后奇怪为何更高的上限没有带来更高覆盖率。","依赖刷图覆盖率（大量击杀、易触发的异常状态），却期望在抵抗这些触发条件的 Boss 身上也一样。","忘记充能会过期：如果不在持续时间结束前消耗，生成的充能就会衰减。","因为跳过了共鸣转化，把某一类型的消耗者喂给了另一种充能。"]},{"id":"community-cases","order":11,"title":"常见困惑点","type":"card-grid","visible":true,"toc":true,"intro":"玩家常从流放之路1 带过来的困惑。","cards":[{"title":"充能应该被动强化我","tag":"poe1-habit","body":["许多玩家期望持有的充能像流放之路1 那样提升暴击或攻击速度。在流放之路2 中它们是消耗型资源——只有消耗它的技能才有价值。"]},{"title":"更高的上限意味着更强","tag":"confusion","body":["玩家提升充能上限并期望自动变强。上限、持续时间和每次生成个数是独立的；光是更高的上限本身不会改变任何事。"]},{"title":"Boss 覆盖率等于刷图覆盖率","tag":"uptime","body":["因为刷图通过击杀与异常状态大量涌出充能，玩家便以为 Boss 也一样。Boss 会抵抗这些触发条件，因此需要单独规划生成。"]},{"title":"任意充能都适用于任意技能","tag":"type","body":["玩家试图用力量球喂给狂怒消耗者。三种类型彼此独立；只有共鸣或类型专属来源才会改变你获得的充能。"]}]},{"id":"video-guide","order":12,"title":"视频指南","type":"video","visible":true,"toc":true,"entries":[{"label":"流放之路2 力量、狂怒、坚忍球详解 + 战斗狂热","creator":"DrybearGamers","description":"讲解流放之路2 中三种充能类型如何作为可生成、可消耗的资源运作，重点介绍战斗狂热生成套路，以及充能与流放之路1 的不同。","takeaway":"将充能视为“先生成再消耗”的循环：选择适配你内容的生成方式，将其与同类型充能的消耗者配对，且不要期望持有它们会带来被动加成。","url":"https://www.youtube.com/watch?v=5KBHxWgU-0s","timestamps":[{"label":"简介","time":"0:00"},{"label":"充能是什么","time":"1:30"},{"label":"生成充能","time":"4:15"},{"label":"狂怒与战斗狂热","time":"7:40"},{"label":"消耗充能","time":"11:20"},{"label":"覆盖率与刷图对比打 Boss","time":"14:05"},{"label":"总结","time":"17:30"}]}]},{"id":"faq","order":13,"title":"常见问题","type":"faq","visible":true,"toc":true,"items":[{"question":"流放之路2 中力量、狂怒与坚忍球会提供被动加成吗？","answer":["不会。与流放之路1 不同，持有的充能不提供任何固有属性。它们的价值只来自消耗它们的技能、辅助与天赋。充能是资源，而非常驻增益。"]},{"question":"充能的默认上限是多少？","answer":["每种类型通常默认上限为 3，可由特定天赋、基石（如坚毅）与装备提升。上限、持续时间与每次生成个数是独立数值，因此提升其中一个并不会提升其他两个。"]},{"question":"我该如何生成狂怒球？","answer":["常见途径有：战斗狂热（冰冻、触电或钉住时触发，有较短冷却）、弱点击杀、招架加脱离、狙击标记（对标记敌人暴击）、反击，以及击杀获得狂怒球词缀。具体冷却时间与数值会随版本变化，请以游戏内为准。"]},{"question":"什么会消耗坚忍球？","answer":["战士战吼如地狱呐喊（消耗全部以强化攻击并使敌人燃烧）、震荡呐喊与护盾呐喊，集结辅助，以及亚马逊注入武器（火焰灌注）。常驻的充能灌注技能也会按计时消耗它们。"]},{"question":"共鸣基石是什么？","answer":["一个改变你获得充能类型的被动：获得力量球而非狂怒球、狂怒球而非坚忍球、坚忍球而非力量球。它让流派能将生成集中导向其消耗者所需的那一种充能。"]},{"question":"为什么我的充能一直消失？","answer":["充能有持续时间，若未及时消耗就会过期。如果你生成快于消耗，或消耗者处于冷却中，它们就会衰减。请确保存在同类型的消耗者，并关注持续时间，以便在充能失效前将其消耗。"]}]},{"id":"sources","order":14,"title":"来源与验证","type":"sources","visible":true,"toc":true,"categories":[{"label":"官方维基 - 充能","description":"流放之路2 维基关于充能、生成、消耗与共鸣基石的参考","url":"https://poe2wiki.net/"},{"label":"Game Rant - 坚忍球详解","description":"关于流放之路2 中坚忍球生成与消耗的社区讲解","url":"https://gamerant.com/path-of-exile-2-how-do-endurance-charges-work-poe2"},{"label":"视频指南（DrybearGamers）","description":"YouTube 上对流放之路2 力量、狂怒、坚忍球及战斗狂热的讲解","url":"https://www.youtube.com/watch?v=5KBHxWgU-0s"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":15,"title":"更新日志","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["首次发布面向流放之路2 抢先体验 0.5.4 的力量、狂怒与坚忍球指南。","新增直接回答、三种充能类型、生成、持续时间与上限、消耗、转化、刷图对比打 Boss、覆盖率检查表、实例讲解、常见错误、常见困惑、视频、常见问题与来源。"]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 维基 - 充能（官方）","url":"https://poe2wiki.net/","sourceType":"official"},{"label":"Game Rant - 坚忍球详解（社区）","url":"https://gamerant.com/path-of-exile-2-how-do-endurance-charges-work-poe2","sourceType":"community"},{"label":"DrybearGamers - 充能详解（YouTube）","url":"https://www.youtube.com/watch?v=5KBHxWgU-0s","sourceType":"community"}],"seo":{"title":"流放之路2 力量、狂怒与坚忍球指南","description":"流放之路2 中充能如何运作：生成、上限、持续时间、消耗、战斗狂热，以及共鸣转化——与流放之路1 的被动加成截然不同。","noindex":false}}];
function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function img(p){ if(!p) return ""; if(typeof IMG_MAP!=='undefined'&&IMG_MAP[p]) return IMG_MAP[p]; if(p.startsWith("/images/")) return "app/assets/images/"+p.slice("/images/".length); return p; }
function P(arr){ return '<div class="paras">'+(Array.isArray(arr)?arr:[]).map(t=>'<p>'+esc(t)+'</p>').join('')+'</div>'; }
function B(arr){ return (Array.isArray(arr)&&arr.length)?'<ul class="bul">'+arr.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':''; }
function ytId(url){ const m=(url||'').match(/[?&]v=([^&]+)/); return m?m[1]:null; }

function renderSection(s){
  switch(s.type){
    case "overview":
      return P(s.paragraphs)+B(s.bullets);
    case "quick-answer":
      return '<div class="qa-grid">'+(s.items||[]).map(it=>'<div class="qa"><h4>'+esc(it.title)+'</h4>'+P(it.body)+'</div>').join('')+'</div>';
    case "data-table":
      return (s.caption?'<p class="note">'+esc(s.caption)+'</p>':'')+
        '<table><thead><tr>'+(s.columns||[]).map(c=>'<th>'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>'+
        (s.rows||[]).map(r=>'<tr>'+(s.columns||[]).map(c=>'<td>'+esc((r.cells&&r.cells[c.key])||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+
        (s.note?'<p class="note">'+esc(s.note)+'</p>':'');
    case "diagnostic":
      var html='<p class="note">'+esc(s.intro||'')+'</p>';
      html+='<p class="note">Controls: '+((s.controls||[]).map(c=>esc(c.label)).join(' · '))+'</p>';
      html+=(s.rules||[]).map(r=>{
        var when=Object.keys(r.when||{}).map(k=>k+' = '+(r.when[k]||'')).join(', ');
        return '<div class="rule"><div class="when">IF '+esc(when)+'</div><h4>'+esc(r.title)+'</h4><ol>'+(r.steps||[]).map(st=>'<li>'+esc(st)+'</li>').join('')+'</ol></div>';
      }).join('');
      if(s.defaultResult){ html+='<div class="rule"><div class="when">DEFAULT</div><h4>'+esc(s.defaultResult.title)+'</h4><ol>'+(s.defaultResult.steps||[]).map(st=>'<li>'+esc(st)+'</li>').join('')+'</ol></div>'; }
      return html;
    case "common-mistakes":
      return '<div class="mistakes">'+P(s.paragraphs)+B(s.bullets)+'</div>';
    case "card-grid":
      return (s.intro?'<p class="note">'+esc(s.intro)+'</p>':'')+
        '<div class="cards">'+(s.cards||[]).map(c=>'<div class="card"><h4>'+esc(c.title)+'</h4>'+P(c.body)+'<div class="tag">'+esc(c.tag||'')+'</div></div>').join('')+'</div>';
    case "video":
      return (s.entries||[]).map(e=>{
        const id=ytId(e.url);
        const embed=id?('https://www.youtube.com/embed/'+id):e.url;
        return '<div class="vid"><h4>'+esc(e.label||'Video')+'</h4>'+(embed?'<iframe src="'+esc(embed)+'" loading="lazy" allowfullscreen></iframe>':'')+
          (e.description?'<p>'+esc(e.description)+'</p>':'')+
          (e.takeaway?'<p class="note"><b>Takeaway:</b> '+esc(e.takeaway)+'</p>':'')+
          '<div class="tag">'+esc(e.creator||'')+'</div>'+
          (e.timestamps&&e.timestamps.length?'<div class="ts">'+e.timestamps.map(t=>esc(t.time)+' '+esc(t.label)).join(' · ')+'</div>':'')+'</div>';
      }).join('');
    case "faq":
      return (s.items||[]).map(f=>'<div class="qa"><h4>'+esc(f.question)+'</h4>'+P(f.answer)+'</div>').join('');
    case "sources":
      return '<div class="src"><ul>'+(s.categories||[]).map(c=>'<li><b>'+esc(c.label)+'</b> — '+esc(c.description||'')+' <br><a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.url)+'</a></li>').join('')+'</ul>'+
        (s.verificationChecklist?'<div class="verify">✓ Verification: '+esc(s.verificationChecklist.status)+(s.verificationChecklist.verifiedClientVersion?' @ '+esc(s.verificationChecklist.verifiedClientVersion):'')+'</div>':'');
    case "changelog":
      return (s.entries||[]).map(e=>'<div class="chg"><b>'+esc(e.date)+'</b><ul>'+((e.changes||[]).map(c=>'<li>'+esc(c)+'</li>').join(''))+'</ul></div>').join('');
    default:
      return '<p class="note">[unrendered section: '+esc(s.type)+']</p>';
  }
}

function renderArticle(a){
  const cats=(a.tags||[]).join(', ');
  const blocks=(a.sections||[]).map(s=>'<section class="blk"><h2>'+esc(s.title||s.type)+'</h2>'+renderSection(s)+'</section>').join('');
  const prereq=(a.prerequisites&&a.prerequisites.length)?'<div class="prereq"><b>Prerequisites:</b><ul class="bul">'+a.prerequisites.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>':'';
  const tags=(a.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('');
  return '<article class="guide" data-locale="'+esc(a.locale)+'">'+
    '<h1>'+esc(a.title)+'</h1>'+
    '<div class="meta">'+
      '<span class="pill">'+esc(a.guideCategory||'guide')+'</span>'+
      '<span class="pill">'+esc(a.patch||'')+'</span>'+
      '<span class="pill">'+esc(a.patchStatus||'')+'</span>'+
      '<span class="pill">'+esc(a.verificationStatus||'')+'</span>'+
      '<span class="pill">'+esc(a.locale)+'</span>'+
      (a.estimatedReadingMinutes?'<span class="pill">'+esc(a.estimatedReadingMinutes)+' min</span>':'')+
    '</div>'+
    (a.heroImage?'<img class="hero" src="'+esc(img(a.heroImage))+'" alt="'+esc(a.imageAlt||'')+'">':'')+
    '<p class="summary">'+esc(a.summary)+'</p>'+
    prereq+
    '<div class="tagrow">'+tags+'</div>'+
    blocks+
    '</article>';
}

function build(){
  const nav=document.getElementById('nav');
  const main=document.getElementById('main');
  nav.innerHTML='<h3>Articles ('+ARTICLES.length+')</h3><ul>'+
    ARTICLES.map((a,i)=>'<li><a href="#a'+i+'" data-locale="'+a.locale+'">'+esc(a.shortTitle||a.slug)+'<span class="badge">'+a.locale+'</span></a></li>').join('')+'</ul>';
  main.innerHTML=ARTICLES.map((a,i)=>'<div id="a'+i+'">'+renderArticle(a)+'</div>').join('')+
    '<div class="footnote">Standalone preview — content sourced from content/{en,zh-cn}/guides/*.json (fifth batch). Not the production build (repo-wide build is blocked by parallel content-agent WIP: 24 missing-related-content issues in items/).</div>';
}

function applyLang(l){
  document.querySelectorAll('[data-locale]').forEach(el=>{
    const show=(l==='all'||el.getAttribute('data-locale')===l);
    el.style.display=show?'':'none';
  });
}

document.querySelectorAll('.langbar button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.langbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    applyLang(btn.getAttribute('data-l'));
  });
});

build();
</script>
