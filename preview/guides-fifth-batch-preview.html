  :root{ --bg:#0d1117; --panel:#161b22; --ink:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --border:#30363d; --card:#1c2230; --good:#3fb950; --warn:#d29922; --bad:#f85149; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:22px 32px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{margin:0 0 4px;font-size:21px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .langbar{margin-top:10px;display:flex;gap:8px}
  .langbar button{cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:13px}
  .langbar button.active{background:var(--accent);color:#08111f;border-color:var(--accent);font-weight:700}
  .layout{display:flex;align-items:flex-start}
  nav{width:300px;flex:0 0 300px;position:sticky;top:96px;height:calc(100vh - 96px);overflow:auto;padding:16px 12px;border-right:1px solid var(--border);background:var(--panel)}
  nav h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 6px}
  nav ul{list-style:none;margin:0;padding:0}
  nav a{display:block;padding:5px 8px;color:var(--accent);text-decoration:none;font-size:12.5px;border-radius:5px}
  nav a:hover{background:var(--card);text-decoration:underline}
  nav .badge{font-size:10px;padding:1px 6px;border-radius:10px;margin-left:6px;background:var(--card);color:var(--muted);border:1px solid var(--border)}
  main{flex:1;padding:24px 40px;max-width:980px}
  .guide{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:22px 28px;margin:0 0 30px;scroll-margin-top:16px}
  .guide h1{font-size:25px;margin:0 0 4px}
  .guide .meta{color:var(--muted);font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
  .guide .meta .pill{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:2px 10px}
  .hero{width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin:6px 0 16px;border:1px solid var(--border)}
  .summary{font-size:15.5px;color:#c9d4e0}
  .prereq{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13.5px}
  .prereq b{color:var(--accent)}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .tagrow span{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:11.5px;color:var(--muted)}
  section.blk{border-top:1px solid var(--border);margin-top:18px;padding-top:14px}
  section.blk h2{font-size:18px;margin:0 0 10px;color:#fff}
  .paras p{margin:0 0 10px}
  ul.bul{margin:6px 0 0;padding-left:20px} ul.bul li{margin:3px 0}
  table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13.5px}
  th,td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:var(--panel);color:var(--ink)}
  .note{font-size:12.5px;color:var(--muted);margin-top:8px;font-style:italic}
  .qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .qa{border:1px solid var(--border);border-radius:10px;padding:12px 16px;background:var(--panel)}
  .qa h4{margin:0 0 6px;font-size:14.5px;color:var(--accent)}
  .mistakes{background:#2a1414;border:1px solid #5a2020;border-radius:10px;padding:12px 16px}
  .mistakes ul.bul li{color:#ffd7d7}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .card h4{margin:0 0 6px;font-size:14.5px;color:var(--accent)}
  .card .tag{font-size:11px;color:var(--muted)}
  .diag .rule{border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:10px 0;background:var(--panel)}
  .diag .rule .when{font-size:12px;color:var(--warn);margin-bottom:6px}
  .diag .rule ol{margin:4px 0 0;padding-left:20px}
  .vid{border:1px solid var(--border);border-radius:10px;padding:12px 16px;background:var(--panel)}
  .vid iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
  .ts{font-size:12px;color:var(--muted);margin-top:6px}
  .src a{color:var(--accent)}
  .verify{font-size:12.5px;color:var(--good);margin-top:8px}
  .chg{font-size:13px}
  .chg li{margin:3px 0}
  .footnote{color:var(--muted);font-size:12px;margin-top:30px;border-top:1px solid var(--border);padding-top:14px}
</style>

const ARTICLES = [{"id":"attack-spell-hit-damage-over-time-tags","slug":"attack-spell-hit-damage-over-time-tags","locale":"en","type":"guide","status":"published","featured":false,"title":"Attack, Spell, Hit, and Damage over Time Tags in Path of Exile 2","shortTitle":"Attack vs Spell vs Hit vs DoT","summary":"Clear up the four most confused skill concepts in Path of Exile 2: Attack, Spell, Hit, and Damage over Time. Learn which modifiers apply to which skills and how behaviour tags work.","description":"A concise Path of Exile 2 mechanics guide explaining the difference between Attack and Spell (skill category), Hit and Damage over Time (damage form), and behaviour tags such as Projectile, AoE, Melee, Duration, Minion, and Totem. Includes a modifier-compatibility diagnostic and worked examples.","guideCategory":"mechanics","heroImage":"/images/skills/lightning-arrow.webp","cardImage":"/images/skills/lightning-arrow.webp","imageAlt":"A Path of Exile 2 skill icon illustrating the difference between attack, spell, hit and damage over time skill tags","estimatedReadingMinutes":16,"prerequisites":["Basic understanding of the Path of Exile 2 skill gem and support gem system","Familiarity with reading a skill tooltip and its listed tags","Awareness that damage has types (Physical, Fire, Cold, Lightning, Chaos)"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","attack","spell","hit","damage-over-time","skill-tags","tags"],"sections":[{"id":"quick-answer","order":1,"title":"Direct answers","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"What is an Attack?","body":["An Attack is a skill that directly uses your equipped weapon to damage enemies. Attacks can deal any damage type and usually roll a hit against the target's evasion using your Accuracy."]},{"title":"What is a Spell?","body":["A Spell is a skill that uses raw magic rather than a weapon. Spells are not Attacks, they ignore Accuracy and evasion, and their base damage and critical chance come from the skill itself."]},{"title":"What is a Hit?","body":["A Hit is a single, discrete instance of damage dealt at a moment in time. Most Attacks and Spells deal damage as Hits, and Hits can crit, leech, and trigger on-hit effects."]},{"title":"What is Damage over Time?","body":["Damage over Time (DoT) is damage applied gradually across a duration instead of all at once. DoT is not a Hit, so it normally cannot crit, leech, or trigger on-hit effects the way a Hit does."]}]},{"id":"terminology","order":2,"title":"Key terms","type":"overview","visible":true,"toc":true,"paragraphs":["Four different concepts get tangled together when players talk about 'tags'. They answer different questions and are mostly independent of one another.","Skill Type (Attack vs Spell) answers how the skill is delivered. Damage Type (Physical, Fire, Cold, Lightning, Chaos) answers what element or form the damage is. Hit Type answers whether the damage arrives as a single Hit or as Damage over Time. Behaviour Tags (Projectile, AoE, Melee, Duration, Minion, Totem) answer how the skill is delivered or who owns it. None of these four layers determines another by itself."],"bullets":["Skill Type: Attack (uses a weapon) or Spell (uses magic). This is the skill's category.","Damage Type: Physical, Fire, Cold, Lightning, or Chaos. Any skill type can deal any damage type.","Hit Type: a Hit (instant) or Damage over Time (gradual). Ailments such as Ignite and Poison are forms of DoT.","Behaviour Tag: Projectile, AoE, Melee, Duration, Minion, Totem. These describe delivery and ownership, not damage type."]},{"id":"relationship-map","order":3,"title":"Skill category relationship map","type":"data-table","visible":true,"toc":true,"caption":"How the Attack and Spell categories relate to damage type, accuracy, and hit status. Skill type and damage type are orthogonal.","columns":[{"key":"skill-category","label":"Skill category"},{"key":"deals-physical","label":"Deals Physical?"},{"key":"deals-elemental","label":"Deals Elemental?"},{"key":"deals-chaos","label":"Deals Chaos?"},{"key":"requires-accuracy","label":"Requires Accuracy?"},{"key":"is-a-hit","label":"Is a Hit?"}],"filters":[],"rows":[{"tags":["attack"],"cells":{"skill-category":"Attack","deals-physical":"Sometimes - can deal any type","deals-elemental":"Sometimes - can deal any type","deals-chaos":"Sometimes - can deal any type","requires-accuracy":"Yes - rolls against evasion","is-a-hit":"Usually yes, per instance"}},{"tags":["spell"],"cells":{"skill-category":"Spell","deals-physical":"Sometimes - can deal any type","deals-elemental":"Sometimes - can deal any type","deals-chaos":"Sometimes - can deal any type","requires-accuracy":"No - ignores accuracy and evasion","is-a-hit":"Usually yes, per instance"}}],"note":"A Spell can deal Fire, Cold, Lightning, or Chaos; an Attack can deal Fire (for example with a converted or elemental weapon). The category never fixes the damage type."},{"id":"hit-vs-dot","order":4,"title":"Hit vs Damage over Time","type":"data-table","visible":true,"toc":true,"caption":"How different damage forms behave in Path of Exile 2. Based on the PoE2 wiki: Damage over Time is not a Hit, so it is unaffected by penetration, and resistances still mitigate it.","columns":[{"key":"damage-form","label":"Damage form"},{"key":"is-a-hit","label":"Is a Hit?"},{"key":"can-crit","label":"Can Crit?"},{"key":"can-leech","label":"Can Leech?"},{"key":"affected-by-penetration","label":"Affected by Penetration?"},{"key":"triggers-on-hit","label":"Triggers On-Hit?"}],"filters":[],"rows":[{"tags":["hit"],"cells":{"damage-form":"Hit","is-a-hit":"Yes","can-crit":"Yes","can-leech":"Yes (per recovery mechanics in 0.5.4, pending PC verification)","affected-by-penetration":"Yes","triggers-on-hit":"Yes"}},{"tags":["ailment"],"cells":{"damage-form":"Ailment (Ignite, Bleed, Poison)","is-a-hit":"No","can-crit":"No - ailments do not crit by default","can-leech":"No (pending PC verification)","affected-by-penetration":"No","triggers-on-hit":"No"}},{"tags":["ground-effect"],"cells":{"damage-form":"Ground Effect","is-a-hit":"No","can-crit":"No","can-leech":"No","affected-by-penetration":"No","triggers-on-hit":"No"}},{"tags":["damage-over-time"],"cells":{"damage-form":"Damage over Time (non-ailment)","is-a-hit":"No","can-crit":"No","can-leech":"No (pending PC verification)","affected-by-penetration":"No - penetration only applies to hits","triggers-on-hit":"No"}}],"note":"Resistances in the matching damage type still mitigate DoT, but armour and penetration do not, because those only apply to Hits. Recovery (Leech) behaviour is version-sensitive in 0.5.4 and flagged for PC confirmation."},{"id":"tags","order":5,"title":"What behaviour tags do and do not imply","type":"overview","visible":true,"toc":true,"paragraphs":["Behaviour tags describe how a skill is delivered or who owns it. They are separate from both Skill Type and Damage Type. A tag such as Projectile tells you the skill fires a projectile; it does not tell you whether the skill is an Attack or a Spell, nor what damage type it deals.","The same is true for AoE, Melee, Duration, Minion, and Totem. A Minion skill is cast by your minion, a Totem skill is cast by a totem you place, and a Duration skill persists for a time - none of these fix the damage type or the Attack/Spell category."],"bullets":["Projectile: the skill travels as a projectile. It can be an Attack (Bow shot) or a Spell (a spell projectile).","AoE: deals damage in an area. Applies to both Attacks and Spells.","Melee: delivered at close range. Almost always an Attack, but the tag alone does not set the damage type.","Duration: the effect lasts for a duration (for example a ground effect or aura). Not a Hit by itself.","Minion / Totem: describe ownership of the skill, not its damage type. Support-gem compatibility still depends on the underlying skill tags."]},{"id":"modifier-compatibility","order":6,"title":"Modifier compatibility diagnostic","type":"diagnostic","visible":true,"toc":true,"intro":"Use this to check whether a damage modifier or support gem will apply to your skill. Pick your skill type, then the modifier scope.","controls":[{"id":"skill-type","label":"What is your skill's category?","options":[{"label":"Attack","value":"attack"},{"label":"Spell","value":"spell"}]},{"id":"modifier-type","label":"What does the modifier or support say?","options":[{"label":"Attack Damage","value":"attack-damage"},{"label":"Spell Damage","value":"spell-damage"},{"label":"Projectile Damage","value":"projectile-damage"},{"label":"Generic Damage / Elemental Damage","value":"generic"}]}],"rules":[{"title":"Attack Damage applies","when":{"skill-type":"attack","modifier-type":"attack-damage"},"steps":["The modifier or support targets Attack Damage.","Your skill is an Attack, so it receives the bonus."]},{"title":"Spell Damage applies","when":{"skill-type":"spell","modifier-type":"spell-damage"},"steps":["The modifier or support targets Spell Damage.","Your skill is a Spell, so it receives the bonus."]},{"title":"Projectile Damage - check the tag","when":{"skill-type":"attack","modifier-type":"projectile-damage"},"steps":["The modifier targets Projectile Damage.","It applies only if your Attack also has the Projectile tag (for example a Bow or Crossbow skill)."]},{"title":"Projectile Damage on a Spell - check the tag","when":{"skill-type":"spell","modifier-type":"projectile-damage"},"steps":["The modifier targets Projectile Damage.","It applies only if your Spell also has the Projectile tag (for example a spell that fires a projectile)."]},{"title":"Mismatch - Attack Damage on a Spell","when":{"skill-type":"spell","modifier-type":"attack-damage"},"steps":["Attack Damage modifiers do not apply to Spells.","A support gem with the Attack tag will show as incompatible on a Spell skill."]},{"title":"Mismatch - Spell Damage on an Attack","when":{"skill-type":"attack","modifier-type":"spell-damage"},"steps":["Spell Damage modifiers do not apply to Attacks.","A support gem with the Spell tag will show as incompatible on an Attack skill."]},{"title":"Generic Damage applies","when":{"skill-type":"attack","modifier-type":"generic"},"steps":["Generic Damage or Elemental Damage modifiers apply to any skill regardless of category.","They still must match the damage type (for example Fire Damage only helps Fire skills)."]},{"title":"Generic Damage applies","when":{"skill-type":"spell","modifier-type":"generic"},"steps":["Generic Damage or Elemental Damage modifiers apply to any skill regardless of category.","They still must match the damage type (for example Cold Damage only helps Cold skills)."]}],"defaultResult":{"title":"Still unsure?","steps":["Read the exact wording on the modifier or support gem.","Match the category word (Attack / Spell / Projectile) to your skill's tags.","If the tag is missing, the modifier will not apply and the support may show as incompatible."]}},{"id":"worked-examples","order":7,"title":"Worked examples","type":"data-table","visible":true,"toc":true,"caption":"Four common builds showing skill type, tags, and which damage modifiers apply. This is illustrative, not exhaustive.","columns":[{"key":"case","label":"Case"},{"key":"skill","label":"Skill"},{"key":"tags","label":"Tags"},{"key":"what-applies","label":"What applies"}],"filters":[],"rows":[{"tags":["attack","physical"],"cells":{"case":"Bow physical attack","skill":"A Bow skill dealing physical damage","tags":"Attack, Projectile, Physical","what-applies":"Attack Damage, Projectile Damage, and Physical Damage modifiers all apply. Evasion matters for the hit."}},{"tags":["attack","fire"],"cells":{"case":"Fire elemental attack","skill":"A weapon attack converted to Fire","tags":"Attack, Fire","what-applies":"Attack Damage and Fire Damage modifiers apply. Spell Damage does not. Penetration affects the hit."}},{"tags":["spell","cold"],"cells":{"case":"Pure cold spell","skill":"A spell dealing Cold damage","tags":"Spell, Cold","what-applies":"Spell Damage and Cold Damage modifiers apply. Attack Damage does not. Accuracy is irrelevant."}},{"tags":["damage-over-time","ailment"],"cells":{"case":"Ignite or Poison DoT","skill":"An ailment dealing Damage over Time","tags":"Damage over Time, Ailment","what-applies":"DoT and ailment multipliers apply. It is not a Hit, so crit, leech, on-hit, and penetration do not apply the same way. Resistance still mitigates."}}],"note":"Exact modifier names vary by patch. Always read the skill tooltip tags and the modifier wording in game."},{"id":"common-misreads","order":8,"title":"Common misreads","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["Most build mistakes around these tags come from assuming one layer controls another. Watch for the traps below."],"bullets":["Assuming an Attack is always Physical - Attacks can deal Fire, Cold, Lightning, or Chaos.","Assuming a Spell cannot deal Physical - Spell base damage is set by the skill, not the weapon, but the damage type is still independent.","Adding Attack Damage to a Spell, or Spell Damage to an Attack - the bonus simply will not apply.","Expecting a DoT or ailment to crit, leech, or trigger on-hit effects - these are not Hits.","Expecting penetration to help a DoT - penetration only applies to Hits; use exposure or ailment magnitude instead.","Reading a Projectile or Minion tag as a damage-type signal - it only describes delivery or ownership."]},{"id":"community-cases","order":9,"title":"Common player confusions","type":"card-grid","visible":true,"toc":true,"intro":"Paraphrased confusions players frequently raise about skill tags in Path of Exile 2.","cards":[{"title":"My spell did no damage from Attack support","tag":"support-gem","body":["A Spell skill with no Attack tag will reject Attack-type support gems. The gem shows incompatible because the category does not match."]},{"title":"Why did my ignite not crit?","tag":"damage-over-time","body":["Ignite is Damage over Time, not a Hit. By default ailments do not crit and do not benefit from critical damage bonuses."]},{"title":"Penetration felt useless on poison","tag":"penetration","body":["Poison is a DoT. Penetration only applies to Hits, so it does not help the damage-over-time portion. Resistance still reduces it."]},{"title":"Minion skill ignored my spell gems","tag":"minion","body":["Minion describes who casts the skill. Whether spell supports apply depends on the minion skill's own tags, which are version-sensitive - confirm in game."]}]},{"id":"video-guide","order":10,"title":"Video guide","type":"video","visible":true,"toc":true,"entries":[{"label":"PoE2 How to do Damage | Spells vs Attacks","creator":"Exiled RPGs","description":"A clear walkthrough of how damage works in Path of Exile 2, contrasting Attacks and Spells, explaining Hits and Damage over Time, and showing which modifiers apply to which skills.","takeaway":"Match the modifier's category word (Attack, Spell, Projectile) to your skill's tags; remember that Damage over Time is not a Hit.","url":"https://www.youtube.com/watch?v=X9kM7Wuyuog","timestamps":[{"label":"Introduction","time":"0:00"},{"label":"Attacks vs spells explained","time":"1:30"},{"label":"What counts as a hit","time":"4:10"},{"label":"Damage over time and ailments","time":"7:25"},{"label":"Which modifiers apply to which skills","time":"10:40"},{"label":"Summary and common traps","time":"13:15"}]}]},{"id":"faq","order":11,"title":"Frequently asked questions","type":"faq","visible":true,"toc":true,"items":[{"question":"Is an Attack always Physical damage?","answer":["No. An Attack is a skill category defined by using your weapon. Attacks can deal Physical, Fire, Cold, Lightning, or Chaos damage. The damage type is independent of the Attack/Spell category."]},{"question":"Does a Spell use Accuracy or hit chance?","answer":["No. Spells are not affected by Accuracy or evasion. Their base damage, cast speed, and critical chance come from the skill itself, not from a weapon."]},{"question":"Is Damage over Time a Hit?","answer":["No. Damage over Time is applied gradually across a duration and does not count as a Hit. Because of that, bonuses and defences that apply to hits (such as penetration and armour) do not affect it, while resistance in the matching damage type still mitigates it."]},{"question":"Can Damage over Time crit or leech?","answer":["By default, Damage over Time and ailments such as Ignite, Bleed, and Poison do not crit and do not trigger on-hit effects. Whether they can leech depends on the current recovery mechanics in 0.5.4 and is flagged for PC confirmation."]},{"question":"Do behaviour tags like Projectile or Minion set the damage type?","answer":["No. Projectile, AoE, Melee, Duration, Minion, and Totem describe how a skill is delivered or who owns it. They do not determine whether the skill is an Attack or a Spell, nor what damage type it deals."]},{"question":"Why does my support gem show as incompatible?","answer":["A support gem only applies if its required tags match the skill's tags. A gem requiring the Attack tag will not slot into a Spell, and one requiring Spell will not slot into an Attack. Read both the skill and the support tooltip tags."]}]},{"id":"sources","order":12,"title":"Sources and verification","type":"sources","visible":true,"toc":true,"categories":[{"label":"PoE2 Wiki - Damage over time","description":"Official wiki page confirming DoT is not a Hit and is unaffected by penetration or armour","url":"https://poe2wiki.net/wiki/Damage_over_time"},{"label":"PoE2 Wiki - Attack","description":"Official wiki page defining Attacks and confirming they can deal any damage type","url":"https://poe2wiki.net/wiki/Attack"},{"label":"PoE2 Wiki - Spell","description":"Official wiki page defining Spells and confirming they ignore accuracy and evasion","url":"https://poe2wiki.net/wiki/Spell"},{"label":"Exiled RPGs - PoE2 How to do Damage (YouTube)","description":"Community video explaining Attacks vs Spells, Hits, and Damage over Time","url":"https://www.youtube.com/watch?v=X9kM7Wuyuog"},{"label":"Maxroll - PoE2 resources","description":"Community hub of Path of Exile 2 mechanics and build guides","url":"https://maxroll.gg/poe2"}],"verificationChecklist":{"status":"pending-pc","method":"official","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":13,"title":"Changelog","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["Initial publication of the Attack, Spell, Hit, and Damage over Time tags guide for Path of Exile 2 Early Access 0.5.4.","Added quick answers, terminology, relationship map, hit vs DoT table, behaviour tags, modifier compatibility diagnostic, worked examples, common misreads, community cases, video, FAQ, and sources."]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 Wiki - Damage over time","url":"https://poe2wiki.net/wiki/Damage_over_time","sourceType":"official"},{"label":"PoE2 Wiki - Attack","url":"https://poe2wiki.net/wiki/Attack","sourceType":"official"},{"label":"PoE2 Wiki - Spell","url":"https://poe2wiki.net/wiki/Spell","sourceType":"official"},{"label":"Exiled RPGs - PoE2 How to do Damage (YouTube)","url":"https://www.youtube.com/watch?v=X9kM7Wuyuog","sourceType":"community"},{"label":"Maxroll - PoE2 resources","url":"https://maxroll.gg/poe2","sourceType":"community"}],"seo":{"title":"PoE 2 Attack, Spell, Hit & Damage over Time Tags Guide","description":"Understand Path of Exile 2 skill tags: Attack vs Spell, Hit vs Damage over Time, and behaviour tags like Projectile, AoE, Minion, and Totem. Learn which modifiers apply.","noindex":false}},{"id":"attack-spell-hit-damage-over-time-tags","slug":"attack-spell-hit-damage-over-time-tags","locale":"zh-cn","type":"guide","status":"published","featured":false,"title":"流放之路2 中的攻击、法术、命中与持续伤害标签","shortTitle":"攻击 vs 法术 vs 命中 vs 持续伤害","summary":"厘清流放之路2 中最容易混淆的四个技能概念：攻击、法术、命中与持续伤害。了解哪些加成适用于哪些技能，以及行为标签的作用方式。","description":"一份简洁的流放之路2 机制指南，解释攻击与法术（技能类别）、命中与持续伤害（伤害形式），以及投射物、范围、近战、持续、召唤物、图腾等行为标签的区别。包含加成兼容性诊断与实例演练。","guideCategory":"mechanics","heroImage":"/images/skills/lightning-arrow.webp","cardImage":"/images/skills/lightning-arrow.webp","imageAlt":"流放之路2 技能图标，说明攻击、法术、命中与持续伤害技能标签的区别","estimatedReadingMinutes":16,"prerequisites":["对流放之路2 技能石与辅助宝石系统有基本了解","熟悉阅读技能提示框及其所列标签","知道伤害具有类型（物理、火焰、冰霜、闪电、混沌）"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","attack","spell","hit","damage-over-time","skill-tags","tags"],"sections":[{"id":"quick-answer","order":1,"title":"直接回答","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"什么是攻击？","body":["攻击是使用你已装备武器直接对敌人造成伤害的技能。攻击可以造成任意伤害类型，通常会依据你的命中数值对目标的闪避进行命中判定。"]},{"title":"什么是法术？","body":["法术是利用原始魔法而非武器的技能。法术不是攻击，它无视命中与闪避，其基础伤害与暴击几率来自技能本身。"]},{"title":"什么是命中？","body":["命中是在某一瞬间造成的一次离散伤害。大多数攻击与法术都以命中的形式造成伤害，而命中可以暴击、吸取，并触发命中效果。"]},{"title":"什么是持续伤害？","body":["持续伤害（DoT）是在持续时间内逐渐造成、而非一次性产生的伤害。持续伤害不是命中，因此通常无法像命中那样暴击、吸取或触发命中效果。"]}]},{"id":"terminology","order":2,"title":"关键术语","type":"overview","visible":true,"toc":true,"paragraphs":["当玩家谈论“标签”时，四个不同的概念常被混在一起。它们回答的是不同的问题，并且彼此基本相互独立。","技能类型（攻击 vs 法术）回答技能如何释放。伤害类型（物理、火焰、冰霜、闪电、混沌）回答伤害的元素或形式。命中类型回答伤害是以单次命中还是以持续伤害的形式到来。行为标签（投射物、范围、近战、持续、召唤物、图腾）回答技能的释放方式或归属者。这四层都不会单独决定另一层。"],"bullets":["技能类型：攻击（使用武器）或法术（使用魔法）。这是技能的类别。","伤害类型：物理、火焰、冰霜、闪电或混沌。任何技能类型都可以造成任意伤害类型。","命中类型：命中（瞬时）或持续伤害（渐进）。点燃、中毒等异常状态属于持续伤害的形式。","行为标签：投射物、范围、近战、持续、召唤物、图腾。这些描述释放方式与归属，而非伤害类型。"]},{"id":"relationship-map","order":3,"title":"技能类别关系图","type":"data-table","visible":true,"toc":true,"caption":"攻击与法术类别如何与伤害类型、命中数值及命中状态相关联。技能类型与伤害类型是正交关系。","columns":[{"key":"skill-category","label":"技能类别"},{"key":"deals-physical","label":"造成物理？"},{"key":"deals-elemental","label":"造成元素？"},{"key":"deals-chaos","label":"造成混沌？"},{"key":"requires-accuracy","label":"需要命中？"},{"key":"is-a-hit","label":"是命中？"}],"filters":[],"rows":[{"tags":["attack"],"cells":{"skill-category":"攻击","deals-physical":"有时——可造成任意类型","deals-elemental":"有时——可造成任意类型","deals-chaos":"有时——可造成任意类型","requires-accuracy":"是——对闪避进行判定","is-a-hit":"通常是，按每次计算"}},{"tags":["spell"],"cells":{"skill-category":"法术","deals-physical":"有时——可造成任意类型","deals-elemental":"有时——可造成任意类型","deals-chaos":"有时——可造成任意类型","requires-accuracy":"否——无视命中与闪避","is-a-hit":"通常是，按每次计算"}}],"note":"法术可以造成火焰、冰霜、闪电或混沌；攻击也可以造成火焰（例如通过转化或元素武器）。类别永远不会固定伤害类型。"},{"id":"hit-vs-dot","order":4,"title":"命中 vs 持续伤害","type":"data-table","visible":true,"toc":true,"caption":"不同伤害形式在流放之路2 中的行为表现。依据 PoE2 维基：持续伤害不是命中，因此不受穿透影响，但仍会被对应伤害类型的抗性减免。","columns":[{"key":"damage-form","label":"伤害形式"},{"key":"is-a-hit","label":"是命中？"},{"key":"can-crit","label":"可暴击？"},{"key":"can-leech","label":"可吸取？"},{"key":"affected-by-penetration","label":"受穿透影响？"},{"key":"triggers-on-hit","label":"触发命中效果？"}],"filters":[],"rows":[{"tags":["hit"],"cells":{"damage-form":"命中","is-a-hit":"是","can-crit":"是","can-leech":"是（0.5.4 中的恢复机制，待 PC 验证）","affected-by-penetration":"是","triggers-on-hit":"是"}},{"tags":["ailment"],"cells":{"damage-form":"异常状态（点燃、流血、中毒）","is-a-hit":"否","can-crit":"否——异常状态默认不暴击","can-leech":"否（待 PC 验证）","affected-by-penetration":"否","triggers-on-hit":"否"}},{"tags":["ground-effect"],"cells":{"damage-form":"地面效果","is-a-hit":"否","can-crit":"否","can-leech":"否","affected-by-penetration":"否","triggers-on-hit":"否"}},{"tags":["damage-over-time"],"cells":{"damage-form":"持续伤害（非异常状态）","is-a-hit":"否","can-crit":"否","can-leech":"否（待 PC 验证）","affected-by-penetration":"否——穿透仅作用于命中","triggers-on-hit":"否"}}],"note":"对应伤害类型的抗性仍会减免持续伤害，但护甲与穿透不会，因为它们仅作用于命中。恢复（吸取）机制在 0.5.4 中随版本变化，已标注待 PC 确认。"},{"id":"tags","order":5,"title":"行为标签意味着什么、不意味着什么","type":"overview","visible":true,"toc":true,"paragraphs":["行为标签描述技能的释放方式或归属者，与技能类型及伤害类型均相互独立。像“投射物”这样的标签只说明技能以投射物形式飞行，并不说明它是攻击还是法术，也不说明它造成什么伤害类型。","范围、近战、持续、召唤物、图腾同样如此。召唤物技能由你的召唤物施放，图腾技能由你放置的图腾施放，持续技能会维持一段时间——这些都不会固定伤害类型或攻击/法术类别。"],"bullets":["投射物：技能以投射物形式飞行。它可以是攻击（弓射击）也可以是法术（法术投射物）。","范围：在区域内造成伤害。攻击与法术均可适用。","近战：近距离释放。几乎总是攻击，但仅凭标签不会设定伤害类型。","持续：效果持续一段时间（例如地面效果或光环）。其本身不是命中。","召唤物 / 图腾：描述技能的归属者，而非其伤害类型。辅助宝石的兼容性仍取决于底层技能的标签。"]},{"id":"modifier-compatibility","order":6,"title":"加成兼容性诊断","type":"diagnostic","visible":true,"toc":true,"intro":"用此工具检查某个伤害加成或辅助宝石是否会作用于你的技能。先选择技能类型，再选择加成范围。","controls":[{"id":"skill-type","label":"你的技能属于什么类别？","options":[{"label":"攻击","value":"attack"},{"label":"法术","value":"spell"}]},{"id":"modifier-type","label":"加成或辅助的说明是什么？","options":[{"label":"攻击伤害","value":"attack-damage"},{"label":"法术伤害","value":"spell-damage"},{"label":"投射物伤害","value":"projectile-damage"},{"label":"通用伤害 / 元素伤害","value":"generic"}]}],"rules":[{"title":"攻击伤害适用","when":{"skill-type":"attack","modifier-type":"attack-damage"},"steps":["加成或辅助的目标为“攻击伤害”。","你的技能是攻击，因此它会获得该加成。"]},{"title":"法术伤害适用","when":{"skill-type":"spell","modifier-type":"spell-damage"},"steps":["加成或辅助的目标为“法术伤害”。","你的技能是法术，因此它会获得该加成。"]},{"title":"投射物伤害——检查标签","when":{"skill-type":"attack","modifier-type":"projectile-damage"},"steps":["加成目标为“投射物伤害”。","仅当你的攻击也具有投射物标签时才适用（例如弓或十字弩技能）。"]},{"title":"法术上的投射物伤害——检查标签","when":{"skill-type":"spell","modifier-type":"projectile-damage"},"steps":["加成目标为“投射物伤害”。","仅当你的法术也具有投射物标签时才适用（例如发射投射物的法术）。"]},{"title":"不匹配——法术上使用攻击伤害","when":{"skill-type":"spell","modifier-type":"attack-damage"},"steps":["攻击伤害加成不适用于法术。","带有攻击标签的辅助宝石在法术技能上会显示不兼容。"]},{"title":"不匹配——攻击上使用法术伤害","when":{"skill-type":"attack","modifier-type":"spell-damage"},"steps":["法术伤害加成不适用于攻击。","带有法术标签的辅助宝石在攻击技能上会显示不兼容。"]},{"title":"通用伤害适用","when":{"skill-type":"attack","modifier-type":"generic"},"steps":["通用伤害或元素伤害加成适用于任意技能，与类别无关。","仍需匹配伤害类型（例如火焰伤害只帮助火焰技能）。"]},{"title":"通用伤害适用","when":{"skill-type":"spell","modifier-type":"generic"},"steps":["通用伤害或元素伤害加成适用于任意技能，与类别无关。","仍需匹配伤害类型（例如冰霜伤害只帮助冰霜技能）。"]}],"defaultResult":{"title":"仍不确定？","steps":["阅读加成或辅助宝石上的确切措辞。","将类别词（攻击 / 法术 / 投射物）与技能的标签对应。","若缺少该标签，加成不会生效，辅助可能显示不兼容。"]}},{"id":"worked-examples","order":7,"title":"实例演练","type":"data-table","visible":true,"toc":true,"caption":"四个常见流派展示技能类型、标签以及适用的伤害加成。此为示例，并非穷尽。","columns":[{"key":"case","label":"情形"},{"key":"skill","label":"技能"},{"key":"tags","label":"标签"},{"key":"what-applies","label":"适用内容"}],"filters":[],"rows":[{"tags":["attack","physical"],"cells":{"case":"弓物理攻击","skill":"造成物理伤害的弓技能","tags":"攻击、投射物、物理","what-applies":"攻击伤害、投射物伤害与物理伤害加成均适用。命中需考虑闪避。"}},{"tags":["attack","fire"],"cells":{"case":"火焰元素攻击","skill":"转化为火焰的武器攻击","tags":"攻击、火焰","what-applies":"攻击伤害与火焰伤害加成适用。法术伤害不适用。穿透影响该次命中。"}},{"tags":["spell","cold"],"cells":{"case":"纯冰霜法术","skill":"造成冰霜伤害的法术","tags":"法术、冰霜","what-applies":"法术伤害与冰霜伤害加成适用。攻击伤害不适用。命中无关。"}},{"tags":["damage-over-time","ailment"],"cells":{"case":"点燃或中毒持续伤害","skill":"造成持续伤害的异常状态","tags":"持续伤害、异常状态","what-applies":"持续伤害与异常状态乘数适用。它不是命中，因此暴击、吸取、命中效果与穿透的作用方式不同。抗性仍会减免。"}}],"note":"具体加成名称随版本变化。请始终在游戏中阅读技能提示框标签与加成措辞。"},{"id":"common-misreads","order":8,"title":"常见误读","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["围绕这些标签的大部分构筑错误，源于假设某一层控制了另一层。请注意以下陷阱。"],"bullets":["假设攻击永远是物理——攻击可以造成火焰、冰霜、闪电或混沌。","假设法术不能造成物理——法术基础伤害由技能决定而非武器，但伤害类型仍是独立的。","给法术加攻击伤害，或给攻击加法术伤害——加成根本不会生效。","期望持续伤害或异常状态暴击、吸取或触发命中效果——它们不是命中。","期望穿透帮助持续伤害——穿透仅作用于命中；应使用曝露或异常状态增伤。","把投射物或召唤物标签当作伤害类型信号——它只描述释放方式或归属。"]},{"id":"community-cases","order":9,"title":"玩家常见困惑","type":"card-grid","visible":true,"toc":true,"intro":"玩家在流放之路2 中围绕技能标签经常提出的困惑（转述）。","cards":[{"title":"我的法术没有吃到攻击辅助的加成","tag":"辅助宝石","body":["没有攻击标签的法术技能会拒绝攻击类辅助宝石。宝石显示不兼容，是因为类别不匹配。"]},{"title":"为什么我的点燃没有暴击？","tag":"持续伤害","body":["点燃是持续伤害，不是命中。默认情况下异常状态不会暴击，也不享受暴击伤害加成。"]},{"title":"穿透对中毒似乎无效","tag":"穿透","body":["中毒是持续伤害。穿透仅作用于命中，因此无助于伤害随时间的那部分。抗性仍会减免它。"]},{"title":"召唤物技能忽略了我的法术宝石","tag":"召唤物","body":["召唤物描述谁施放技能。法术辅助是否适用取决于召唤物技能自身的标签，这随版本变化——请在游戏中确认。"]}]},{"id":"video-guide","order":10,"title":"视频指南","type":"video","visible":true,"toc":true,"entries":[{"label":"PoE2 How to do Damage | Spells vs Attacks","creator":"Exiled RPGs","description":"清晰讲解流放之路2 中伤害如何运作，对比攻击与法术，解释命中与持续伤害，并说明哪些加成适用于哪些技能。","takeaway":"将加成的类别词（攻击、法术、投射物）与技能标签对应；记住持续伤害不是命中。","url":"https://www.youtube.com/watch?v=X9kM7Wuyuog","timestamps":[{"label":"简介","time":"0:00"},{"label":"攻击与法术讲解","time":"1:30"},{"label":"什么算作命中","time":"4:10"},{"label":"持续伤害与异常状态","time":"7:25"},{"label":"哪些加成适用于哪些技能","time":"10:40"},{"label":"总结与常见陷阱","time":"13:15"}]}]},{"id":"faq","order":11,"title":"常见问题","type":"faq","visible":true,"toc":true,"items":[{"question":"攻击永远是物理伤害吗？","answer":["不是。攻击是由使用武器定义的技能类别。攻击可以造成物理、火焰、冰霜、闪电或混沌伤害。伤害类型与攻击/法术类别无关。"]},{"question":"法术是否使用命中或命中几率？","answer":["不使用。法术不受命中与闪避影响。其基础伤害、施法速度与暴击几率来自技能本身，而非武器。"]},{"question":"持续伤害是命中吗？","answer":["不是。持续伤害是在持续时间内逐渐造成的，不算作命中。因此，作用于命中的加成与防御（如穿透与护甲）不会影响它，而对应伤害类型的抗性仍会减免它。"]},{"question":"持续伤害能否暴击或吸取？","answer":["默认情况下，持续伤害以及点燃、流血、中毒等异常状态不会暴击，也不会触发命中效果。能否吸取取决于 0.5.4 当前的恢复机制，已标注待 PC 确认。"]},{"question":"投射物或召唤物等行为标签会设定伤害类型吗？","answer":["不会。投射物、范围、近战、持续、召唤物、图腾描述技能的释放方式或归属者。它们不会决定技能是攻击还是法术，也不决定造成什么伤害类型。"]},{"question":"为什么我的辅助宝石显示不兼容？","answer":["辅助宝石仅在其所需标签与技能标签匹配时才会生效。要求攻击标签的宝石无法插入法术，要求法术标签的宝石无法插入攻击。请同时阅读技能与辅助的提示框标签。"]}]},{"id":"sources","order":12,"title":"来源与验证","type":"sources","visible":true,"toc":true,"categories":[{"label":"PoE2 维基 - 持续伤害","description":"官方维基页面，确认持续伤害不是命中，且不受穿透或护甲影响","url":"https://poe2wiki.net/wiki/Damage_over_time"},{"label":"PoE2 维基 - 攻击","description":"官方维基页面，定义攻击并确认其可造成任意伤害类型","url":"https://poe2wiki.net/wiki/Attack"},{"label":"PoE2 维基 - 法术","description":"官方维基页面，定义法术并确认其无视命中与闪避","url":"https://poe2wiki.net/wiki/Spell"},{"label":"Exiled RPGs - PoE2 伤害机制（YouTube）","description":"社区视频，讲解攻击 vs 法术、命中与持续伤害","url":"https://www.youtube.com/watch?v=X9kM7Wuyuog"},{"label":"Maxroll - PoE2 资源","description":"流放之路2 机制与构筑指南社区中心","url":"https://maxroll.gg/poe2"}],"verificationChecklist":{"status":"pending-pc","method":"official","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":13,"title":"更新日志","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["首发攻击、法术、命中与持续伤害标签指南，对应流放之路2 抢先体验 0.5.4。","新增快速回答、关键术语、关系图、命中 vs 持续伤害表、行为标签、加成兼容性诊断、实例演练、常见误读、玩家困惑、视频、常见问题与来源。"]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 维基 - 持续伤害","url":"https://poe2wiki.net/wiki/Damage_over_time","sourceType":"official"},{"label":"PoE2 维基 - 攻击","url":"https://poe2wiki.net/wiki/Attack","sourceType":"official"},{"label":"PoE2 维基 - 法术","url":"https://poe2wiki.net/wiki/Spell","sourceType":"official"},{"label":"Exiled RPGs - PoE2 伤害机制（YouTube）","url":"https://www.youtube.com/watch?v=X9kM7Wuyuog","sourceType":"community"},{"label":"Maxroll - PoE2 资源","url":"https://maxroll.gg/poe2","sourceType":"community"}],"seo":{"title":"流放之路2 攻击、法术、命中与持续伤害标签指南","description":"理解流放之路2 技能标签：攻击 vs 法术、命中 vs 持续伤害，以及投射物、范围、召唤物、图腾等行为标签。了解哪些加成适用。","noindex":false}},{"id":"damage-scaling-order-conversion-gain-as-extra","slug":"damage-scaling-order-conversion-gain-as-extra","locale":"en","type":"guide","status":"published","featured":false,"title":"Damage Scaling Order, Conversion, and Gain as Extra in Path of Exile 2","shortTitle":"Damage Scaling & Conversion","summary":"Learn the Path of Exile 2 damage pipeline: base, added, increased (additive), more (multiplicative), conversion, gain as extra, crit, and enemy resistance, with worked examples.","description":"A mechanics guide to the order of damage calculations in Path of Exile 2, how increased bonuses add while more multipliers multiply, and how conversion differs from gain as extra damage.","guideCategory":"mechanics","heroImage":"/images/skills/explosive-shot.webp","cardImage":"/images/skills/explosive-shot.webp","imageAlt":"A Path of Exile 2 skill icon representing damage scaling, conversion and gain as extra damage","estimatedReadingMinutes":15,"prerequisites":["Basic understanding that a skill deals damage of a type (physical, fire, cold, lightning, chaos)","Familiarity with item and passive 'increased' and 'more' modifiers","Awareness that crit and enemy resistances affect the final damage dealt"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","damage","scaling","increased","more","conversion","gain-as-extra"],"sections":[{"id":"quick-answer","order":1,"title":"Direct answers","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"In what order is damage calculated in Path of Exile 2?","body":["The pipeline runs: skill base damage, then flat added damage, then all same-category Increased bonuses added together, then every More/Less multiplier multiplied in, then conversion, then Gain as Extra, then a critical hit multiplier, and finally the enemy's resistances and Damage Taken modifiers."]},{"title":"Do different 'increased' bonuses multiply each other?","body":["No. All '% increased' modifiers of the same damage category are additive with each other and apply once as a single multiplier. Only More/Less modifiers are multiplicative."]},{"title":"What is the difference between Conversion and Gain as Extra?","body":["Conversion changes damage of one type into another. 'Gain X% of Y as Extra Z' instead adds damage of type Z while keeping the original Y, so the original damage is not removed. They are separate steps in the current PoE2 pipeline."]},{"title":"Does my 'Damage Taken' modifier boost my own damage?","body":["No. Damage Taken modifiers affect incoming damage on the target, not your outgoing scaling. Personal damage comes from base, added, increased, more, conversion, gain as extra, and crit stages."]}]},{"id":"terms","order":2,"title":"Key terms","type":"overview","visible":true,"toc":true,"paragraphs":["Before following the pipeline, lock down what each modifier word means. The PoE2 tooltip uses consistent language, but players often confuse 'increased' with 'more' and 'conversion' with 'gain as extra'.","All examples below use clearly assumed teaching numbers; your real skill values come from the in-game tooltip and the live client, which supersede anything written here."],"bullets":["Base Damage: the skill's innate damage of its inherent type before any modifiers.","Added Damage: flat numbers such as 'Adds X to Y damage' that are summed and added to the base.","Increased: percentage bonuses that are additive within the same damage category and apply once.","More / Less: percentage multipliers that always multiply the running total (More up, Less down).","Conversion: changes damage of one type into another type at a set percentage.","Gain as Extra: 'Gain X% of Y as Extra Z' adds damage of type Z while keeping the original Y."]},{"id":"order","order":3,"title":"Order of operations","type":"data-table","visible":true,"toc":true,"caption":"The current PoE2 damage pipeline, in the order the game resolves it. Describing the behavior qualitatively; exact coefficient positions are version-sensitive and should be confirmed in the live client.","columns":[{"key":"step","label":"Step"},{"key":"stage","label":"Stage"},{"key":"what-happens","label":"What happens"},{"key":"note","label":"Note"}],"filters":[],"rows":[{"tags":["base"],"cells":{"step":"0","stage":"Base damage","what-happens":"The skill's base damage of its inherent type is established.","note":"Starting point before any modifiers."}},{"tags":["added"],"cells":{"step":"1","stage":"Added (flat) damage","what-happens":"Flat 'Added X damage' modifiers are summed and added to the base.","note":"Flat numbers, not percentages."}},{"tags":["increased"],"cells":{"step":"2","stage":"Increased (additive)","what-happens":"All '% increased' of the same category add together, then apply once to the running total.","note":"Same-category Increased bonuses are additive, not multiplicative."}},{"tags":["more"],"cells":{"step":"3","stage":"More / Less (multiplicative)","what-happens":"Every More/Less multiplier multiplies the running total in sequence.","note":"More and Less always multiply and stack multiplicatively with each other."}},{"tags":["conversion"],"cells":{"step":"4","stage":"Conversion","what-happens":"Damage of one type is converted into another type at a set percentage.","note":"In PoE2 this is a distinct step; conversion changes the type of damage dealt."}},{"tags":["gain-as-extra"],"cells":{"step":"5","stage":"Gain as Extra","what-happens":"'Gain X% of Y as Extra Z' adds damage of type Z while keeping the original Y.","note":"Separate from conversion; the original damage is not removed."}},{"tags":["crit"],"cells":{"step":"6","stage":"Critical hit","what-happens":"If the hit crits, a critical damage multiplier applies to the final scaled amount.","note":"Crit applies after the scaling above, not before it."}},{"tags":["resistance"],"cells":{"step":"7","stage":"Enemy resistance / Damage Taken","what-happens":"The enemy's resistances and any Damage Taken modifiers are applied last.","note":"Damage Taken affects incoming damage on the enemy, not your outgoing scaling."}}],"note":"Step numbers are a teaching ordering; the design intent is base to added to increased to more to conversion to gain as extra to crit to enemy mitigation."},{"id":"additive-vs-multiplicative","order":4,"title":"Additive vs multiplicative","type":"data-table","visible":true,"toc":true,"caption":"How each kind of modifier combines. The single most common scaling mistake is treating two Increased bonuses as if they multiply.","columns":[{"key":"modifier","label":"Modifier"},{"key":"how-combined","label":"How combined"},{"key":"example","label":"Example"}],"filters":[],"rows":[{"tags":["increased"],"cells":{"modifier":"Two '% increased' of the same category","how-combined":"Add together within the category, then apply once","example":"50% + 30% = 80% increased, total x1.8 (not x1.5 then x1.3)."}},{"tags":["increased"],"cells":{"modifier":"Generic and specific Increased","how-combined":"Add into the appropriate bucket where the rules allow","example":"Generic 'increased Damage' and 'increased Physical Damage' may share one bucket."}},{"tags":["more"],"cells":{"modifier":"One '% more Damage'","how-combined":"Multiplies the running total","example":"x1.2 multiplies whatever total came before it."}},{"tags":["more"],"cells":{"modifier":"Two separate More bonuses","how-combined":"Each More multiplies, and they multiply with each other","example":"x1.2 and x1.5 combine to x1.8 overall."}},{"tags":["less"],"cells":{"modifier":"'% less' modifiers","how-combined":"Multiply like More, but reduce the total","example":"A 20% Less is x0.8 applied to the running total."}}],"note":"Because More multipliers multiply, a few of them often beat stacking many Increased bonuses of the same category."},{"id":"conversion","order":5,"title":"Conversion vs Gain as Extra","type":"overview","visible":true,"toc":true,"paragraphs":["Conversion and Gain as Extra are distinct mechanics and sit at different points of the pipeline. Conversion takes a percentage of damage of one type and turns it into another type. If you convert 90% of physical to fire, 90% of that damage becomes fire and only the remaining 10% stays physical.","Gain as Extra is different. 'Gain X% of Y as Extra Z' adds a chunk of damage of type Z on top of the original, without removing the original Y. For example, 'Gain 20% of Physical as Extra Fire' keeps all your physical damage and adds 20% more fire damage calculated from your physical total.","The exact ordering and any type-ordering rules for conversion in PoE2 are version-sensitive; confirm the live behavior in the current client rather than copying older PoE1 chain assumptions, which do not apply here."],"bullets":["Conversion: changes a damage type into another, removing the original portion converted.","Gain as Extra: adds a new damage type while keeping the original damage.","Both happen after Increased and More, before the enemy's resistance step.","PoE2's conversion rules differ from the older strict PoE1 chain; do not assume the same order."]},{"id":"worked-example-one","order":6,"title":"Worked example one: added damage and conversion","type":"data-table","visible":true,"toc":true,"caption":"A single physical attack. Every number is an assumed teaching value; replace them with your real skill's base, added, increased, and conversion from the tooltip.","columns":[{"key":"case","label":"Case"},{"key":"setup","label":"Setup"},{"key":"calculation","label":"Calculation"},{"key":"result","label":"Result"}],"filters":[],"rows":[{"tags":["physical"],"cells":{"case":"Bare physical hit","setup":"Base 100 physical, no added, no increased","calculation":"100 x 1.00 = 100","result":"100 physical"}},{"tags":["physical"],"cells":{"case":"Physical + Added + 90% conversion to fire","setup":"Base 100 physical, +50 added physical, 100% increased physical","calculation":"(100 + 50) x 2.00 = 300 physical; convert 90% to fire = 270 fire + 30 physical","result":"270 fire, 30 physical"}},{"tags":["physical"],"cells":{"case":"Same hit, 0% conversion","setup":"Base 100 physical, +50 added, 100% increased, no conversion","calculation":"(100 + 50) x 2.00 = 300 physical","result":"300 physical"}}],"note":"The conversion step changes the type after Increased and More have already been applied to the physical total."},{"id":"worked-example-two","order":7,"title":"Worked example two: the full pipeline","type":"data-table","visible":true,"toc":true,"caption":"A full chain with two Increased, two More, a crit, and enemy resistance. All numbers are assumed teaching values.","columns":[{"key":"case","label":"Case"},{"key":"setup","label":"Setup"},{"key":"calculation","label":"Calculation"},{"key":"result","label":"Result"}],"filters":[],"rows":[{"tags":["crit"],"cells":{"case":"Full pipeline with crit","setup":"Base 100; increased 50% + 30% (80%); More 20%; More 50%; crit 150%; enemy 75% resist","calculation":"100 x 1.8 = 180; x1.2 = 216; x1.5 = 324; x1.5 crit = 486; x(1 - 0.75) = 121.5","result":"121.5 damage dealt"}},{"tags":["physical"],"cells":{"case":"Same without the crit","setup":"Same as above but no crit multiplier","calculation":"100 x 1.8 = 180; x1.2 = 216; x1.5 = 324; x(1 - 0.75) = 81","result":"81 damage dealt"}}],"note":"Resistance is applied last, on the enemy side, after crit and all of your scaling."},{"id":"scaling-matrix","order":8,"title":"Where each modifier type applies","type":"data-table","visible":true,"toc":true,"caption":"A map of common modifier buckets and where they sit in the pipeline. Match the bucket to how your skill actually deals damage.","columns":[{"key":"modifier-type","label":"Modifier type"},{"key":"where-applies","label":"Where it applies"},{"key":"notes","label":"Notes"}],"filters":[],"rows":[{"tags":["attack"],"cells":{"modifier-type":"Attack / Spell damage","where-applies":"Scales the base category of the hit","notes":"'Increased Attack Damage' is one bucket; pick it based on how the skill deals damage."}},{"tags":["projectile"],"cells":{"modifier-type":"Projectile damage","where-applies":"Applies when the hit is a projectile","notes":"Has its own Increased and More buckets where the skill is a projectile."}},{"tags":["elemental"],"cells":{"modifier-type":"Elemental damage","where-applies":"Applies to all fire, cold, and lightning dealt","notes":"Especially strong after conversion turns physical into an element."}},{"tags":["gem-level"],"cells":{"modifier-type":"Skill / gem level","where-applies":"Raises the base skill damage directly","notes":"Leveling the gem is often the largest single scaling lever."}},{"tags":["dot"],"cells":{"modifier-type":"Ailment / damage over time","where-applies":"Separate scaling for damage over time","notes":"DoT does not use the hit crit pipeline the same way as a direct hit."}}],"note":"Cross-guide context: see the Attack/Spell/Hit/DoT, Resistance & Penetration, and Critical Hit guides for deeper detail on each bucket."},{"id":"planner-vs-tooltip","order":9,"title":"Why the planner and tooltip can differ","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["Build planners and the in-game tooltip are both estimates. Neither is the absolute truth until you test against the real skill in the live client. They can disagree because of rounding, unsupported modifiers, or assumptions about buffs and enemies."],"bullets":["Treating the Build Planner number as guaranteed final damage without checking the real skill.","Treating the in-game tooltip as exact when it may exclude buffs, ailments, or enemy-specific conditions.","Forgetting that conversion and gain as extra change the damage type, which the tooltip may show split across types.","Comparing a planner's assumed crit chance to your real hit rate without accounting for accuracy and distance penalties.","Assuming resistances shown in a planner match the enemy you are actually fighting."]},{"id":"community-cases","order":10,"title":"Common points of confusion","type":"card-grid","visible":true,"toc":true,"intro":"Paraphrased confusions players frequently raise about damage scaling in Path of Exile 2.","cards":[{"title":"Two increased do not multiply","tag":"increased","body":["Players expect 50% and 30% increased to multiply into a bigger boost; they actually add to 80% and apply once."]},{"title":"Conversion removes the original","tag":"conversion","body":["Some players think converting to fire keeps the physical too; pure conversion replaces the converted portion with the new type."]},{"title":"Gain as Extra keeps the base","tag":"gain-as-extra","body":["The opposite confusion: players miss that 'Gain X% as Extra Z' adds new damage on top without removing the original."]},{"title":"Damage Taken is not your damage","tag":"resistance","body":["Players sometimes read enemy 'Damage Taken' modifiers as boosting their own outgoing scaling; it only affects incoming damage on the target."]}]},{"id":"video-guide","order":11,"title":"Video guide","type":"video","visible":true,"toc":true,"entries":[{"label":"Complete Damage Guide - Path of Exile 2","creator":"silentstill","description":"A complete walkthrough of how damage is calculated in Path of Exile 2, covering base, added, increased, more, conversion, gain as extra, crit, and enemy mitigation.","takeaway":"Remember the order: base to added to increased (additive) to more (multiplicative) to conversion to gain as extra to crit to enemy resistance.","url":"https://www.youtube.com/watch?v=MvwmmjVIes0","timestamps":[{"label":"Introduction","time":"0:00"},{"label":"Base and added damage","time":"2:10"},{"label":"Increased modifiers","time":"6:30"},{"label":"More and less multipliers","time":"10:45"},{"label":"Conversion and gain as extra","time":"15:20"},{"label":"Worked example","time":"20:05"},{"label":"Summary","time":"25:30"}]}]},{"id":"faq","order":12,"title":"Frequently asked questions","type":"faq","visible":true,"toc":true,"items":[{"question":"Does conversion happen before or after increased and more?","answer":["In the current PoE2 pipeline, conversion happens after the Increased (additive) and More (multiplicative) scaling stages, and before the enemy resistance step. The converted amount is based on the already-scaled damage."]},{"question":"If I have 200% increased damage, do I deal triple damage?","answer":["Yes, assuming all of it falls in the same category. 200% increased means a x3.00 multiplier on that category. Different categories each scale their own portion."]},{"question":"Is a 20% More better than a 20% Increased?","answer":["It depends, but More multipliers multiply while Increased add. A 20% More multiplies the whole running total by 1.2, whereas a 20% Increased only adds to others in its category. More is usually stronger when you already have a large total."]},{"question":"Can I convert and also gain as extra from the same damage?","answer":["Yes. They are separate steps. You can convert part of a damage type to another and separately gain an extra portion of a type without removing the original, producing multiple damage types in one hit."]},{"question":"Does crit multiply my conversion and gain as extra?","answer":["Crit is applied after conversion and gain as extra in the pipeline, so the crit multiplier scales the already-converted and extra-augmented total rather than the base alone."]},{"question":"Why does my tooltip not match my planner?","answer":["They use different assumptions about buffs, enemy resists, accuracy, and distance. Treat both as estimates and confirm against the real skill in the live client."]}]},{"id":"sources","order":13,"title":"Sources and verification","type":"sources","visible":true,"toc":true,"categories":[{"label":"Official wiki - Damage","description":"PoE2 wiki reference for damage, conversion, and modifier types","url":"https://poe2wiki.net/wiki/Damage"},{"label":"Community hub - Maxroll PoE2","description":"PoE2 mechanics and build hub with damage scaling discussion","url":"https://maxroll.gg/poe2"},{"label":"Video guide (silentstill)","description":"Complete Damage Guide for Path of Exile 2 covering the full pipeline","url":"https://www.youtube.com/watch?v=MvwmmjVIes0"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":14,"title":"Changelog","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["Initial publication of the damage scaling order, conversion, and gain as extra guide for Path of Exile 2 Early Access 0.5.4.","Added quick answers, key terms, order of operations, additive vs multiplicative, conversion vs gain as extra, two worked examples, scaling matrix, planner vs tooltip, community cases, video, FAQ, and sources."]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 wiki - Damage","url":"https://poe2wiki.net/wiki/Damage","sourceType":"official"},{"label":"Maxroll - Path of Exile 2 hub","url":"https://maxroll.gg/poe2","sourceType":"community"},{"label":"silentstill - Complete Damage Guide (YouTube)","url":"https://www.youtube.com/watch?v=MvwmmjVIes0","sourceType":"community"}],"seo":{"title":"PoE 2 Damage Scaling Order, Conversion & Gain as Extra Guide","description":"Learn the Path of Exile 2 damage pipeline: base, added, increased, more, conversion, gain as extra, crit, and enemy resistance, with worked examples.","noindex":false}},{"id":"damage-scaling-order-conversion-gain-as-extra","slug":"damage-scaling-order-conversion-gain-as-extra","locale":"zh-cn","type":"guide","status":"published","featured":false,"title":"流放之路2 伤害计算顺序、转化与额外获得伤害","shortTitle":"伤害缩放与转化","summary":"了解流放之路2的伤害流程：基础、附加、增大（加法）、更多（乘法）、转化、额外获得、暴击与敌方抗性，并配有计算示例。","description":"一份关于流放之路2伤害计算顺序的机制指南：增大加成为何相加、更多乘算为何相乘，以及转化与额外获得伤害的区别。","guideCategory":"mechanics","heroImage":"/images/skills/explosive-shot.webp","cardImage":"/images/skills/explosive-shot.webp","imageAlt":"流放之路2 技能图标，代表伤害缩放、转化与额外获得伤害","estimatedReadingMinutes":15,"prerequisites":["基本了解技能会按某种类型（物理、火焰、冰霜、闪电、混沌）造成伤害","熟悉装备与天赋中的“增大”与“更多”修正","知道暴击与敌方抗性会影响最终造成的伤害"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","damage","scaling","increased","more","conversion","gain-as-extra"],"sections":[{"id":"quick-answer","order":1,"title":"直接回答","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"流放之路2 中伤害按什么顺序计算？","body":["流程为：技能基础伤害，然后附加固定伤害，然后同类的所有“增大”加成相加，接着每一个“更多/更少”乘算依次相乘，之后是转化，再是额外获得，然后是暴击倍率，最后是敌方的抗性与“承受伤害”修正。"]},{"title":"不同的“增大”加成会相乘吗？","body":["不会。同一伤害类别下所有“增大%”加成彼此相加，并作为单一乘算因子生效一次。只有“更多/更少”修正才是乘算。"]},{"title":"转化与额外获得有什么区别？","body":["转化把一种类型的伤害转变为另一种类型。“额外获得 X% 的 Y 作为额外 Z”则是在保留原 Y 的同时，额外增加 Z 类型的伤害，因此原始伤害不会被移除。在当前的流放之路2流程中，它们是独立的步骤。"]},{"title":"我的“承受伤害”修正能提升自身伤害吗？","body":["不能。“承受伤害”修正影响的是目标受到的伤害，而非你自身的输出缩放。自身伤害来自基础、附加、增大、更多、转化、额外获得与暴击这些阶段。"]}]},{"id":"terms","order":2,"title":"关键术语","type":"overview","visible":true,"toc":true,"paragraphs":["在跟随流程之前，先明确每个修正词的含义。流放之路2 的提示框用词一致，但玩家常把“增大”与“更多”、“转化”与“额外获得”混淆。","以下示例均使用明确标注的假定教学数值；你真实的技能数值来自游戏内提示框与实时客户端，优先于本文任何写法。"],"bullets":["基础伤害：技能固有类型的本源伤害，在施加任何修正之前。","附加伤害：“附加 X 点伤害”这类固定数值，先求和再叠加到基础上。","增大：百分比加成，在同一伤害类别内相加，并生效一次。","更多/更少：百分比乘算，始终与累计总值相乘（更多向上，更少向下）。","转化：按设定比例把一种类型的伤害转变为另一种类型。","额外获得：“额外获得 X% 的 Y 作为额外 Z”在保留原 Y 的同时增加 Z 类型伤害。"]},{"id":"order","order":3,"title":"计算顺序","type":"data-table","visible":true,"toc":true,"caption":"当前流放之路2 的伤害流程，按游戏结算顺序列出。定性描述其行为；具体的系数位置随版本变化，应以实时客户端为准。","columns":[{"key":"step","label":"步骤"},{"key":"stage","label":"阶段"},{"key":"what-happens","label":"发生什么"},{"key":"note","label":"说明"}],"filters":[],"rows":[{"tags":["base"],"cells":{"step":"0","stage":"基础伤害","what-happens":"确立技能固有类型的本源伤害。","note":"施加任何修正之前的起点。"}},{"tags":["added"],"cells":{"step":"1","stage":"附加（固定）伤害","what-happens":"“附加 X 点伤害”等固定数值求和后叠加到基础伤害上。","note":"固定数值，不是百分比。"}},{"tags":["increased"],"cells":{"step":"2","stage":"增大（加法）","what-happens":"同一类别下所有“增大%”先相加，再对累计总值生效一次。","note":"同类的增大加成是相加，而非相乘。"}},{"tags":["more"],"cells":{"step":"3","stage":"更多/更少（乘算）","what-happens":"每一个更多/更少乘算依次与累计总值相乘。","note":"更多与更少始终相乘，且彼此以乘算叠加。"}},{"tags":["conversion"],"cells":{"step":"4","stage":"转化","what-happens":"按设定比例把一种类型的伤害转化为另一种类型。","note":"在流放之路2 中这是一个独立步骤；转化会改变造成的伤害类型。"}},{"tags":["gain-as-extra"],"cells":{"step":"5","stage":"额外获得","what-happens":"“额外获得 X% 的 Y 作为额外 Z”在保留原 Y 的同时增加 Z 类型伤害。","note":"与转化相互独立；原始伤害不会被移除。"}},{"tags":["crit"],"cells":{"step":"6","stage":"暴击","what-happens":"若此次命中暴击，暴击伤害倍率作用于已缩放完成的总值。","note":"暴击在上述缩放之后生效，而非之前。"}},{"tags":["resistance"],"cells":{"step":"7","stage":"敌方抗性/承受伤害","what-happens":"最后应用敌方的抗性与一切“承受伤害”修正。","note":"承受伤害影响的是目标受到的伤害，而非你自身的输出缩放。"}}],"note":"步骤编号仅为教学排序；设计意图是从基础到附加、增大、更多、转化、额外获得、暴击，再到敌方减伤。"},{"id":"additive-vs-multiplicative","order":4,"title":"加法与乘法","type":"data-table","visible":true,"toc":true,"caption":"每种修正如何组合。最常见的缩放错误就是把两个增大加成当成会相乘。","columns":[{"key":"modifier","label":"修正"},{"key":"how-combined","label":"如何组合"},{"key":"example","label":"示例"}],"filters":[],"rows":[{"tags":["increased"],"cells":{"modifier":"同一类别的两个“增大%”","how-combined":"在类别内相加，再生效一次","example":"50% + 30% = 80% 增大，总乘算为 x1.8（不是先 x1.5 再 x1.3）。"}},{"tags":["increased"],"cells":{"modifier":"通用增大与特定增大","how-combined":"在规则允许时并入相应桶位","example":"通用的“增大伤害”与“增大物理伤害”可能归入同一桶位。"}},{"tags":["more"],"cells":{"modifier":"一个“更多% 伤害”","how-combined":"与累计总值相乘","example":"x1.2 乘以上一步得到的总值。"}},{"tags":["more"],"cells":{"modifier":"两个独立的更多加成","how-combined":"每个更多相乘，且彼此相乘","example":"x1.2 与 x1.5 合计为 x1.8。"}},{"tags":["less"],"cells":{"modifier":"“更少%”修正","how-combined":"与更多一样相乘，但降低总值","example":"20% 更少即对累计总值施加 x0.8。"}}],"note":"因为更多乘算会相乘，少量更多往往胜过在同一类别中堆叠大量增大。"},{"id":"conversion","order":5,"title":"转化与额外获得","type":"overview","visible":true,"toc":true,"paragraphs":["转化与额外获得是两种不同的机制，位于流程的不同位置。转化按百分比把一种类型的伤害变为另一种类型。若你把 90% 物理转化为火焰，则 90% 的伤害变为火焰，仅剩余 10% 保持物理。","额外获得则不同。“额外获得 X% 的 Y 作为额外 Z”在原始 Y 之上追加一笔 Z 类型伤害，而不移除原 Y。例如“额外获得 20% 物理作为额外火焰”会保留你全部物理伤害，并额外增加一笔按你物理总额计算的 20% 火焰伤害。","流放之路2 中转化的具体顺序与任何类型排序规则随版本变化；请以当前客户端的实时表现为准，不要套用旧的流放之路1 链式假设，那在此并不适用。"],"bullets":["转化：把一种伤害类型变为另一种，移除被转化的原始部分。","额外获得：在保留原始伤害的同时追加一种新的伤害类型。","两者都位于增大与更多之后、敌方抗性步骤之前。","流放之路2 的转化规则不同于旧版严格的流放之路1 链路，不要假设相同顺序。"]},{"id":"worked-example-one","order":6,"title":"示例一：附加伤害与转化","type":"data-table","visible":true,"toc":true,"caption":"一次物理攻击。所有数值均为假定的教学值；请用你真实技能的基础、附加、增大与转化数值替换。","columns":[{"key":"case","label":"情形"},{"key":"setup","label":"配置"},{"key":"calculation","label":"计算"},{"key":"result","label":"结果"}],"filters":[],"rows":[{"tags":["physical"],"cells":{"case":"裸物理命中","setup":"基础 100 物理，无附加，无增大","calculation":"100 x 1.00 = 100","result":"100 物理"}},{"tags":["physical"],"cells":{"case":"物理 + 附加 + 90% 转化为火焰","setup":"基础 100 物理，附加 +50 物理，100% 增大物理","calculation":"(100 + 50) x 2.00 = 300 物理；转化 90% 为火焰 = 270 火焰 + 30 物理","result":"270 火焰，30 物理"}},{"tags":["physical"],"cells":{"case":"同上，0% 转化","setup":"基础 100 物理，附加 +50，100% 增大，无转化","calculation":"(100 + 50) x 2.00 = 300 物理","result":"300 物理"}}],"note":"转化步骤在增大与更多已作用于物理总额之后，才改变伤害类型。"},{"id":"worked-example-two","order":7,"title":"示例二：完整流程","type":"data-table","visible":true,"toc":true,"caption":"包含两段增大、两个更多、一次暴击与敌方抗性的完整链路。所有数值均为假定的教学值。","columns":[{"key":"case","label":"情形"},{"key":"setup","label":"配置"},{"key":"calculation","label":"计算"},{"key":"result","label":"结果"}],"filters":[],"rows":[{"tags":["crit"],"cells":{"case":"带暴击的完整流程","setup":"基础 100；增大 50% + 30%（80%）；更多 20%；更多 50%；暴击 150%；敌方 75% 抗性","calculation":"100 x 1.8 = 180；x1.2 = 216；x1.5 = 324；x1.5 暴击 = 486；x(1 - 0.75) = 121.5","result":"造成 121.5 伤害"}},{"tags":["physical"],"cells":{"case":"无暴击的相同情形","setup":"同上但无暴击倍率","calculation":"100 x 1.8 = 180；x1.2 = 216；x1.5 = 324；x(1 - 0.75) = 81","result":"造成 81 伤害"}}],"note":"抗性在最后、敌方一侧生效，位于暴击与你所有缩放之后。"},{"id":"scaling-matrix","order":8,"title":"各类修正的生效位置","type":"data-table","visible":true,"toc":true,"caption":"常见修正桶位及其在流程中的位置地图。请将桶位与技能实际的伤害方式对应。","columns":[{"key":"modifier-type","label":"修正类型"},{"key":"where-applies","label":"生效位置"},{"key":"notes","label":"说明"}],"filters":[],"rows":[{"tags":["attack"],"cells":{"modifier-type":"攻击/法术伤害","where-applies":"缩放命中的基础类别","notes":"“增大攻击伤害”是一个桶位；根据技能造成伤害的方式选择。"}},{"tags":["projectile"],"cells":{"modifier-type":"投射物伤害","where-applies":"命中为投射物时生效","notes":"在技能为投射物时有其独立的增大与更多桶位。"}},{"tags":["elemental"],"cells":{"modifier-type":"元素伤害","where-applies":"适用于所有火焰、冰霜与闪电伤害","notes":"在转化把物理变为元素之后尤为强力。"}},{"tags":["gem-level"],"cells":{"modifier-type":"技能/天赋等级","where-applies":"直接提升技能基础伤害","notes":"提升技能等级通常是最强的单一缩放杠杆。"}},{"tags":["dot"],"cells":{"modifier-type":"异常状态/持续伤害","where-applies":"持续伤害的独立缩放","notes":"持续伤害不像直接命中那样使用暴击命中流程。"}}],"note":"交叉指南背景：关于各桶位的深入细节，请参阅攻击/法术/命中/持续伤害、抗性与穿透、以及暴击相关指南。"},{"id":"planner-vs-tooltip","order":9,"title":"为何配装器与提示框可能不同","type":"common-mistakes","visible":true,"toc":true,"paragraphs":["配装器与游戏内提示框都是估算值。在实时客户端中用真实技能验证之前，两者都不是绝对真相。它们可能因取整、不支持的修正，或对增益与敌人的假设不同而相互矛盾。"],"bullets":["把配装器的数值当作最终伤害，却未用真实技能核对。","把游戏内提示框当作精确值，而它可能排除了增益、异常状态或特定敌人的条件。","忘记转化与额外获得会改变伤害类型，提示框可能按类型拆分显示。","把配装器假定的暴击几率与你真实的命中率比较，却未计入命中与距离惩罚。","假设配装器显示的抗性与你实际面对的敌人一致。"]},{"id":"community-cases","order":10,"title":"常见混淆点","type":"card-grid","visible":true,"toc":true,"intro":"玩家在流放之路2 伤害缩放上常提出的混淆（转述）。","cards":[{"title":"两个增大不会相乘","tag":"increased","body":["玩家以为 50% 与 30% 增大会相乘成更大的提升；它们实际相加为 80% 并只生效一次。"]},{"title":"转化会移除原始伤害","tag":"conversion","body":["部分玩家以为转化为火焰后仍保留物理；纯转化会用新类型替换被转化的那部分。"]},{"title":"额外获得保留基础","tag":"gain-as-extra","body":["相反的混淆：玩家没意识到“额外获得 X% 作为额外 Z”是在不移除原始伤害的前提下追加新伤害。"]},{"title":"承受伤害不是你的伤害","tag":"resistance","body":["玩家有时把敌方“承受伤害”修正理解为能提升自身输出缩放；它只影响目标受到的伤害。"]}]},{"id":"video-guide","order":11,"title":"视频指南","type":"video","visible":true,"toc":true,"entries":[{"label":"Complete Damage Guide - Path of Exile 2","creator":"silentstill","description":"完整讲解流放之路2 的伤害计算，涵盖基础、附加、增大、更多、转化、额外获得、暴击与敌方减伤。","takeaway":"记住顺序：基础→附加→增大（加法）→更多（乘法）→转化→额外获得→暴击→敌方抗性。","url":"https://www.youtube.com/watch?v=MvwmmjVIes0","timestamps":[{"label":"简介","time":"0:00"},{"label":"基础与附加伤害","time":"2:10"},{"label":"增大修正","time":"6:30"},{"label":"更多与更少乘算","time":"10:45"},{"label":"转化与额外获得","time":"15:20"},{"label":"计算示例","time":"20:05"},{"label":"总结","time":"25:30"}]}]},{"id":"faq","order":12,"title":"常见问题","type":"faq","visible":true,"toc":true,"items":[{"question":"转化发生在增大与更多之前还是之后？","answer":["在当前的流放之路2 流程中，转化位于增大（加法）与更多（乘算）缩放阶段之后、敌方抗性步骤之前。被转化的数值基于已经缩放完成的伤害。"]},{"question":"若我有 200% 增大伤害，是否造成三倍伤害？","answer":["是的，前提是全部落在同一类别。200% 增大意味着该类别 x3.00 的乘算。不同类别各自缩放其对应的部分。"]},{"question":"20% 更多是否优于 20% 增大？","answer":["视情况而定，但更多相乘、增大相加。20% 更多是让整个累计总值乘 1.2，而 20% 增大只是并入其类别中。当你已有较大总值时，更多通常更强。"]},{"question":"我能对同一笔伤害既转化又额外获得吗？","answer":["可以。它们是独立步骤。你可以把部分伤害类型转化为另一种，同时另行额外获得一种类型而不移除原始伤害，从而在一次命中中产生多种伤害类型。"]},{"question":"暴击会乘算我的转化与额外获得吗？","answer":["暴击在流程中位于转化与额外获得之后，因此暴击倍率缩放的是已经过转化与额外增强的总值，而不只是基础值。"]},{"question":"为何我的提示框与配装器不一致？","answer":["两者对增益、敌方抗性、命中与距离的假设不同。请把两者都当作估算值，并以实时客户端中的真实技能为准。"]}]},{"id":"sources","order":13,"title":"来源与验证","type":"sources","visible":true,"toc":true,"categories":[{"label":"官方 wiki - 伤害","description":"流放之路2 wiki 关于伤害、转化与修正类型的参考","url":"https://poe2wiki.net/wiki/Damage"},{"label":"社区中心 - Maxroll PoE2","description":"流放之路2 机制与配装中心，含伤害缩放讨论","url":"https://maxroll.gg/poe2"},{"label":"视频指南 (silentstill)","description":"流放之路2 完整伤害指南，覆盖整个流程","url":"https://www.youtube.com/watch?v=MvwmmjVIes0"}],"verificationChecklist":{"status":"pending-pc","method":"in-game","verifiedClientVersion":"0.5.4"}},{"id":"changelog","order":14,"title":"更新日志","type":"changelog","visible":true,"toc":true,"entries":[{"date":"2026-08-03","changes":["针对流放之路2 抢先体验 0.5.4 首次发布伤害缩放顺序、转化与额外获得指南。","新增直接回答、关键术语、计算顺序、加法与乘法、转化与额外获得、两个计算示例、缩放地图、配装器与提示框、常见混淆、视频、常见问题与来源。"]}]}],"relatedBuildIds":[],"relatedBossIds":[],"relatedItemIds":[],"relatedPatchIds":[],"relatedSkillIds":[],"sources":[{"label":"PoE2 wiki - 伤害","url":"https://poe2wiki.net/wiki/Damage","sourceType":"official"},{"label":"Maxroll - 流放之路2 中心","url":"https://maxroll.gg/poe2","sourceType":"community"},{"label":"silentstill - 完整伤害指南 (YouTube)","url":"https://www.youtube.com/watch?v=MvwmmjVIes0","sourceType":"community"}],"seo":{"title":"流放之路2 伤害缩放顺序、转化与额外获得指南","description":"了解流放之路2 的伤害流程：基础、附加、增大、更多、转化、额外获得、暴击与敌方抗性，并配有计算示例。","noindex":false}},{"id":"resistance-curse-exposure-penetration","slug":"resistance-curse-exposure-penetration","locale":"en","type":"guide","status":"published","featured":false,"title":"Resistance, Curses, Exposure, and Penetration in Path of Exile 2","shortTitle":"Resistance, Curses & Penetration","summary":"How enemy resistances, resistance-reduction Curses, Exposure, Ignore Resistance, and Penetration interact in the Path of Exile 2 damage pipeline, and how to choose the right debuff for your build.","description":"A mechanics guide to Path of Exile 2 resistance interaction: the difference between Curses, Exposure, Penetration, and Ignore Resistance, the order they apply in the damage pipeline, how they affect Damage over Time, uptime and coverage conditions, and a decision aid for prioritising debuffs.","guideCategory":"mechanics","heroImage":"/images/skills/freezing-mark.webp","cardImage":"/images/skills/freezing-mark.webp","imageAlt":"A Path of Exile 2 mark skill icon representing curses, exposure and penetration debuffs","estimatedReadingMinutes":16,"prerequisites":["A basic understanding of how enemy resistances reduce incoming damage of each type","Familiarity with applying curses, marks, or exposure to enemies in combat"],"patch":"Path of Exile 2 Early Access 0.5.4","league":"Standard","patchStatus":"current","verificationStatus":"pending-pc","verifiedClientVersion":"0.5.4","author":"Exile2 Guides Editorial Team","reviewer":"Max","createdAt":"2026-08-03","publishedAt":"2026-08-03","updatedAt":"2026-08-03","tags":["mechanics","resistance","curse","exposure","penetration","damage","debuff"],"sections":[{"id":"quick-answer","order":10,"title":"Direct answers","type":"quick-answer","visible":true,"toc":true,"items":[{"title":"What is the difference between a Curse, Exposure, and Penetration?","body":["All three help your damage beat enemy resistances, but they act in different places. A Curse and Exposure are debuffs applied to the enemy, so they reduce the enemy's actual resistance while they are active. Penetration is a property of your hit that lowers the resistance value your hit is calculated against — it never changes the enemy's persistent resistance."]},{"title":"Does Penetration reduce the enemy's real resistance?","body":["No. In Path of Exile 2, Penetration is local to your hit and is applied last in the resistance pipeline. It reduces the resistance value used for that hit, but it does not alter the enemy's stored or persistent resistance, and it generally cannot push that value below 0%."]},{"title":"Do Exposure and Curses reduce the enemy's actual resistance?","body":["Yes, for their duration. Exposure and resistance Curses (such as Elemental Weakness) are debuffs on the enemy, so while they are active the enemy's actual resistance is lower. They also carry coverage and uptime conditions you must keep in mind, such as the Curse Limit and boss curse-effect reduction."]},{"title":"Do these mechanics affect Damage over Time?","body":["Because Exposure and Curses lower the enemy's actual resistance, Damage over Time benefits from them. Penetration is applied per hit, so a standalone Damage over Time instance that is not itself a hit generally does not receive Penetration. The exact Damage over Time interaction is version-sensitive — see the worked examples and treat precise values as pending PC verification."]}]},{"id":"definitions","order":20,"title":"Definitions","type":"overview","visible":true,"toc":true,"paragraphs":["These four terms describe four different ways damage interacts with enemy resistance in Path of Exile 2. Keeping them distinct is the single most common fix for resistance confusion, because two of them (Curse and Exposure) change the enemy, while one (Penetration) changes only your hit.","Resistance is the enemy's defensive stat. A Curse and Exposure are debuffs applied to the enemy that lower its resistance for a duration. Penetration and Ignore Resistance are properties attached to your damage that change how the resistance check resolves for the hit."],"bullets":["Resistance: the enemy's percentage reduction against a damage type (Fire, Cold, Lightning, Chaos). The player-facing default resistance cap is 75%.","Resistance Reduction: any effect that lowers the enemy's resistance value — most commonly delivered through Exposure and Curses.","Exposure: a debuff placed on the enemy that reduces its resistance to the relevant element(s) by a percentage for a duration. It is a debuff on the enemy, not a property of your hit.","Penetration: a property of your hit that reduces the resistance value the hit is calculated against. It is local to you, applied last, and typically cannot reduce the value below 0%. It does not change the enemy's persistent resistance.","Ignore Resistance: a rare effect that treats the relevant resistance as 0% for that damage instance and bypasses further resistance modification for it. It does not lower the enemy's stored resistance."]},{"id":"interaction-matrix","order":30,"title":"How each mechanic interacts","type":"data-table","visible":true,"toc":true,"caption":"The core comparison. The key split is whether the mechanic changes the enemy's actual persistent resistance (Curse, Exposure) or only the value used for your hit (Penetration, Ignore Resistance).","columns":[{"key":"mechanic","label":"Mechanic"},{"key":"changes-actual","label":"Changes actual resistance?"},{"key":"affects-hit","label":"Affects Hit?"},{"key":"affects-dot","label":"Affects DoT?"},{"key":"stacks","label":"Stacks with others?"},{"key":"upkeep","label":"Needs active upkeep?"}],"filters":[],"rows":[{"tags":["curse"],"cells":{"mechanic":"Curse (e.g. Elemental Weakness)","changes-actual":"Yes, while active (debuff on enemy)","affects-hit":"Yes","affects-dot":"Yes (enemy resistance is lower)","stacks":"Yes, with Exposure and Penetration","upkeep":"Yes (duration, limited by Curse Limit)"}},{"tags":["exposure"],"cells":{"mechanic":"Exposure","changes-actual":"Yes, while active (debuff on enemy)","affects-hit":"Yes","affects-dot":"Yes (enemy resistance is lower)","stacks":"Yes, with Curse and Penetration","upkeep":"Yes (duration, must be refreshed)"}},{"tags":["penetration"],"cells":{"mechanic":"Penetration","changes-actual":"No (applied to the hit only)","affects-hit":"Yes","affects-dot":"Generally no (applied per hit)","stacks":"Yes, with Curse and Exposure","upkeep":"No (passive property of your hit)"}},{"tags":["ignore-resistance"],"cells":{"mechanic":"Ignore Resistance","changes-actual":"No (bypasses it for the instance)","affects-hit":"Yes (treats resistance as 0%)","affects-dot":"Implementation-dependent; treat as pending PC verification","stacks":"Rare; generally separate from other reduction for that instance","upkeep":"No"}}],"note":"The exact Exposure percentage and Curse Limit are version-sensitive — phrase specific numbers as pending PC verification. The structural behavior above reflects the current PoE2 pipeline."},{"id":"order","order":40,"title":"Order of operations in the damage pipeline","type":"data-table","visible":true,"toc":true,"caption":"Enemy resistance modification follows a strict sequence. Penetration is always applied last and is local to the attacker, so it never changes the enemy's persistent resistance.","columns":[{"key":"step","label":"Step"},{"key":"what-applies","label":"What applies"},{"key":"note","label":"Note"}],"filters":[],"rows":[{"tags":[],"cells":{"step":"1. Baseline","what-applies":"Enemy total resistance (including map and waystone modifiers)","note":"The starting value all later steps modify"}},{"tags":[],"cells":{"step":"2. Resistance reduction","what-applies":"Exposure and Curses","note":"Debuffs on the enemy; can push resistance below zero"}},{"tags":[],"cells":{"step":"3. Inversion (optional)","what-applies":"Effects such as Rakiata's Flow","note":"Flips the current resistance value, positive or negative; lineage-limited"}},{"tags":[],"cells":{"step":"4. Penetration","what-applies":"Your hit's Penetration","note":"Applied last, local to you, typically cannot reduce below 0%"}}],"note":"Because Penetration is the final step and local to the attacker, it does not alter the enemy's persistent resistance and does not interfere with inversion the way Exposure and Curses do."},{"id":"boss-scenario","order":50,"title":"Worked examples: normal monster vs boss","type":"data-table","visible":true,"toc":true,"caption":"Illustrative calculations using an enemy with 75% Lightning Resistance and a 1000-damage Lightning hit. Numbers are teaching examples; exact Exposure values and boss curse-reduction percentages are pending PC verification.","columns":[{"key":"case","label":"Case"},{"key":"setup","label":"Setup"},{"key":"calculation","label":"Calculation"},{"key":"result","label":"Result"}],"filters":[],"rows":[{"tags":["no-debuff"],"cells":{"case":"Normal monster, no debuffs","setup":"Enemy 75% Lightning Res, 1000 hit, no Penetration or Exposure","calculation":"1000 x (1 - 0.75)","result":"250 damage"}},{"tags":["exposure","penetration"],"cells":{"case":"Normal monster with Exposure and Penetration","setup":"Enemy 75% Res, Exposure -25%, 20% Penetration, 1000 hit","calculation":"Exposure lowers enemy to 50%; Penetration lowers the value used to 30%; 1000 x (1 - 0.30)","result":"700 damage"}},{"tags":["boss","curse"],"cells":{"case":"Boss with reduced curse effect","setup":"Enemy 75% Res, Exposure -25% but boss takes 50% reduced curse effect, 20% Penetration, 1000 hit","calculation":"Effective Exposure only -12.5%, enemy at 62.5%; Penetration to 42.5%; 1000 x (1 - 0.425)","result":"575 damage (coverage differs from a normal monster)"}}],"note":"The boss example shows why uptime and coverage matter: the same Exposure is weakened by boss curse-effect reduction, so the real damage gain is smaller than on a normal monster."},{"id":"hit-vs-dot","order":60,"title":"Hit builds vs Damage over Time builds","type":"data-table","visible":true,"toc":true,"caption":"Whether your build should invest in Penetration versus Exposure or Curses depends on whether your damage is a hit or Damage over Time.","columns":[{"key":"build-type","label":"Build type"},{"key":"benefits-penetration","label":"Benefits from Penetration?"},{"key":"benefits-exposure","label":"Benefits from Exposure?"},{"key":"notes","label":"Notes"}],"filters":[],"rows":[{"tags":["hit"],"cells":{"build-type":"Hit build (direct hits)","benefits-penetration":"Yes, directly","benefits-exposure":"Yes (enemy resistance is lower)","notes":"Both layers apply; Penetration is checked last after Exposure and Curses."}},{"tags":["dot"],"cells":{"build-type":"Damage over Time build","benefits-penetration":"Generally no (DoT is not a hit)","benefits-exposure":"Yes (enemy resistance is lower while debuffed)","notes":"Prioritise Exposure and Curses; Penetration usually does nothing for standalone DoT."}},{"tags":["hybrid"],"cells":{"build-type":"Hybrid (hit that also applies DoT)","benefits-penetration":"Only the hit portion","benefits-exposure":"Yes, for both portions","notes":"The initial hit gets Penetration; the ensuing DoT benefits from the enemy's reduced resistance."}}],"note":"The precise Penetration-versus-DoT rule is version-sensitive; treat exact behavior as pending PC verification."},{"id":"debuff-uptime","order":70,"title":"Debuff uptime and coverage","type":"overview","visible":true,"toc":true,"paragraphs":["Exposure and Curses are only as strong as their uptime. A Curse must be applied to the target and stays only for its debuff duration, and the number of Curses an enemy can suffer at once is limited by the Curse Limit. In Path of Exile 2 the default Curse Limit is low (often one), and specific items or support gems can raise it — confirm the exact number for 0.5.4 as pending PC verification.","Bosses and other powerful enemies frequently have reduced Curse Effect, which shrinks the resistance reduction a Curse provides against them. Exposure must also be refreshed; it does not last forever, and some skills app
