<!-- 文件职责：为静态托管平台提供真实 HTTP 404 时返回的完整错误文档，不依赖客户端路由恢复。 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found | Exile2 Guides</title>
    <meta name="description" content="The requested page does not exist." />
    <style>
      body {
        background: #0b0e10;
        color: #ece7dc;
        font:
          18px/1.7 system-ui,
          sans-serif;
        margin: 0;
      }
      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 760px;
        min-height: 100vh;
        padding: 12vh 24px;
      }
      p {
        color: #a8a39a;
      }
      a {
        color: #d8b673;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 32px;
      }
      .button {
        border: 1px solid #6a5632;
        border-radius: 4px;
        padding: 10px 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>This address does not exist, has moved, or is not published yet.</p>
      <div class="actions">
        <a class="button" href="/en/">Return home</a>
        <a class="button" href="/en/search/">Search guides</a>
      </div>
      <p>
        <a href="/en/builds/">Builds</a> · <a href="/en/bosses/">Bosses</a> ·
        <a href="/en/guides/">Guides</a>
      </p>
    </main>
  </body>
</html>
